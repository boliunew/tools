<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F1EC">
<title>新闻 · 今日大事与英文精选</title>
<style>
:root{
  --bg:#F3F1EC; --paper:#FFFFFF; --ink:#1B1E23; --soft:#626A73; --faint:#98A0A8; --line:#E0DDD5; --chip:#F0EEE8;
  --accent:#1F6F66; --accent-ink:#FFFFFF; --accent-soft:#DCEEEA;
  --l1:#2E7D32; --l2:#1F6F66; --l3:#1E5AA8; --l4:#B8660B; --l5:#C0392B;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15181C; --paper:#1D2126; --ink:#E9ECEF; --soft:#A3ABB4; --faint:#6F7881; --line:#2E343B; --chip:#262B31;
    --accent:#5CC2B3; --accent-ink:#0E1A18; --accent-soft:#1E3632;
    --l1:#86D48A; --l2:#5CC2B3; --l3:#7FB2FF; --l4:#F2B35E; --l5:#FF8A73;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;font-size:15px;line-height:1.5}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{position:-webkit-sticky;position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;min-height:56px}
.brand{font-weight:700;font-size:19px;margin-right:auto;display:flex;align-items:center;color:var(--ink);text-decoration:none}
.brand i{display:inline-block;width:22px;height:22px;border-radius:6px;background:var(--accent);margin-right:8px;position:relative}
.brand i:after{content:"";position:absolute;left:5px;right:5px;top:6px;height:2px;background:var(--accent-ink);box-shadow:0 4px 0 var(--accent-ink),0 8px 0 var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--paper);padding:6px 12px;border-radius:10px;font-size:13px;display:inline-flex;align-items:center;min-height:34px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--soft)}
main{padding:12px 0 80px}
.meta{font-size:13px;color:var(--soft);margin:2px 0 8px}
.filters{margin:6px 0 2px}
.row{display:flex;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.lab{font-size:12px;color:var(--faint);margin-right:8px;width:30px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px;font-size:13px;margin:0 6px 6px 0}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip .n{opacity:.65;margin-left:3px;font-size:12px}
.switch{display:inline-flex;align-items:center;font-size:13px;color:var(--soft);cursor:pointer;margin:0 12px 6px 0}
.switch input{margin:0 5px 0 0;accent-color:var(--accent)}
h3{font-size:13px;letter-spacing:.06em;color:var(--faint);margin:20px 0 8px;font-weight:600}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.art{padding:14px 16px;margin-bottom:10px}
.art.read{opacity:.55}
.a-top{display:flex;align-items:center;font-size:12.5px;color:var(--faint);margin-bottom:5px;flex-wrap:wrap}
.lv{font-weight:700;font-size:12px;padding:1px 7px;border-radius:6px;margin-right:8px;border:1.5px solid currentColor}
.lv-A2{color:var(--l1)} .lv-B1{color:var(--l2)} .lv-B2{color:var(--l3)} .lv-C1{color:var(--l4)} .lv-C2{color:var(--l5)}
.a-top .src{font-weight:600;color:var(--soft);margin-right:6px}
.a-t{font-size:18px;font-weight:700;line-height:1.35;font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;color:var(--ink);text-decoration:none;display:block}
.a-s{color:var(--soft);font-size:14px;margin:6px 0 8px}
.a-st{font-size:12.5px;color:var(--faint)}
.voc{margin-top:8px}
.voc a,.voc span{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--soft);text-decoration:none;margin:0 5px 5px 0}
.voc a:hover{color:var(--accent)}
.a-s [data-w]{color:inherit}
.hint-tap{font-size:12px;color:var(--faint);margin:0 0 8px}
.acts{display:flex;flex-wrap:wrap;margin-top:8px}
.acts > *{margin:0 8px 0 0}
.empty{padding:40px 16px;text-align:center;color:var(--soft);line-height:1.8}
.bars{display:flex;align-items:flex-end;height:36px;margin:4px 0 2px}
/* 今日 */
.tabs{display:flex;gap:6px;padding:0 0 10px}
.tabs button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 14px;font-size:14px}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.sec{display:flex;align-items:baseline;gap:8px;margin:18px 0 8px}
.sec b{font-size:16px}
.sec small{font-size:12px;color:var(--faint)}
.big{padding:12px 14px;margin-bottom:9px;display:flex;gap:10px}
.big .no{flex:0 0 22px;height:22px;border-radius:7px;background:var(--chip);color:var(--soft);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.big.hot .no{background:var(--accent);color:var(--accent-ink)}
.big .bd{flex:1;min-width:0}
.big a.t{font-size:16px;font-weight:700;line-height:1.4;color:var(--ink);text-decoration:none;display:block}
.big .s{font-size:13.5px;color:var(--soft);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.big .m{font-size:12px;color:var(--faint);margin-top:5px}
.big .m b{color:var(--accent);font-weight:600}
.big .also{font-size:12px;margin-top:3px}
.big .also a{color:var(--soft);margin-right:8px}
.odd{padding:12px 14px;margin-bottom:9px}
.odd a.t{font-size:15.5px;font-weight:700;line-height:1.4;color:var(--ink);text-decoration:none;display:block}
.odd .en{font-size:13px;color:var(--soft);margin-top:2px;font-family:Georgia,"Iowan Old Style",serif}
.odd .m{font-size:12px;color:var(--faint);margin-top:5px}
.odd .m a,.more{color:var(--accent)}
.otd{padding:6px 14px}
.otd .ev{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14.5px;line-height:1.55}
.otd .ev:last-of-type{border-bottom:0}
.otd .y{flex:0 0 3.6em;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;text-align:right}
.hol{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.hol span{font-size:12.5px;background:var(--chip);color:var(--soft);border-radius:999px;padding:2px 10px}
.more{display:block;text-align:center;font-size:13px;padding:10px 0 4px}
footer{color:var(--faint);font-size:12px;text-align:center;padding:24px 0 10px;line-height:1.7}
</style>
<script src="sync.js?v=1"></script>
<script src="lookup.js?v=2"></script>
</head>
<body>
<header class="top"><div class="wrap"><div class="bar">
  <a class="brand" href="./"><i></i>新闻</a>
  <button class="btn ghost" id="refreshBtn">🔄 刷新</button><a class="btn ghost" href="sublingo.html">SubLingo</a>
</div><div class="tabs" id="tabs"><button data-tab="today">📌 今日</button><button data-tab="en">📰 英文精选</button></div></div></header>
<main class="wrap" id="app"><div class="empty">加载中…</div></main>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app'), D = null;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function get(k, d) { try { var v = window.localStorage.getItem('news:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function set(k, v) { try { window.localStorage.setItem('news:' + k, JSON.stringify(v)); } catch (e) { } }
  var F = { lv: get('lv', 'all'), topic: get('topic', 'all'), src: 'all', hideRead: get('hideRead', false) };
  var READ = get('read', {});
  (function () { var cut = Date.now() - 14 * 864e5, k; for (k in READ) if (READ.hasOwnProperty(k) && READ[k] < cut) delete READ[k]; })();
  var LEVELS = ['A2', 'B1', 'B2', 'C1', 'C2'], LVZH = { A2: '入门', B1: '初中级', B2: '中级', C1: '中高级', C2: '高级' };

  function ago(iso) {
    var m = (Date.now() - new Date(iso).getTime()) / 60000;
    if (m < 60) return Math.max(1, Math.round(m)) + ' 分钟前';
    if (m < 1440) return Math.round(m / 60) + ' 小时前';
    return Math.round(m / 1440) + ' 天前';
  }
  function dayKey(iso) { var d = new Date(iso); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function dayName(iso) {
    var d = new Date(iso), t = new Date(), y = new Date(Date.now() - 864e5);
    if (dayKey(iso) === dayKey(t.toISOString())) return '今天';
    if (dayKey(iso) === dayKey(y.toISOString())) return '昨天';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  var TAB = get('tab', 'today'), T = null, prevT = null;
  function setTab(t) {
    TAB = t; set('tab', t);
    var bs = document.querySelectorAll('#tabs button'), i;
    for (i = 0; i < bs.length; i++) bs[i].className = bs[i].getAttribute('data-tab') === t ? 'on' : '';
    window.scrollTo(0, 0);
    if (t === 'today') { if (T) renderToday(); else loadToday(false); } else { if (D) render(); else load(false); }
  }
  document.getElementById('tabs').onclick = function (e) { var b = e.target.closest('[data-tab]'); if (b) setTab(b.getAttribute('data-tab')); };

  function loadToday(manual) {
    var rb = document.getElementById('refreshBtn');
    if (manual) { rb.disabled = true; rb.textContent = '⏳ 刷新中'; }
    if (!T) app.innerHTML = '<div class="empty">加载中…</div>';
    var x = new XMLHttpRequest();
    x.open('GET', 'news/data/today.json?t=' + Date.now());
    x.onload = function () {
      if (x.status !== 200) { app.innerHTML = '<div class="card empty" style="margin-top:16px"><b style="font-size:17px;color:var(--ink)">等待第一次更新</b><br>每天早上 6 点和晚上 6 点（太平洋时间）自动更新。</div>'; return; }
      try { T = JSON.parse(x.responseText); } catch (e) { app.innerHTML = '<div class="empty">数据格式错误</div>'; return; }
      if (TAB === 'today') renderToday();
      if (manual) flashMsg(prevT && prevT === T.generated ? '已经是最新的了（' + ago(T.generated) + '更新）' : '已刷新 ✓');
      prevT = T.generated;
    };
    x.onloadend = function () { rb.disabled = false; rb.textContent = '🔄 刷新'; };
    x.onerror = function () { app.innerHTML = '<div class="empty">网络错误，请稍后刷新。</div>'; };
    x.send();
  }
  function renderToday() {
    var now = new Date(), WK = '日一二三四五六', h = '', i, j, c;
    var key = ('0' + (now.getMonth() + 1)).slice(-2) + '-' + ('0' + now.getDate()).slice(-2), otd = (T.onthisday || {})[key];
    h += '<div class="meta">' + (now.getMonth() + 1) + '月' + now.getDate() + '日 周' + WK.charAt(now.getDay()) + ' · 更新于 ' + ago(T.generated) + ((Date.now() - new Date(T.generated).getTime()) / 36e5 > 20 ? ' · <b style="color:#C8412B">⚠️ 超过 20 小时没更新，可能是自动任务失败（<a href="https://github.com/boliunew/tools/actions" target="_blank" rel="noopener">去看看</a>）</b>' : '') + (T.stale_big ? ' · 新闻源这次没抓到，显示的是上一次的' : '') + '</div>';
    var big = T.big || [];
    if (big.length) {
      h += '<div class="sec"><b>📰 今日大事</b><small>几家中文媒体都在报的排前面</small></div>';
      for (i = 0; i < big.length && i < 10; i++) {
        c = big[i];
        var also = (c.others || []).filter(function (o) { return o.source !== c.source; }).slice(0, 3);
        h += '<div class="card big' + (c.n >= 2 ? ' hot' : '') + '"><div class="no">' + (i + 1) + '</div><div class="bd"><a class="t" href="' + esc(c.link) + '" target="_blank" rel="noopener">' + esc(c.title) + '</a>' +
          (c.summary ? '<div class="s">' + esc(c.summary) + '</div>' : '') +
          '<div class="m">' + esc(c.source) + (c.n >= 2 ? ' · <b>' + c.n + ' 家报道</b>' : '') + (c.time ? ' · ' + ago(c.time) : '') + '</div>' +
          (also.length ? '<div class="also">另见：' + also.map(function (o) { return '<a href="' + esc(o.link) + '" target="_blank" rel="noopener" title="' + esc(o.title) + '">' + esc(o.source) + '</a>'; }).join('') + '</div>' : '') + '</div></div>';
      }
    }
    var odd = T.odd || [];
    if (odd.length) {
      h += '<div class="sec"><b>🤪 趣闻</b><small>世界各地的奇闻怪事，中文是机器翻译</small></div>';
      for (i = 0; i < odd.length; i++) {
        c = odd[i];
        h += '<div class="card odd"><a class="t" href="' + esc(c.link) + '" target="_blank" rel="noopener">' + (c.video ? '🎬 ' : '') + esc(c.zh || c.title) + '</a>' + (c.zh ? '<div class="en">' + esc(c.title) + '</div>' : '') +
          '<div class="m">' + esc(c.source) + (c.time ? ' · ' + ago(c.time) : '') + ' · <a href="sublingo.html?url=' + encodeURIComponent(c.link) + '">SubLingo 精读</a></div></div>';
      }
    }
    if (otd && otd.events && otd.events.length) {
      h += '<div class="sec"><b>📅 历史上的今天</b><small>' + esc(otd.page) + '</small></div><div class="card otd">';
      for (j = 0; j < otd.events.length; j++) {
        var e = otd.events[j], y = e.year < 0 ? '前' + (-e.year) : e.year;
        h += '<div class="ev"><span class="y">' + y + '</span><span>' + esc(e.text) + '</span></div>';
      }
      if (otd.holidays && otd.holidays.length) h += '<div class="hol">' + otd.holidays.map(function (x) { return '<span>🎉 ' + esc(x) + '</span>'; }).join('') + '</div>';
      h += '<a class="more" href="' + esc(otd.url) + '" target="_blank" rel="noopener">维基百科上还有 ' + Math.max(0, (otd.total || 0) - otd.events.length) + ' 条 →</a></div>';
    }
    if (!big.length && !odd.length && !otd) h += '<div class="card empty">今天的内容还没抓到，稍后刷新。</div>';
    h += '<footer>今日大事来自 BBC 中文、德国之声、法广、纽约时报中文网、中新网等公开 RSS，只展示标题和摘要，版权归原媒体。<br>趣闻来自 UPI 等英文媒体，标题由 MyMemory 机器翻译。历史上的今天来自中文维基百科（CC BY-SA 4.0）。</footer>';
    app.innerHTML = h;
  }

  var prevGen = null;
  function load(manual) {
    var rb = document.getElementById('refreshBtn');
    if (manual) { rb.disabled = true; rb.textContent = '⏳ 刷新中'; }
    var x = new XMLHttpRequest();
    x.open('GET', 'news/data/latest.json?t=' + Date.now());
    x.onload = function () {
      if (x.status !== 200) { app.innerHTML = '<div class="card empty" style="margin-top:16px"><b style="font-size:17px;color:var(--ink)">等待第一次更新</b><br>每天早上 6 点和晚上 6 点（太平洋时间）自动抓取最新新闻。<br><a href="https://github.com/boliunew/tools/actions/workflows/news.yml" target="_blank" rel="noopener">想马上看？去 GitHub 手动运行一次 →</a></div>'; return; }
      try { D = JSON.parse(x.responseText); } catch (e) { app.innerHTML = '<div class="empty">数据格式错误</div>'; return; }
      if (TAB === 'en') render();
      if (manual) { flashMsg(prevGen && prevGen === D.generated ? '已经是最新的了（' + ago(D.generated) + '抓取）' : '已刷新 ✓'); }
      prevGen = D.generated;
    };
    x.onloadend = function () { rb.disabled = false; rb.textContent = '🔄 刷新'; };
    x.onerror = function () { app.innerHTML = '<div class="empty">网络错误，请稍后刷新。</div>'; };
    x.send();
  }

  function flashMsg(t) {
    var el = document.getElementById('flash');
    if (!el) { el = document.createElement('div'); el.id = 'flash'; el.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:50;transition:opacity .3s'; document.body.appendChild(el); }
    el.textContent = t; el.style.opacity = '1';
    clearTimeout(el._t); el._t = setTimeout(function () { el.style.opacity = '0'; }, 2200);
  }
  document.getElementById('refreshBtn').onclick = function () { if (TAB === 'today') loadToday(true); else load(true); };

  function chip(key, val, label, n) { return '<button class="chip' + (F[key] === val ? ' on' : '') + '" data-k="' + key + '" data-v="' + esc(val) + '">' + esc(label) + (n != null ? '<span class="n">' + n + '</span>' : '') + '</button>'; }

  function render() {
    var arts = D.articles || [], i, a, h = '';
    var lvN = {}, tpN = {}, srcs = {};
    for (i = 0; i < arts.length; i++) { a = arts[i]; lvN[a.level] = (lvN[a.level] || 0) + 1; tpN[a.topic] = (tpN[a.topic] || 0) + 1; srcs[a.source] = 1; }
    var okFeeds = 0; for (i = 0; i < (D.feeds || []).length; i++) if (D.feeds[i].ok) okFeeds++;
    var ageH = (Date.now() - new Date(D.generated).getTime()) / 36e5;
    h += '<div class="meta">更新于 ' + ago(D.generated) + ' · 共 ' + arts.length + ' 篇 · ' + okFeeds + '/' + (D.feeds || []).length + ' 个新闻源正常 · <a href="https://github.com/boliunew/tools/actions/workflows/news.yml" target="_blank" rel="noopener"' + (ageH > 3 ? ' style="font-weight:600"' : '') + '>立即抓取最新新闻 ↗</a></div>';
    h += '<div class="filters"><div class="row"><span class="lab">难度</span>' + chip('lv', 'all', '全部');
    for (i = 0; i < LEVELS.length; i++) h += chip('lv', LEVELS[i], LEVELS[i] + ' ' + LVZH[LEVELS[i]], lvN[LEVELS[i]] || 0);
    h += '</div><div class="row"><span class="lab">话题</span>' + chip('topic', 'all', '全部');
    for (var t in tpN) if (tpN.hasOwnProperty(t)) h += chip('topic', t, t, tpN[t]);
    h += '</div><div class="row"><span class="lab">来源</span><select id="srcSel" class="chip" style="padding:4px 8px"><option value="all">全部来源</option>';
    for (var s in srcs) if (srcs.hasOwnProperty(s)) h += '<option' + (F.src === s ? ' selected' : '') + '>' + esc(s) + '</option>';
    h += '</select><label class="switch"><input type="checkbox" id="hideRead"' + (F.hideRead ? ' checked' : '') + '>隐藏已读</label></div></div>';
    h += '<div class="hint-tap">💡 点摘要里任何一个词、或下面的生词，就能查词、朗读、收进语境词库。</div>';

    var list = arts.filter(function (a) {
      return (F.lv === 'all' || a.level === F.lv) && (F.topic === 'all' || a.topic === F.topic) && (F.src === 'all' || a.source === F.src) && !(F.hideRead && READ[a.id]);
    });
    if (!list.length) h += '<div class="card empty" style="margin-top:12px">没有符合条件的文章，换个筛选试试。</div>';
    var lastDay = '';
    for (i = 0; i < list.length; i++) {
      a = list[i];
      var dn = dayName(a.time);
      if (dn !== lastDay) { h += '<h3>' + dn + '</h3>'; lastDay = dn; }
      var voc = '';
      for (var j = 0; j < (a.vocab || []).length; j++) voc += '<span data-w="' + esc(a.vocab[j]) + '">' + esc(a.vocab[j]) + '</span>';
      h += '<div class="card art' + (READ[a.id] ? ' read' : '') + '" data-id="' + a.id + '"><div class="a-top"><span class="lv lv-' + a.level + '">' + a.level + '</span><span class="src">' + esc(a.source) + '</span>' + esc(a.topic) + ' · ' + ago(a.time) + '</div>' +
        '<a class="a-t" href="' + esc(a.link) + '" target="_blank" rel="noopener" data-read="1">' + esc(a.title) + '</a>' +
        (a.summary ? '<div class="a-s">' + (window.WordSheet ? WordSheet.wrap(a.summary) : esc(a.summary)) + '</div>' : '') +
        '<div class="a-st">' + a.words + ' 词 · 约 ' + a.minutes + ' 分钟 · 平均句长 ' + a.asl + ' 词' + (a.long ? ' · 长难句 ' + a.long : '') + ' · 生词 ' + Math.round(a.rare * 100) + '%</div>' +
        (voc ? '<div class="voc">' + voc + '</div>' : '') +
        '<div class="acts"><button class="btn" data-say="1">🔊 朗读</button><a class="btn primary" data-read="1" href="sublingo.html?url=' + encodeURIComponent(a.link) + '">SubLingo 精读</a><a class="btn" data-read="1" href="' + esc(a.link) + '" target="_blank" rel="noopener">阅读原文</a></div></div>';
    }
    h += '<footer>新闻来自各媒体公开的 RSS，版权归原作者所有；本页只展示标题、摘要和难度分析。<br>难度根据句长、音节数和词频估算，仅供参考。</footer>';
    app.innerHTML = h;

    var chips = app.querySelectorAll('button.chip');
    for (i = 0; i < chips.length; i++) chips[i].onclick = function () { var k = this.getAttribute('data-k'); F[k] = this.getAttribute('data-v'); set(k, F[k]); render(); };
    document.getElementById('srcSel').onchange = function () { F.src = this.value; render(); };
    document.getElementById('hideRead').onchange = function () { F.hideRead = this.checked; set('hideRead', F.hideRead); render(); };
  }
  function artOf(el) { while (el && !(el.classList && el.classList.contains('art'))) el = el.parentNode; return el; }
  function artData(card) { var id = card && card.getAttribute('data-id'), arts = (D && D.articles) || []; for (var i = 0; i < arts.length; i++) if (String(arts[i].id) === id) return arts[i]; return null; }
  if (window.WordSheet) WordSheet.bind(app, function (el) { var a = artData(artOf(el)); return a ? { text: a.title + '. ' + (a.summary || ''), src: a.source + ' · ' + a.title } : null; });
  app.addEventListener('click', function (e) {
    var sb = e.target.closest ? e.target.closest('[data-say]') : null;
    if (sb && window.WordSheet) { var sa = artData(artOf(sb)); if (sa) WordSheet.speak(sa.title + '. ' + (sa.summary || '')); return; }
    var el = e.target;
    while (el && el !== app && !(el.getAttribute && el.getAttribute('data-read'))) el = el.parentNode;
    if (!el || el === app) return;
    var card = el; while (card && !(card.classList && card.classList.contains('art'))) card = card.parentNode;
    if (card) { READ[card.getAttribute('data-id')] = Date.now(); set('read', READ); card.classList.add('read'); }
  });
  setTab(TAB === 'en' ? 'en' : 'today');
})();
</script>
