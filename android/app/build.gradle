plugins {
    id "com.android.application"
    id "com.google.gms.google-services" apply false
}
// 有 app/google-services.json（CI 从 secret GOOGLE_SERVICES_JSON 写出来）才开 App 推送；
// 没有也照样打包，只是 App 收不到推送（Telegram 推送不受影响）。
if (file("google-services.json").exists()) apply plugin: "com.google.gms.google-services"

def runNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace "io.github.boliunew.tools"
    compileSdk 34
    defaultConfig {
        applicationId "io.github.boliunew.tools"
        minSdk 24
        targetSdk 34
        versionCode runNo
        versionName "1." + runNo
    }
    signingConfigs {
        // 固定签名：以后每次新版本都能直接覆盖安装（个人自用，不上架应用商店）
        release {
            storeFile file("../tools.keystore")
            storePassword "boliunew-tools"
            keyAlias "tools"
            keyPassword "boliunew-tools"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.webkit:webkit:1.11.0"   // 网页一开始就注入朗读（addDocumentStartJavaScript）
    implementation platform("com.google.firebase:firebase-bom:33.5.1")
    implementation "com.google.firebase:firebase-messaging"
}
