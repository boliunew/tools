<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{position:-webkit-sticky;position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;min-height:56px}
.brand{font-weight:700;font-size:19px;margin-right:auto;display:flex;align-items:center;cursor:pointer}
.brand i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:30px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);margin-right:8px;font-size:13px;font-weight:800;letter-spacing:-.02em}

main{padding:14px 0 60px}
.view{display:none}.view.on{display:block}
.free{padding:14px 16px;margin-bottom:6px}

.frow{display:flex}

.frow input:focus{outline:2px solid var(--accent);border-color:transparent}
h2.sec{font-size:13px;letter-spacing:.06em;color:var(--faint);margin:20px 0 10px;font-weight:600;display:flex;justify-content:space-between}

.l-n{font-size:12px;color:var(--faint)}
.l-t{font-weight:700;font-size:16px}

.pbar{height:5px;background:var(--chip);border-radius:5px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--good);border-radius:5px}
.sbar{display:flex;align-items:center;margin-bottom:10px}
.sbar .ti{flex:1;text-align:center;font-weight:600}
.sbar .ti small{display:block;font-weight:400;color:var(--faint);font-size:12px}
.stage{padding:18px 12px 16px;text-align:center}
.board{display:inline-block;touch-action:none;-webkit-user-select:none;user-select:none;max-width:100%;cursor:crosshair}
.board svg{display:block}
.ipa{font-size:20px;color:var(--accent);margin-top:6px;font-family:"Lucida Sans Unicode","Arial Unicode MS","Segoe UI",sans-serif}
.zh{font-size:18px;margin-top:2px}
.pair{font-size:15px;color:var(--soft);margin-top:4px}
.ex{display:inline-block;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 14px;margin-top:10px;cursor:pointer}
.ex b{font-size:18px}
.ex span{color:var(--soft);font-size:13.5px;margin-left:6px}
.info{font-size:13px;color:var(--faint);margin-top:6px;min-height:20px}
.fb{font-size:15px;font-weight:600;min-height:24px;margin-top:4px}
.fb.ok{color:var(--good)} .fb.bad{color:var(--bad)}
.tools{display:flex;flex-wrap:wrap;justify-content:center;margin-top:10px}
.tools .btn{margin:0 4px 8px;min-width:92px}
.nav{display:flex;align-items:center;margin-top:12px}
.nav .btn{flex:1}

.dots{display:flex;justify-content:center;flex-wrap:wrap;margin-top:12px}

.dots i.l{background:var(--good)} .dots i.c{background:var(--accent);transform:scale(1.3)}
.qcard{padding:22px 16px;text-align:center}
.qp{font-size:14px;color:var(--soft)}
.qq{font-size:30px;font-weight:700;margin:10px 0 16px;min-height:44px}
.opts{display:flex;flex-wrap:wrap;margin:0 -5px}
.opt{width:calc(50% - 10px);margin:0 5px 10px;min-height:70px;font-size:24px;font-weight:600;border-radius:14px}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.slots{display:flex;justify-content:center;flex-wrap:wrap;margin:6px 0 14px;min-height:52px}
.slot{width:40px;height:48px;border-bottom:3px solid var(--line);margin:0 3px;font-size:28px;font-weight:700;line-height:46px;cursor:pointer}
.slot.f{border-color:var(--accent)}
.slots.ok .slot{color:var(--good);border-color:var(--good)}
.slots.no .slot{color:var(--bad);border-color:var(--bad)}
.tiles{display:flex;justify-content:center;flex-wrap:wrap}
.tile{width:48px;height:52px;margin:0 4px 8px;font-size:24px;font-weight:700;border-radius:12px;padding:0}
.tile.used{visibility:hidden}
.score{font-size:48px;font-weight:700;color:var(--accent)}
.hint{font-size:12.5px;color:var(--faint);text-align:center;margin-top:14px;line-height:1.7}
@media (max-width:420px){ .lesson{width:calc(100% - 10px)} .tools .btn{min-width:0;flex:1 1 40%} }
.g-m{color:#2466B8}.g-f{color:#C2185B}
@media (prefers-color-scheme: dark){.g-m{color:#7FB2FF}.g-f{color:#F48FB1}}
.art{font-size:22px;font-weight:700;margin-right:6px}
.syl{font-size:21px;margin-top:8px;letter-spacing:.02em}
.syl b{color:var(--accent);text-decoration:underline;text-underline-offset:4px}
.gtag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--chip);margin-left:6px;vertical-align:middle}
.note{font-size:13px;color:var(--soft);background:var(--bg);border-radius:10px;padding:6px 10px;margin:8px auto 0;max-width:420px}
.levhome{padding:14px 16px;margin-bottom:16px;cursor:pointer;display:block;width:100%;text-align:left;background:linear-gradient(135deg,var(--accent-soft),var(--paper))}
.levhome b{font-size:17px}.levhome div{font-size:13px;color:var(--soft);margin-top:3px}
.lvtop{padding:14px 10px;margin-bottom:12px}
.lvstats{display:flex;text-align:center}.lvstats div{flex:1}.lvstats b{display:block;font-size:24px;color:var(--accent);font-weight:800}.lvstats span{font-size:12px;color:var(--soft)}
.lvsub{font-size:13px;color:var(--soft)}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;margin:0 0 12px}
.tabs button{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:6px 14px;margin:0 4px 6px;font-size:14px;color:var(--soft)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.fam{padding:12px 14px;margin-bottom:10px;cursor:pointer}.fam.done{border-color:var(--good)}
.fam .fb0{display:flex;align-items:center}.fam .mid{flex:1;margin-left:12px;min-width:0}
.fam .cnt{font-size:12.5px;color:var(--good);font-weight:600}
.rule{font-size:19px;white-space:nowrap}.rule span{color:var(--soft)}.rule i{font-style:normal;color:var(--faint);margin:0 6px}.rule b{color:var(--accent)}
.rule.big{font-size:32px;text-align:center}
.tipb{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0;text-align:left;line-height:1.7}
.blk{text-align:left;font-size:14px;padding:7px 0;border-bottom:1px dashed var(--line)}.blk span{display:inline-block;min-width:78px;font-weight:700;color:var(--accent)}
.numout{font-size:30px;font-weight:700;margin:12px 0 4px;word-break:break-word}
.pchip{display:inline-block;background:var(--chip);border-radius:8px;padding:1px 8px;margin:2px}
.row{display:flex;flex-wrap:wrap;justify-content:center;margin-top:10px}.row .btn{margin:0 4px 8px}
.pairs{text-align:left}.pair2{display:flex;align-items:baseline;flex-wrap:wrap;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.pair2 .en{color:var(--soft);min-width:110px}.pair2 i{font-style:normal;color:var(--faint);margin:0 8px}.pair2 b{font-size:17px}.pair2 small{margin-left:auto;color:var(--faint);font-size:12.5px;padding-left:8px}
.ends{display:flex;flex-wrap:wrap;justify-content:center;margin:6px 0}.ends div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px 10px;margin:0 4px 8px;text-align:center;min-width:88px}.ends small{display:block;font-size:11.5px;color:var(--soft)}.ends b{font-size:20px;color:var(--accent)}
.vsel{display:flex;flex-wrap:wrap;justify-content:center;margin:8px 0}.vb{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:4px 10px;margin:0 3px 6px;font-size:14px}.vb.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.ctab{max-width:380px;margin:0 auto}.crow{display:flex;justify-content:space-between;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-size:17px}.crow span{color:var(--soft)}.crow em{font-style:normal;color:var(--accent);font-weight:800}
.opt.small{font-size:16px!important}
.tip{font-size:14px;color:var(--soft);margin-top:8px;max-width:440px;margin-left:auto;margin-right:auto}
/* pw-css */
.pwm{color:#2563C9;font-weight:700}.pwf{color:#C93A6E;font-weight:700}
@media (prefers-color-scheme: dark){.pwm{color:#86B6FF}.pwf{color:#FF8DB7}}
.pwhome{background:linear-gradient(135deg,rgba(242,163,58,.24),var(--paper))!important}
.pwv{position:fixed;left:0;top:0;right:0;bottom:0;z-index:60;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;color:var(--ink)}
.pwv.on{display:block}
.pwv button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pwv .pwtop{position:-webkit-sticky;position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;min-height:54px;padding:0 6px}
.pwv .pwti{flex:1;text-align:center;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pwv .pwb{border:0;background:transparent;color:var(--soft);font-size:15px;padding:10px 6px;min-width:78px}
.pwv .pwwrap{max-width:720px;margin:0 auto;padding:12px 16px 70px}
.pwv .pwintro{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7;margin-bottom:10px}
.pwv .pwrow{display:flex;flex-wrap:wrap;justify-content:center;margin:4px 0 8px}
.pwv .pwbtn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:8px 13px;min-height:42px;font-size:14.5px;margin:0 4px 8px}
.pwv .pwbtn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.pwv .pwbtn.good{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.pwv .pwbtn:disabled{opacity:.4}
.pwv .pwbtn.pwbig{font-size:30px;padding:10px 34px;margin-top:10px}
.pwv .pwstat{font-size:13px;color:var(--faint);text-align:center;margin:0 0 10px}.pwv .pwstat b{color:var(--good)}
.pwv .pwcats{display:flex;flex-wrap:wrap;margin:0 -5px}
.pwv .pwcat{position:relative;overflow:hidden;width:calc(50% - 10px);margin:0 5px 10px;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px 8px 14px;text-align:center;color:var(--ink)}
.pwv .pwcat .ic{display:block;font-size:40px;line-height:1.25}
.pwv .pwcat b{display:block;font-size:16px;margin-top:2px}
.pwv .pwcat small{color:var(--soft);font-size:12.5px}
.pwv .pwcat i{position:absolute;left:0;bottom:0;height:4px;background:var(--good)}
.pwv .pwgrid{display:flex;flex-wrap:wrap;margin:0 -4px}
.pwv .pwt{width:calc(33.333% - 8px);margin:0 4px 8px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 2px;text-align:center;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:120px}
.pwv .pwt .em{font-size:46px;line-height:1.2}
.pwv .pwt .w{font-size:15px;font-weight:700;margin-top:2px;line-height:1.25;word-break:break-word}
.pwv .pwt .s{font-size:12px;color:var(--soft);margin-top:1px}
.pwv .pwt.got{border-color:var(--good)}
.pwv .pwt.rd{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pwv .pwgrid.hid .pwt .w,.pwv .pwgrid.hid .pwt .s{visibility:hidden}
.pwv .pwgrid.hid .pwt.peek .w,.pwv .pwgrid.hid .pwt.peek .s{visibility:visible}
.pwv .pwpy{display:block;font-size:12.5px;color:var(--soft);font-weight:500;line-height:1.3}
.pwv .pwzh{display:block;font-size:24px;font-family:"Kaiti SC","STKaiti","KaiTi",serif;line-height:1.25}
.pwv .pwhint{font-size:12.5px;color:var(--faint);text-align:center;margin-top:8px}
.pwv .pwdet{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);text-align:center;padding:18px 14px 16px;margin-bottom:12px}
.pwv .pwdet .em{font-size:118px;line-height:1.15;cursor:pointer;display:inline-block}
.pwv .pwdet .w{font-size:34px;font-weight:800;margin-top:4px;line-height:1.3}
.pwv .pwdet .w .pwpy{font-size:22px;color:var(--accent)}.pwv .pwdet .w .pwzh{font-size:66px;font-weight:700}
.pwv .pwdet .s{font-size:17px;color:var(--soft)}
.pwv .pwnote{background:var(--chip);border-radius:10px;padding:8px 12px;margin-top:10px;font-size:14px;line-height:1.7;font-weight:400;color:var(--ink)}
.pwv .pwnav{display:flex}.pwv .pwnav .pwbtn{flex:1}
.pwv .pwpop{animation:pwpop .45s}
@keyframes pwpop{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-5deg)}100%{transform:scale(1)}}
.pwv .pwq{text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px 12px;margin-bottom:12px}
.pwv .pwq .lab{font-size:14px;color:var(--soft)}
.pwv .pwq .bigem{font-size:104px;line-height:1.2}
.pwv .pwq .bigw{font-size:34px;font-weight:800;margin:8px 0 4px}
.pwv .pwq .bigw .pwzh{font-size:60px}
.pwv .pwblank{display:inline-block;min-width:60px;height:.9em;border-bottom:3px solid var(--accent);vertical-align:baseline}
.pwv .pwopts{display:flex;flex-wrap:wrap;margin:0 -5px}
.pwv .pwo{width:calc(50% - 10px);margin:0 5px 10px;background:var(--paper);border:1px solid var(--line);border-radius:16px;color:var(--ink);min-height:66px;font-size:21px;font-weight:700;padding:8px}
.pwv .pwopts.em .pwo{min-height:112px;font-size:62px;line-height:1.1}
.pwv .pwopts.tx .pwo .pwzh{font-size:32px}
.pwv .pwo.gm{color:#2563C9}.pwv .pwo.gf{color:#C93A6E}
.pwv .pwo.right{background:var(--good-soft);border-color:var(--good)}
.pwv .pwo.wrong{background:var(--bad-soft,#F8E1DB);border-color:var(--bad,#C8412B)}
.pwv .pwfb{text-align:center;font-size:19px;font-weight:700;min-height:30px;line-height:1.5}
.pwv .pwfb .pwzh,.pwv .pwfb .pwpy{display:inline;font-size:inherit}
.pwv .pwfb .pwpy{margin-right:4px;color:var(--soft)}
.pwv .pwfb small{font-size:14px;color:var(--soft);font-weight:400}
.pwv .pwfb.ok{color:var(--good)}.pwv .pwfb.bad{color:var(--bad,#C8412B)}
.pwv .pwdone{text-align:center;padding:30px 10px}
.pwv .pwdone .stars{font-size:46px;letter-spacing:6px}.pwv .pwdone .stars .dim{opacity:.2}
.pwv .pwdone .sc{font-size:44px;font-weight:800;color:var(--accent);margin-top:6px}
.pwv .pwdone .msg{color:var(--soft);margin:4px 0 16px}
@media (prefers-color-scheme: dark){.pwv .pwo.gm{color:#86B6FF}.pwv .pwo.gf{color:#FF8DB7}}
/* /pw-css */
</style>

    $('vbQuiz').onclick = function () { verbQuiz(g); };
    $('vGot').onclick = function () { setLev('v:' + g, !LEV['v:' + g]); levSel = g; showLev(); };
  }
  function verbQuiz(g) {
    var G = PT.lev.verbs[g], qs = [], i, vs = shuffle(G.verbs.slice());
    for (i = 0; i < 10; i++) {
      var v = vs[i % vs.length], k = Math.floor(Math.random() * 5), opts = [], j;
      for (j = 0; j < 5; j++) opts.push({ w: conj(v[0], g, j) });
      var ans = opts[k]; opts.splice(k, 1); opts = shuffle(opts).slice(0, 3); opts.push(ans);
      var pr = PRON[k].split(' / ')[0];
      qs.push({ custom: true, ans: ans, opts: shuffle(opts), label: '选出正确的变位', prompt: '<span style="font-size:28px">' + esc(pr) + ' + ' + esc(v[0]) + '</span><div style="font-size:15px;font-weight:400;color:var(--soft)">' + esc(v[1]) + '</div>', say: pr + ' ' + ans.w, fb: esc(pr) + ' <b>' + esc(ans.w) + '</b>' });
    }
    runQuiz({ l: null, qs: qs, back: function () { levSel = g; showLev(); }, again: function () { verbQuiz(g); }, onDone: function (pc) { if (pc >= 80) setLev('v:' + g, 1); } });
  }

  showHome();
})();
</script>
