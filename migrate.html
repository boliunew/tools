<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script src="theme.js?v=1"></script>
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>搬家 · 导出导入进度</title>
<script src="sync.js?v=1"></script>
<style>
:root{--bg:#F3F1EC;--paper:#fff;--ink:#1B1E23;--soft:#626A73;--faint:#98A0A8;--line:#E0DDD5;--chip:#F0EEE8;--accent:#1F6F66;--accent-ink:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#15181C;--paper:#1D2126;--ink:#E9ECEF;--soft:#A3ABB4;--faint:#6F7881;--line:#2E343B;--chip:#262B31;--accent:#5CC2B3;--accent-ink:#0E1A18}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 60px}
h1{font-size:20px;margin:18px 0 6px}
p{color:var(--soft);font-size:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.card h2{font-size:16px;margin:0 0 6px}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
button,label.btn{font:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer;font-size:14px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.msg{font-size:13.5px;color:var(--accent);margin-top:8px;min-height:20px}
ul{font-size:13px;color:var(--soft);padding-left:20px;margin:6px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧳 搬家：导出 / 导入进度</h1>
  <p>词库进度、自选股、购物清单、收藏的电台……都存在浏览器里，而且每个网址各存各的。换到家里的主机（新网址）时，在旧网站「导出」，到新网站「导入」就行。</p>
  <div class="card"><h2>① 在旧网站导出</h2>
    <div id="sum" style="font-size:13.5px;color:var(--soft)"></div>
    <div class="row"><button class="pri" id="exp">导出全部进度</button><button id="cp">复制</button><button id="dl">下载成文件</button></div>
    <textarea id="out" readonly placeholder="点「导出全部进度」"></textarea>
  </div>
  <div class="card"><h2>② 在新网站导入</h2>
    <p style="margin:0 0 6px">粘贴刚才复制的内容，或者选下载的文件。同名的数据会被覆盖。</p>
    <textarea id="inp" placeholder='{"v":1,"items":{...}}'></textarea>
    <div class="row"><button class="pri" id="imp">导入</button><label class="btn">📎 选文件<input type="file" id="file" accept=".json,application/json" style="display:none"></label></div>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  var SKIP = /^(sync:|tnav:|home:unlock$)/;
  var NAMES = { 'ctxvocab-v1': '语境词库进度', 'pool:watch': '自选股', 'deals:list': '购物清单', 'deals:mine': '我的店' };
  function collect() {
    var items = {}, i, k, n = 0, size = 0;
    for (i = 0; i < localStorage.length; i++) { k = localStorage.key(i); if (SKIP.test(k)) continue; items[k] = localStorage.getItem(k); n++; size += items[k].length; }
    return { items: items, n: n, size: size };
  }
  (function () {
    var c = collect(), named = [], k;
    for (k in NAMES) if (c.items[k] != null) named.push(NAMES[k]);
    $('sum').textContent = '这个网站在本机存了 ' + c.n + ' 项数据（约 ' + Math.round(c.size / 1024) + ' KB）' + (named.length ? '，包括：' + named.join('、') : '') + '。';
  })();
  $('exp').onclick = function () {
    var c = collect();
    $('out').value = JSON.stringify({ v: 1, from: location.host, at: new Date().toISOString(), items: c.items });
  };
  $('cp').onclick = function () {
    if (!$('out').value) $('exp').onclick();
    $('out').select();
    try { if (navigator.clipboard) { navigator.clipboard.writeText($('out').value); } else document.execCommand('copy'); this.textContent = '已复制 ✓'; } catch (e) { document.execCommand('copy'); }
  };
  $('dl').onclick = function () {
    if (!$('out').value) $('exp').onclick();
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([$('out').value], { type: 'application/json' }));
    a.download = 'tools-backup-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };
  $('file').onchange = function () { var f = this.files[0]; if (!f) return; var r = new FileReader(); r.onload = function () { $('inp').value = r.result; }; r.readAsText(f); };
  $('imp').onclick = function () {
    var d; try { d = JSON.parse($('inp').value); } catch (e) { $('msg').textContent = '内容不对：' + e.message; return; }
    if (!d || !d.items) { $('msg').textContent = '内容不对：缺少 items'; return; }
    var n = 0, k;
    for (k in d.items) if (d.items.hasOwnProperty(k) && !SKIP.test(k) && typeof d.items[k] === 'string') { try { localStorage.setItem(k, d.items[k]); n++; } catch (e) { } }
    $('msg').innerHTML = '✅ 导入了 ' + n + ' 项' + (window.TOOLS_LOCAL ? '，并已同步到家里的主机——手机和电脑都能看到。' : '。') + ' <a href="./">回主页</a>';
  };
})();
</script>
<script src="nav.js?v=17" defer></script>
</body>
</html>
