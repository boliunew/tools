<!DOCTYPE html>
<html lang="zh-CN" data-tw="mid">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="wide.css?v=3">
<script src="theme.js?v=1"></script>
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D2430">
<title>🎛️ 音视频转换</title>
<style>
:root{--bg:#F2F1EE;--paper:#FFFFFF;--ink:#1E2228;--soft:#5E6670;--faint:#9AA1A9;--line:#E1DFDA;--chip:#ECEAE5;--acc:#2E6BD8;--acc-ink:#fff;--acc-soft:#E3ECFB;--ok:#2E9D4F;--ok-soft:#E2F3E7;--warn:#C0362C;--warn-soft:#F7E2DF;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(30,40,60,.07)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14171B;--paper:#1C2026;--ink:#E8EBEE;--soft:#A9B1BA;--faint:#6E767F;--line:#2C3139;--chip:#262B32;--acc:#7FA8F0;--acc-ink:#0B1630;--acc-soft:#1D2A40;--ok:#5ED08A;--ok-soft:#1B3325;--warn:#F07563;--warn-soft:#3A221F;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#14171B;--paper:#1C2026;--ink:#E8EBEE;--soft:#A9B1BA;--faint:#6E767F;--line:#2C3139;--chip:#262B32;--acc:#7FA8F0;--acc-ink:#0B1630;--acc-soft:#1D2A40;--ok:#5ED08A;--ok-soft:#1B3325;--warn:#F07563;--warn-soft:#3A221F;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;font-size:15px;line-height:1.6;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--acc)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.hero{background:linear-gradient(170deg,#2B3442 0%,#1D2430 60%,#161B24 100%);color:#EEF1F5;padding:calc(14px + env(safe-area-inset-top)) 0 16px}
.hero a{color:#EEF1F5;text-decoration:none;font-size:13px;opacity:.75}.hero h1{margin:4px 0 2px;font-size:24px}.hero p{margin:2px 0 0;font-size:13.5px;opacity:.85}
.box{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin:14px 0}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px 14px;text-align:center;cursor:pointer;color:var(--soft)}
.drop.over{border-color:var(--acc);background:var(--acc-soft)}
.drop b{display:block;font-size:16px;color:var(--ink);margin-bottom:2px}
.file{display:flex;gap:10px;align-items:center}
.file .ic{font-size:26px}.file b{display:block;word-break:break-all}.file small{color:var(--faint)}
.btn{border:0;border-radius:12px;padding:0 14px;min-height:40px;font-size:15px;font-weight:600;background:var(--acc);color:var(--acc-ink);display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;text-decoration:none}
.btn2{border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:500}
.btn.sm{min-height:32px;padding:0 10px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.55}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.task{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 10px;text-align:left}
.task b{display:block;font-size:14.5px}.task small{display:block;color:var(--faint);font-size:12px;line-height:1.45;margin-top:1px}
.task.on{border-color:var(--acc);background:var(--acc-soft)}
.task:disabled{opacity:.4}
h3{font-size:13px;letter-spacing:.04em;color:var(--soft);margin:18px 2px 8px;font-weight:700}
.opts{display:grid;gap:10px}
.opt label{display:block;font-size:13.5px;font-weight:600;margin-bottom:4px}
.opt label small{font-weight:400;color:var(--faint);margin-left:4px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:6px 6px;font-size:13.5px;color:var(--soft);white-space:nowrap}
.seg button.on{background:var(--acc);color:var(--acc-ink);font-weight:600}
input[type=number],input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:16px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}
.go{display:flex;gap:8px;margin-top:14px}.go .btn{flex:1}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.st{font-size:13.5px;color:var(--soft);margin-top:6px;min-height:1em}
.st.err{color:var(--warn)}.st.ok{color:var(--ok)}
.res{display:none}.res.on{display:block}
.cmp{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;margin:6px 0 10px}
.cmp span{background:var(--chip);border-radius:8px;padding:2px 9px}
.cmp .big{background:var(--ok-soft);color:var(--ok);font-weight:700}
video,audio{width:100%;border-radius:12px;background:#000;max-height:60vh}
audio{background:transparent}
.hint{font-size:12.5px;color:var(--faint);line-height:1.7}
.log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--faint);white-space:pre-wrap;max-height:120px;overflow:auto;margin-top:8px;display:none}
.log.on{display:block}
</style>
</head>
<body>
<div class="hero"><div class="wrap"><a href="index.html">‹ 首页</a><h1>🎛️ 音视频转换</h1><p>压缩视频、转格式、提取音频、剪一段。都在你自己的浏览器里做，文件不上传。</p></div></div>
<main class="wrap">
  <div class="box">
    <div class="drop" id="drop"><b>📂 选一个视频或音频</b>点这里选，或者把文件拖进来</div>
    <div class="file" id="fileInfo" style="display:none"></div>
  </div>

  <h3>要做什么</h3>
  <div class="tasks" id="tasks"></div>

  <div class="box opts" id="opts"></div>

  <div class="box">
    <div class="go"><button class="btn" id="go" disabled>▶ 开始</button><button class="btn btn2" id="stop" style="display:none">⏹ 停止</button></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="st" id="st">先选文件</div>
    <div class="log" id="log"></div>
  </div>

  <div class="box res" id="res">
    <div class="cmp" id="cmp"></div>
    <div id="pv"></div>
    <div class="go"><button class="btn" id="save">⬇ 保存</button><button class="btn btn2" id="again">🔁 换个设置再来</button></div>
  </div>

  <h3>💡 说明</h3>
  <div class="box hint" style="margin-top:0">
    处理在浏览器里完成，<b>文件不会上传到任何地方</b>。第一次用要下载一个约 30 MB 的处理组件，之后浏览器会记住。<br>
    浏览器里转码比电脑软件慢不少：一段 10 分钟的 1080p 视频压缩可能要十几分钟，<b>压成 720p 会快很多</b>。超过 1–2 GB 的文件浏览器可能内存不够。<br>
    「转格式」选 mp4 → mkv 这种只换外壳的，几秒钟就好；「剪一段」默认不重新编码，也很快。
  </div>
</main>
<input type="file" id="f" accept="video/*,audio/*,.mkv,.flv,.wmv,.avi,.ts,.m4a,.flac,.opus,.ogg,.wav,.ape,.wma" style="display:none">

<script src="vendor/ffmpeg/ffmpeg.js"></script>
<script src="vendor/ffmpeg/util.js"></script>
<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fsize(n) { return n >= 1073741824 ? (n / 1073741824).toFixed(2) + ' GB' : n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
  function fmt(t) { t = Math.max(0, t || 0); var h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = Math.floor(t % 60); return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (s < 10 ? '0' : '') + s; }

  var FILE = null, META = { dur: 0, w: 0, h: 0, video: false }, TASK = 'compress', OPT = {}, OUT = null, ff = null, running = false;

  /* ---------- 选文件 ---------- */

  function info() { $('fmeta').textContent = fsize(FILE.size) + (META.dur ? ' · ' + fmt(META.dur) : '') + (META.w ? ' · ' + META.w + '×' + META.h : '') + (META.video ? '' : ' · 音频'); renderOpts(); }

  /* ---------- 任务和选项 ---------- */

    }).join('');
  }
  $('tasks').onclick = function (e) { var b = e.target.closest('[data-k]'); if (!b || b.disabled) return; TASK = b.getAttribute('data-k'); OPT = {}; renderTasks(); renderOpts(); };

    return '<div class="seg" data-seg="' + key + '">' + list.map(function (x) { return '<button data-v="' + x[0] + '"' + (String(OPT[key]) === String(x[0]) ? ' class="on"' : '') + '>' + x[1] + '</button>'; }).join('') + '</div>';
  }
  function opt(label, html, small) { return '<div class="opt"><label>' + label + (small ? '<small>' + small + '</small>' : '') + '</label>' + html + '</div>'; }
  var RES = [['0', '原样'], ['1080', '1080p'], ['720', '720p'], ['480', '480p']];
  function renderOpts() {
    var h = '';
    if (TASK === 'compress') {
      h += opt('画质', seg('crf', [['23', '清楚（大一些）'], ['28', '平衡'], ['32', '最小']], '28'), '数字越小越清楚、文件越大');

      h += opt('格式', seg('afmt', [['mp3', 'MP3'], ['m4a', 'M4A'], ['ogg', 'OGG'], ['wav', 'WAV'], ['flac', 'FLAC']], 'mp3'));
      h += opt('码率', seg('abr', [['96', '96k 听书'], ['128', '128k'], ['192', '192k'], ['320', '320k']], TASK === 'extract' ? '192' : '128'), 'WAV / FLAC 是无损，不看码率');

    ['t1', 't2'].forEach(function (k) { var el = $(k); if (el) el.oninput = function () { OPT[k] = el.value; }; });

  function ext(n) { var m = /\.([a-z0-9]+)$/i.exec(n); return m ? m[1].toLowerCase() : 'bin'; }

    if (TASK === 'convert') {
