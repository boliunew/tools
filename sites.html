<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="wide.css?v=3">
<script src="theme.js?v=1"></script>
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F1EC">
<title>网址导航</title>
<style>
:root{
  --bg:#F3F1EC; --paper:#FFFFFF; --chip:#F0EEE8; --ink:#1B1E23; --soft:#626A73; --faint:#98A0A8; --line:#E0DDD5;
  --accent:#1F6F66; --accent-ink:#FFFFFF; --accent-soft:#DCEEEA; --star:#D99A00;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15181C; --paper:#1D2126; --chip:#262B31; --ink:#E9ECEF; --soft:#A3ABB4; --faint:#6F7881; --line:#2E343B;
    --accent:#5CC2B3; --accent-ink:#0E1A18; --accent-soft:#1E3632; --star:#F2C14E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header.top{position:-webkit-sticky;position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;min-height:52px;gap:8px}
.brand{font-weight:700;font-size:19px;margin-right:auto;color:var(--ink);text-decoration:none}
.priv{font-size:12px;color:var(--faint)}
.search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:10px 0;outline:none}
.search:focus-within{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:10px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);font-size:14px;padding:5px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip:focus-visible,.card:focus-visible,.star:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:4px 0 90px}
section{margin-top:18px}
h2{font-size:17px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
h2 small{font-weight:400;font-size:13px;color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{position:relative;display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 40px 12px 12px;color:inherit;text-decoration:none;min-width:0}
.card:hover{border-color:var(--accent)}
.ico{flex:none;width:38px;height:38px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;font-size:20px}
.txt{min-width:0}
.name{font-weight:700;display:block}
.desc{color:var(--soft);font-size:13px;display:block}
.dom{color:var(--accent);font-size:12px;display:block;margin-top:2px;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:2px;font-weight:500}
.star{position:absolute;top:8px;right:8px;border:0;background:transparent;font-size:17px;cursor:pointer;color:var(--faint);padding:4px;line-height:1}
.star.on{color:var(--star)}
.empty{color:var(--soft);text-align:center;padding:40px 0}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="bar"><a class="brand" href="./">🧭 网址导航</a><span class="priv">☆ 收藏只存在这台设备</span></div>
  <label class="search">🔍<input id="q" type="search" placeholder="搜网站，比如 PDF、壁纸、股票、翻译…" autocomplete="off"></label>
  <div class="chips" id="chips" role="toolbar" aria-label="分类"></div>
</div></header>
<main class="wrap" id="list"></main>
<script>
const CATS=[
 {id:"ai",icon:"🤖",name:"AI 助手",items:[
  ["✳️","Claude","写作、编程、分析","https://claude.ai"],
  ["💬","ChatGPT","OpenAI 的聊天助手","https://chatgpt.com"],
  ["✨","Gemini","Google 的 AI 助手","https://gemini.google.com"],
  ["🔎","Perplexity","带来源的 AI 搜索","https://www.perplexity.ai"],
  ["🐳","DeepSeek","国产大模型，中文好","https://chat.deepseek.com"],
  ["🌙","Kimi","长文档阅读","https://www.kimi.com"]]},
 {id:"tools",icon:"🛠️",name:"在线工具",items:[
  ["📄","iLovePDF","PDF 合并、拆分、转 Word","https://www.ilovepdf.com","免费"],
  ["🔄","CloudConvert","几乎任何格式互转","https://cloudconvert.com"],
  ["🗜️","TinyPNG","图片无损压缩","https://tinypng.com","免费"],
  ["✂️","remove.bg","一键抠图去背景","https://www.remove.bg"],
  ["🎨","Photopea","网页版 Photoshop","https://www.photopea.com","免费"],
  ["🧪","Squoosh","图片压缩 / 改格式，本地处理","https://squoosh.app","免费"],
  ["📮","10 Minute Mail","临时邮箱，防垃圾注册","https://10minutemail.com"],
  ["🔤","Regex101","正则表达式测试","https://regex101.com"],
  ["📱","QR Code Generator","生成二维码","https://www.qr-code-generator.com"]]},
 {id:"transfer",icon:"📦",name:"文件互传",items:[
  ["📡","PairDrop","同 Wi‑Fi 设备互传，像隔空投送","https://pairdrop.net","免费"],
  ["🚀","WeTransfer","大文件发链接","https://wetransfer.com"],
  ["🔐","Wormhole","端到端加密传文件","https://wormhole.app"]]},
 {id:"img",icon:"🖼️",name:"壁纸素材",items:[
  ["🌄","Wallhaven","高清壁纸，可按比例筛选","https://wallhaven.cc","推荐"],
  ["📷","Unsplash","高质量摄影图，可商用","https://unsplash.com"],
  ["🏞️","Pexels","免费图片和视频素材","https://www.pexels.com"],
  ["🖥️","彼岸图网","4K 风景、动漫壁纸","https://pic.netbian.com"],
  ["🪟","WallpaperHub","各品牌官方壁纸","https://www.wallpaperhub.app"],
  ["🔣","Iconify","20 万+ 免费图标","https://icon-sets.iconify.design"]]},
 {id:"stock",icon:"📈",name:"投资财经",items:[
  ["🗺️","Finviz","美股热力图、选股器","https://finviz.com","推荐"],
  ["📊","TradingView","专业看图画线","https://www.tradingview.com"],
  ["💹","Yahoo Finance","行情、财报、新闻","https://finance.yahoo.com"],
  ["🏛️","SEC EDGAR","上市公司原始财报","https://www.sec.gov/edgar/search/"],
  ["🧮","Portfolio Visualizer","组合回测","https://www.portfoliovisualizer.com"],
  ["📉","Macrotrends","几十年长期数据图","https://www.macrotrends.net"],
  ["🏦","FRED","美联储经济数据","https://fred.stlouisfed.org"]]},
 {id:"learn",icon:"📚",name:"学习阅读",items:[
  ["🌐","维基百科","百科全书","https://zh.wikipedia.org"],
  ["🗄️","Internet Archive","老网页、书、影音存档","https://archive.org"],
  ["📖","Project Gutenberg","7 万+ 免费英文经典书","https://www.gutenberg.org"],
  ["🗣️","YouGlish","听单词在真实视频里怎么读","https://youglish.com"],
  ["📘","Cambridge 词典","英英 / 英汉词典","https://dictionary.cambridge.org"],
  ["🎓","Khan Academy","免费课程，数学到经济","https://www.khanacademy.org"],
  ["🏫","Coursera","名校公开课","https://www.coursera.org"]]},
 {id:"translate",icon:"🌏",name:"翻译",items:[
  ["🟦","DeepL","最自然的机器翻译","https://www.deepl.com/translator","推荐"],
  ["🔵","Google 翻译","语种最全，支持拍照","https://translate.google.com"],
  ["🟢","百度翻译","中文词条丰富","https://fanyi.baidu.com"]]},
 {id:"dev",icon:"💻",name:"开发编程",items:[
  ["🐙","GitHub","代码托管","https://github.com"],
  ["📑","DevDocs","各种语言文档合一","https://devdocs.io"],
  ["❓","Stack Overflow","编程问答","https://stackoverflow.com"],
  ["🧾","JSON Formatter","JSON 格式化校验","https://jsonformatter.org"],
  ["✅","Can I use","查浏览器兼容性","https://caniuse.com"],
  ["🐍","PyPI","Python 包搜索","https://pypi.org"]]},
 {id:"media",icon:"🎬",name:"影音娱乐",items:[
  ["▶️","YouTube","视频","https://www.youtube.com"],
  ["📺","哔哩哔哩","中文视频社区","https://www.bilibili.com"],
  ["📻","Radio Garden","转动地球听全世界电台","https://radio.garden","好玩"],
  ["🎼","Musopen","免费古典音乐","https://musopen.org"]]},
 {id:"life",icon:"🧰",name:"生活实用",items:[
  ["⚡","Speedtest","测网速","https://www.speedtest.net"],
  ["🚨","Downdetector","查某网站是不是崩了","https://downdetector.com"],
  ["🌬️","Windy","风雨云动态天气图","https://www.windy.com"],
  ["✈️","Flightradar24","实时航班追踪","https://www.flightradar24.com"],
  ["⛽","GasBuddy","附近油价","https://www.gasbuddy.com"],
  ["🐪","CamelCamelCamel","亚马逊历史价格","https://camelcamelcamel.com"],
  ["🕒","Time and Date","世界时间、倒计时","https://www.timeanddate.com"],
  ["🚢","MarineTraffic","实时船舶位置","https://www.marinetraffic.com"]]}
];
const ALL=CATS.flatMap(c=>c.items.map(i=>({cat:c.id,icon:i[0],name:i[1],desc:i[2],url:i[3],tag:i[4]||""})));
let favs=[];try{favs=JSON.parse(localStorage.getItem("sites-favs")||"[]")}catch(e){}
let cur="all";
const $=s=>document.querySelector(s);
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return u}};
function saveFavs(){try{localStorage.setItem("sites-favs",JSON.stringify(favs))}catch(e){}}
function chips(){
  const list=[{id:"all",icon:"🏠",name:"全部"},{id:"fav",icon:"⭐",name:"我的收藏"},...CATS];
  $("#chips").innerHTML=list.map(c=>`<button class="chip" data-c="${c.id}" aria-pressed="${c.id===cur}">${c.icon} ${c.name}</button>`).join("");
}
function card(s){
  const on=favs.includes(s.url);
  return `<a class="card" href="${s.url}" target="_blank" rel="noopener">
    <span class="ico">${s.icon}</span>
    <span class="txt"><span class="name">${s.name}${s.tag?`<span class="tag">${s.tag}</span>`:""}</span>
    <span class="desc">${s.desc}</span><span class="dom">${host(s.url)}</span></span>
    <button class="star ${on?"on":""}" data-u="${s.url}" aria-label="${on?"取消收藏":"收藏"} ${s.name}">${on?"★":"☆"}</button></a>`;
}
function render(){
  const q=$("#q").value.trim().toLowerCase();
  const match=s=>!q||(s.name+s.desc+s.url).toLowerCase().includes(q);
  let html="";
  const favItems=ALL.filter(s=>favs.includes(s.url)&&match(s));
  if((cur==="all"||cur==="fav")&&favItems.length) html+=`<section><h2>⭐ 我的收藏 <small>${favItems.length}</small></h2><div class="grid">${favItems.map(card).join("")}</div></section>`;
  if(cur==="fav"&&!favItems.length) html=`<p class="empty">还没有收藏。点任意卡片右上角的 ☆ 加进来。</p>`;
  if(cur!=="fav") CATS.filter(c=>cur==="all"||cur===c.id).forEach(c=>{
    const it=ALL.filter(s=>s.cat===c.id&&match(s));
    if(it.length) html+=`<section><h2>${c.icon} ${c.name} <small>${it.length}</small></h2><div class="grid">${it.map(card).join("")}</div></section>`;
  });
  $("#list").innerHTML=html||`<p class="empty">没找到「${q}」相关的网站，换个关键词试试。</p>`;
}
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;cur=b.dataset.c;chips();render()});
$("#q").addEventListener("input",render);
$("#list").addEventListener("click",e=>{const b=e.target.closest(".star");if(!b)return;e.preventDefault();e.stopPropagation();
  const u=b.dataset.u;favs=favs.includes(u)?favs.filter(x=>x!==u):[...favs,u];saveFavs();render()});
chips();render();
</script>
<script src="wide.js?v=2"></script>
<script src="nav.js?v=46" defer></script>
</body>
</html>
