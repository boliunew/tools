<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F1EC">
<title>SubLingo</title>
<style>
:root{
  --bg:#F3F1EC; --paper:#FFFFFF; --ink:#1B1E23; --soft:#626A73; --faint:#98A0A8; --line:#E0DDD5; --chip:#F0EEE8;
  --accent:#1F6F66; --accent-ink:#FFFFFF; --accent-soft:#DCEEEA; --mark:#FFE58A; --hard:#C0572B;
  --c-v:#C23B22; --c-aux:#B8660B; --c-n:#1E5AA8; --c-pr:#20808F; --c-adj:#2E7D32; --c-adv:#7A3FB0; --c-prep:#7C6A52; --c-cj:#B03A74; --c-det:#6B7580; --c-num:#8A6D00;
  --fs:18px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181C; --paper:#1D2126; --ink:#E9ECEF; --soft:#A3ABB4; --faint:#6F7881; --line:#2E343B; --chip:#262B31;
    --accent:#5CC2B3; --accent-ink:#0E1A18; --accent-soft:#1E3632; --mark:#6B5A12; --hard:#F08A5D;
    --c-v:#FF8A73; --c-aux:#F2B35E; --c-n:#7FB2FF; --c-pr:#6FD0DC; --c-adj:#86D48A; --c-adv:#C9A2F2; --c-prep:#C8B79E; --c-cj:#F28DC0; --c-det:#9AA4AE; --c-num:#E3C75A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#15181C; --paper:#1D2126; --ink:#E9ECEF; --soft:#A3ABB4; --faint:#6F7881; --line:#2E343B; --chip:#262B31;
  --accent:#5CC2B3; --accent-ink:#0E1A18; --accent-soft:#1E3632; --mark:#6B5A12; --hard:#F08A5D;
  --c-v:#FF8A73; --c-aux:#F2B35E; --c-n:#7FB2FF; --c-pr:#6FD0DC; --c-adj:#86D48A; --c-adv:#C9A2F2; --c-prep:#C8B79E; --c-cj:#F28DC0; --c-det:#9AA4AE; --c-num:#E3C75A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;font-size:15px;line-height:1.55}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header.top{position:-webkit-sticky;position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;min-height:56px}
.brand{font-weight:700;font-size:19px;letter-spacing:-.01em;margin-right:auto;display:flex;align-items:center}
.brand i{display:inline-block;width:22px;height:22px;border-radius:6px;background:var(--accent);margin-right:8px;position:relative}
.brand i:after{content:"";position:absolute;left:5px;right:5px;bottom:6px;height:2px;background:var(--accent-ink);border-radius:2px;box-shadow:0 -5px 0 var(--accent-ink)}
.brand small{font-weight:400;color:var(--soft);font-size:12px;margin-left:8px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;color:var(--soft);font-size:14px}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:10px;margin-left:6px;color:var(--soft);display:flex;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--chip)}
.iconbtn svg{width:20px;height:20px}
.settings{display:none;padding:10px 0 14px;border-top:1px solid var(--line)}
.settings.open{display:block}
.settings .row{display:flex;flex-wrap:wrap;align-items:center}
.settings .row > *{margin:4px 12px 4px 0}
.legend{display:flex;flex-wrap:wrap;margin-top:6px}
.legend span{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);margin:3px 6px 3px 0;font-weight:600}
.switch{display:inline-flex;align-items:center;font-size:14px;color:var(--soft);user-select:none;cursor:pointer}
.switch input{margin:0 6px 0 0;width:16px;height:16px;accent-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:10px;font-size:14px;display:inline-flex;align-items:center;min-height:38px}
.btn:hover{border-color:var(--faint)}
a.btn{text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--soft)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn .k{font-size:12px;color:var(--faint);margin-left:6px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
main{padding:16px 0 120px}
.view{display:none}
.view.on{display:block}
.intro{padding:22px 20px}
.intro h2{margin:0 0 6px;font-size:20px}
.intro p{margin:0 0 14px;color:var(--soft)}
.actions{display:flex;flex-wrap:wrap}
.actions > *{margin:0 8px 8px 0}
.hint{font-size:13px;color:var(--faint)}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--faint);font-size:13px;margin-top:6px}
body.dragging .drop{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* player */
.player{position:-webkit-sticky;position:sticky;top:57px;z-index:10;background:var(--bg);padding:10px 0 8px;display:none}
.player.on{display:block}
.player video{width:100%;max-height:34vh;background:#000;border-radius:12px;display:block}
.player.audio video{height:44px;max-height:44px;background:transparent}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;margin-top:8px}
.ctrl > *{margin:0 6px 6px 0}
.ctrl .off{font-size:13px;color:var(--soft);display:inline-flex;align-items:center}
.ctrl .off b{min-width:48px;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink)}
.filebar{display:flex;flex-wrap:wrap;align-items:center;margin:4px 0 12px;font-size:13px;color:var(--soft)}
.filebar > *{margin:0 10px 6px 0}
.filebar .name{font-weight:600;color:var(--ink);max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--chip);font-size:12px;font-weight:600;color:var(--soft)}
.pill.lv{background:var(--accent-soft);color:var(--accent)}

/* cues */
.cues{padding:4px 0}
.cue{display:flex;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--line);position:relative;flex-wrap:wrap}
.cue:last-child{border-bottom:0}
.cue.now{background:var(--accent-soft)}
.cue.now:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent)}
.cue .ts{border:0;background:transparent;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums;padding:5px 8px 0 0;min-width:52px;text-align:left}
.cue .ts:hover{color:var(--accent)}
.cue .ct{flex:1;min-width:0;cursor:pointer}
.cue .zh{color:var(--soft);font-size:14px;margin-top:2px}
.cue .panel-slot{flex-basis:100%}
.en,.sent{font-size:var(--fs);line-height:1.6}
.art .en,.art p{font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif}

/* tokens */
.w{border-radius:3px;transition:background .15s}
.open .w{cursor:pointer}
.open .w:hover{background:var(--chip)}
.color .p-v{color:var(--c-v);font-weight:600}
.color .p-aux{color:var(--c-aux);font-weight:600}
.color .p-n{color:var(--c-n)}
.color .p-pr{color:var(--c-pr)}
.color .p-adj{color:var(--c-adj)}
.color .p-adv{color:var(--c-adv)}
.color .p-prep{color:var(--c-prep)}
.color .p-cj{color:var(--c-cj);font-weight:600}
.color .p-det{color:var(--c-det)}
.color .p-num{color:var(--c-num)}
.color .p-part{color:var(--c-v)}
.pv{text-decoration:underline;text-decoration-style:dotted;-webkit-text-decoration-style:dotted;text-decoration-color:var(--c-v);text-underline-offset:3px}
.w.hl{background:var(--mark)!important;color:var(--ink)!important}
.w.sel{outline:2px solid var(--accent);outline-offset:1px}

/* panel */
.panel{margin:10px 0 4px;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;font-size:14px}
.panel .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.panel .ph b{font-size:12px;letter-spacing:.06em;color:var(--faint);font-weight:600}
.panel h4{margin:12px 0 6px;font-size:12px;color:var(--faint);font-weight:600;letter-spacing:.04em}
.panel h4:first-of-type{margin-top:4px}
.it{padding:8px 10px;border-radius:10px;background:var(--paper);border:1px solid var(--line);margin-bottom:6px;cursor:default}
.it:hover,.it.act{border-color:var(--accent)}
.it .nm{font-weight:600}
.it code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--chip);padding:1px 6px;border-radius:6px;margin-left:6px;white-space:nowrap}
.it .ds{color:var(--soft);margin-top:3px;font-size:13.5px}
.it .zhm{color:var(--accent);margin-left:6px}
.subsent{margin:10px 0 2px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:var(--soft)}
.empty{color:var(--faint);font-size:13px}

/* article */
.inputs{padding:16px}
.urlrow{display:flex}
.urlrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;margin-right:8px}
textarea{width:100%;min-height:140px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;margin:10px 0;resize:vertical;line-height:1.5}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.status{font-size:13px;color:var(--soft);min-height:20px}
.status.err{color:var(--hard)}
.stats{margin-top:14px;padding:16px}
.stats .top{display:flex;align-items:center;flex-wrap:wrap}
.lvbig{font-size:34px;font-weight:700;color:var(--accent);line-height:1;margin-right:12px}
.lvtxt{font-size:14px;color:var(--soft)}
.lvtxt b{color:var(--ink);font-size:16px;display:block}
.meter{height:8px;border-radius:8px;background:var(--chip);margin:14px 0 4px;overflow:hidden;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:8px}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}
.grid{display:flex;flex-wrap:wrap;margin-top:12px;border-top:1px solid var(--line);padding-top:6px}
.grid div{width:33.33%;padding:8px 0}
.grid b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.grid span{font-size:12px;color:var(--faint)}
.rare{margin-top:10px}
.rare .chip{display:inline-block;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;margin:0 6px 6px 0;font-size:13px;cursor:pointer}
.rare .chip:hover{border-color:var(--accent);color:var(--accent)}
.art{margin-top:14px;padding:20px 22px}
.art h2{margin:0 0 12px;font-size:22px;line-height:1.3;font-family:Georgia,"Iowan Old Style",serif}
.art .tools{display:flex;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.art .tools > *{margin:0 10px 8px 0}
.art p{margin:0 0 14px}
.sent{cursor:pointer;border-radius:4px;transition:background .15s}
.sent:hover{background:var(--chip)}
.sent.open{background:var(--accent-soft)}
.onlyhard .sent.hard{box-shadow:inset 0 -2px 0 var(--hard)}
.onlyhard .sent:not(.hard){opacity:.45}

/* word sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;pointer-events:none;padding:0 12px 12px;visibility:hidden;transition:visibility 0s .2s}
.sheet.on{visibility:visible;transition:none}
.sheet .box{pointer-events:auto;width:100%;max-width:440px;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.25);padding:14px 16px 12px;transform:translateY(120%);transition:transform .2s ease}
.sheet.on .box{transform:translateY(0)}
.sheet .wd{font-size:24px;font-weight:700;font-family:Georgia,serif;margin-right:8px}
.sheet .lm{color:var(--soft);font-size:14px}
.sheet .pos{margin:6px 0;font-weight:600}
.sheet .note{font-size:13.5px;color:var(--soft);margin:4px 0}
.sheet .acts{display:flex;flex-wrap:wrap;margin-top:10px}
.sheet .acts > *{margin:0 8px 0 0}
.sheet .x{float:right;border:0;background:var(--chip);width:30px;height:30px;border-radius:50%;color:var(--soft)}
footer{color:var(--faint);font-size:12px;text-align:center;padding:24px 0 40px}
@media (max-width:560px){
  .brand small{display:none}
  .seg button{padding:6px 10px}
  .cue{padding:10px 10px}
  .cue .ts{min-width:44px}
  .art{padding:16px}
  .grid div{width:50%}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><i></i>SubLingo<small>字幕 · 文章语法解析</small></div>
      <div class="seg" id="tabs"><button data-tab="sub" class="on">字幕</button><button data-tab="art">文章</button></div>
      <button class="iconbtn" id="setBtn" aria-label="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
    <div class="settings" id="settings">
      <div class="row">
        <label class="switch"><input type="checkbox" id="optColor">词性着色</label>
        <span class="switch">字号
          <button class="btn sm ghost" id="fsDown">A−</button><b id="fsVal" style="min-width:26px;text-align:center">18</b><button class="btn sm ghost" id="fsUp">A+</button>
        </span>
        <span class="switch">主题
          <select id="optTheme" style="margin-left:6px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:3px 6px"><option value="">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select>
        </span>
      </div>
      <div class="legend">
        <span style="color:var(--c-v)">动词</span><span style="color:var(--c-aux)">助动词/情态</span><span style="color:var(--c-n)">名词</span><span style="color:var(--c-pr)">代词</span><span style="color:var(--c-adj)">形容词</span><span style="color:var(--c-adv)">副词</span><span style="color:var(--c-prep)">介词</span><span style="color:var(--c-cj)">连词</span><span style="color:var(--c-det)">限定词</span><span style="color:var(--c-v);text-decoration:underline dotted">短语动词</span>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- SUBTITLE VIEW -->
  <section class="view on" id="view-sub">
    <div class="card intro" id="subIntro">
      <h2>导入字幕，逐句看懂语法</h2>
      <p>支持 SRT / VTT / ASS 字幕，可同时导入本地视频或音频同步播放。双语字幕会自动分出中文翻译。</p>
      <div class="actions">
        <button class="btn primary" id="pickSub">导入字幕</button>
        <button class="btn" id="pickMedia">导入视频 / 音频</button>
        <button class="btn ghost" id="demoSub">试试示例</button>
      </div>
      <div class="drop">也可以把字幕或视频文件直接拖到页面上</div>
    </div>
    <div class="player" id="player">
      <video id="video" controls playsinline preload="metadata"></video>
      <div class="ctrl">
        <button class="btn sm" id="bPrev">上一句 <span class="k">←</span></button>
        <button class="btn sm" id="bLoop">单句循环 <span class="k">R</span></button>
        <button class="btn sm" id="bNext">下一句 <span class="k">→</span></button>
        <button class="btn sm on" id="bFollow">跟随滚动</button>
        <span class="off">字幕偏移<button class="btn sm ghost" id="offDown">−</button><b id="offVal">0.0s</b><button class="btn sm ghost" id="offUp">+</button></span>
      </div>
    </div>
    <div id="subBody" style="display:none">
      <div class="filebar" id="fileBar"></div>
      <div class="card cues color" id="cues"></div>
    </div>
    <input type="file" id="fSub" accept=".srt,.vtt,.ass,.ssa,.txt" style="display:none">
    <input type="file" id="fMedia" accept="video/*,audio/*,.mkv" style="display:none">
  </section>

  <!-- ARTICLE VIEW -->
  <section class="view" id="view-art">
    <div class="card inputs">
      <div class="urlrow"><input type="url" id="url" placeholder="粘贴英文文章链接，例如新闻网址" autocomplete="off"><button class="btn primary" id="fetchBtn">抓取</button></div>
      <div class="status" id="status"></div>
      <textarea id="artText" placeholder="或者直接把英文文章粘贴到这里…"></textarea>
      <div class="actions" style="margin-bottom:-8px">
        <button class="btn primary" id="anaBtn">分析文章</button>
        <button class="btn ghost" id="demoArt">试试示例</button>
        <button class="btn ghost" id="clearArt">清空</button>
      </div>
    </div>
    <div id="artOut"></div>
  </section>
  <footer>SubLingo · 本地规则引擎，离线可用，解析结果仅供参考<br>先点句子展开解析，再点单词查看词性</footer>
</main>

<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>

    if (actEl && actEl.getAttribute('data-act') === 'seek') { seekCue(ci, true); return; }
    if (closest(e.target, '.panel')) return;
    var w = closest(e.target, '.w');
    if (w && row.classList.contains('open')) { e.stopPropagation(); showWord('c' + ci, +w.getAttribute('data-i'), w); return; }
    if (closest(e.target, '.ct')) {
      if (!row.classList.contains('open')) { togglePanel(row, ci, true); if (mediaURL) seekCue(ci, false); }
      else if (!w) togglePanel(row, ci, false);
    }
  };
  function togglePanel(row, ci, on) {
    var slot = row.querySelector('.panel-slot');
    if (on && cues[ci].en) {
      slot.innerHTML = panelHTML('c' + ci); row.classList.add('open');
      bindPanel(slot.firstChild, row.querySelector('.en'));
    } else { slot.innerHTML = ''; row.classList.remove('open'); highlight(row, '', false); hideSheet(); }
  }
  function seekCue(i, play) {
    if (i < 0 || i >= cues.length) return;
    if (!mediaURL) { setCur(i, true); return; }
    video.currentTime = Math.max(0, cues[i].start + offset + 0.01);
    setCur(i, true);
    if (play && video.paused) { var pr = video.play(); if (pr && pr['catch']) pr['catch'](function () { }); }
  }
  function setCur(i, scroll) {
    if (i === cur) return;
    var old = $('cue' + cur); if (old) old.classList.remove('now');
    cur = i;
    var el = $('cue' + i); if (!el) return;
    el.classList.add('now');
    if (scroll && follow) {
      var top = el.getBoundingClientRect().top, ph = $('player').classList.contains('on') ? $('player').getBoundingClientRect().bottom : 60;
      var target = window.pageYOffset + top - ph - 12 - Math.max(0, (window.innerHeight - ph) * 0.2);
      if (top < ph + 10 || top > window.innerHeight - 80 || scroll === 'force') { try { window.scrollTo({ top: target, behavior: 'smooth' }); } catch (x) { window.scrollTo(0, target); } }
    }
  }
  function findCue(t) {
    var lo = 0, hi = cues.length - 1, ans = -1, mid;
    while (lo <= hi) { mid = (lo + hi) >> 1; if (cues[mid].start <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1; }
    if (ans >= 0 && t <= cues[ans].end + 0.05) return ans;
    return -1;
  }
  function tick() {
    if (!cues.length || !mediaURL) return;
    var t = video.currentTime - offset;
    if (loop && cur >= 0 && t >= cues[cur].end - 0.02) { video.currentTime = cues[cur].start + offset; return; }
    var i = findCue(t);
    if (i >= 0 && i !== cur) setCur(i, true);
  }
  var raf = window.requestAnimationFrame || function (f) { return setTimeout(f, 100); };
  function loopTick() { if (!video.paused) { tick(); raf(loopTick); } }
  video.addEventListener('play', function () { raf(loopTick); });
  video.addEventListener('timeupdate', tick);
  video.addEventListener('seeked', tick);

  function loadMedia(file) {
    if (mediaURL) { try { URL.revokeObjectURL(mediaURL); } catch (e) { } }
    mediaURL = URL.createObjectURL(file);
    video.src = mediaURL;
    $('player').classList.add('on');
    $('player').classList[/^audio\//.test(file.type) ? 'add' : 'remove']('audio');
    if (cues.length) renderCues();
    else { $('subIntro').querySelector('p').innerHTML = '已载入 <b>' + esc(file.name) + '</b>，再导入对应的字幕文件即可同步。'; }
  }
  $('bPrev').onclick = function () { seekCue(Math.max(0, (cur < 0 ? 0 : cur) - 1), true); };
  $('bNext').onclick = function () { seekCue(Math.min(cues.length - 1, cur + 1), true); };
  $('bLoop').onclick = function () { loop = !loop; this.classList[loop ? 'add' : 'remove']('on'); if (loop && cur >= 0) seekCue(cur, true); };
  $('bFollow').onclick = function () { follow = !follow; this.classList[follow ? 'add' : 'remove']('on'); };
  function setOffset(d) { offset = Math.round((offset + d) * 10) / 10; $('offVal').textContent = (offset > 0 ? '+' : '') + offset.toFixed(1) + 's'; tick(); }
  $('offDown').onclick = function () { setOffset(-0.5); };
  $('offUp').onclick = function () { setOffset(0.5); };
  document.addEventListener('keydown', function (e) {
    if (tab !== 'sub' || !cues.length) return;
    var tg = e.target && e.target.tagName; if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT') return;
    if (e.keyCode === 37) { e.preventDefault(); $('bPrev').click(); }
    else if (e.keyCode === 39) { e.preventDefault(); $('bNext').click(); }
    else if (e.keyCode === 82) { $('bLoop').click(); }
    else if (e.keyCode === 32 && mediaURL && e.target === document.body) { e.preventDefault(); if (video.paused) video.play(); else video.pause(); }
    else if (e.keyCode === 27) hideSheet();
  });

  /* file reading with encoding detection */
  function readText(file, cb) {
    var fr = new FileReader();
    if (window.TextDecoder) {
      fr.onload = function () {
        var buf = new Uint8Array(fr.result), text, enc = 'utf-8';
        if (buf[0] === 0xFF && buf[1] === 0xFE) enc = 'utf-16le'; else if (buf[0] === 0xFE && buf[1] === 0xFF) enc = 'utf-16be';
        try { text = new TextDecoder(enc).decode(buf); } catch (e) { text = ''; }
        var bad = (text.match(/�/g) || []).length;
        if (bad > 2) { try { var t2 = new TextDecoder('gbk').decode(buf); if ((t2.match(/�/g) || []).length < bad) text = t2; } catch (e2) { } }
        cb(text.replace(/^﻿/, ''));
      };
      fr.readAsArrayBuffer(file);
    } else { fr.onload = function () { cb(String(fr.result).replace(/^﻿/, '')); }; fr.readAsText(file); }
  }
  function routeFile(file) {
    var n = file.name.toLowerCase();
    if (/\.(srt|vtt|ass|ssa)$/.test(n)) readText(file, function (t) { loadSubtitles(t, file.name); });
    else if (/^(video|audio)\//.test(file.type) || /\.(mp4|mkv|webm|mov|m4v|mp3|m4a|wav|ogg|aac|flac)$/.test(n)) { setTab('sub'); loadMedia(file); }
    else if (/\.(txt|md)$/.test(n)) readText(file, function (t) { if (/-->/.test(t)) loadSubtitles(t, file.name); else { setTab('art'); $('artText').value = t; analyzeArticle(t, file.name.replace(/\.\w+$/, '')); } });
    else alert('不支持的文件类型：' + file.name);
  }
  $('pickSub').onclick = function () { $('fSub').click(); };
  $('pickMedia').onclick = function () { $('fMedia').click(); };
  $('fSub').onchange = function () { if (this.files[0]) routeFile(this.files[0]); this.value = ''; };
  $('fMedia').onchange = function () { if (this.files[0]) routeFile(this.files[0]); this.value = ''; };
  var dragDepth = 0;
  document.addEventListener('dragenter', function (e) { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
  document.addEventListener('dragleave', function () { dragDepth--; if (dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) {
    e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
    var fs = e.dataTransfer && e.dataTransfer.files; if (!fs) return;
    for (var i = 0; i < fs.length; i++) routeFile(fs[i]);
  });

  var DEMO_SRT = '1\n00:00:01,000 --> 00:00:03,400\nHey, have you seen my keys anywhere?\n你看到我的钥匙了吗？\n\n2\n00:00:03,800 --> 00:00:06,200\nI think you left them on the kitchen table.\n我觉得你把它们落在厨房桌子上了。\n\n3\n00:00:06,500 --> 00:00:09,800\nNo, I\'ve already looked there. I\'m going to be late again.\n没有，我已经找过了。我又要迟到了。\n\n4\n00:00:10,000 --> 00:00:13,400\nIf you had put them back where they belong, this wouldn\'t have happened.\n要是你把它们放回原处，就不会这样了。\n\n5\n00:00:13,700 --> 00:00:16,600\nOkay, okay. Can you help me look for them instead of lecturing me?\n好啦好啦。你能帮我找找，而不是教训我吗？\n\n6\n00:00:16,900 --> 00:00:20,200\nThe car was being repaired last week, right? Maybe they\'re still in your jacket.\n上周车在修，对吧？也许钥匙还在你夹克里。\n\n7\n00:00:20,500 --> 00:00:23,300\nFound them! They were hanging behind the door the whole time.\n找到了！它们一直挂在门后面。\n\n8\n00:00:23,600 --> 00:00:27,000\nYou should really put up a hook for them. I\'ve been telling you for months.\n你真该给它们装个挂钩。我已经跟你说了好几个月了。\n';
  $('demoSub').onclick = function () { loadSubtitles(DEMO_SRT, '示例：找钥匙.srt'); };

  /* ================= ARTICLE ================= */
  var DEMO_ART = { title: 'Why Cities Are Planting Trees to Fight the Heat', text: 'As summers grow hotter, cities around the world are turning to an old solution: trees. In Melbourne, officials have planted thousands of trees a year since 2012, hoping to double the city\'s canopy by 2040. Researchers who studied the program found that shaded streets can be significantly cooler than exposed ones, and residents report spending more time outdoors.\n\nBut planting trees is not as simple as it sounds. Young trees need regular watering, and many die before they reach maturity. Critics argue that the money would be better spent on reflective roofs or cooling centers, which could protect vulnerable people more quickly.\n\nSupporters counter that trees provide benefits that are difficult to measure, such as cleaner air, lower energy bills and a stronger sense of community. If cities had started planting decades ago, they say, many neighborhoods would already be enjoying those benefits today.' };
  var artState = null;
  function status(msg, err) { var s = $('status'); s.className = 'status' + (err ? ' err' : ''); s.innerHTML = msg || ''; }
  function analyzeArticle(text, title) {
    text = String(text || '').replace(/\r/g, '');
    if (!/[a-z]/i.test(text)) { status('请先粘贴英文文章或输入网址。', true); return; }
    REG = filterReg('c');
    var paras = text.split(/\n\s*\n|\n(?=\s*[A-Z“"])/).map(function (p) { return p.replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, ''); }).filter(function (p) { return p; });
    var d = NLP.difficulty(paras.join('\n\n'));
    var body = '', pi, si, hardN = 0;
    for (pi = 0; pi < paras.length; pi++) {
      var sents = NLP.splitSentences(paras[pi]);
      body += '<p data-p="' + pi + '">';
      for (si = 0; si < sents.length; si++) {
        var key = 'a' + pi + '_' + si, a = register(key, sents[si]);
        var hard = a.sents.some(function (s) { return s.hard; }); if (hard) hardN++;
        body += '<span class="sent' + (hard ? ' hard' : '') + '" data-k="' + key + '">' + tokensHTML(a) + '</span> ';
      }
      body += '</p><div class="pslot" data-p="' + pi + '"></div>';
    }
    var pct = Math.max(4, d.score);
    var html = '<div class="card stats"><div class="top"><div class="lvbig">' + d.level + '</div><div class="lvtxt"><b>' + d.levelZh + '难度</b>综合句长、音节和生词比例估算</div></div>' +
      '<div class="meter"><i style="width:' + pct + '%"></i></div><div class="scale"><span>A2</span><span>B1</span><span>B2</span><span>C1</span><span>C2</span></div>' +
      '<div class="grid"><div><b>' + d.words + '</b><span>词数</span></div><div><b>' + d.sentences + '</b><span>句子</span></div><div><b>' + d.asl.toFixed(1) + '</b><span>平均句长（词）</span></div>' +
      '<div><b>' + hardN + '</b><span>长难句</span></div><div><b>' + Math.round(d.rareRatio * 100) + '%</b><span>生词比例</span></div><div><b>' + d.minutes + ' 分钟</b><span>预计阅读</span></div></div>' +
      (d.rare.length ? '<div class="rare"><div class="hint" style="margin-bottom:6px">生词预览（点击查词）</div>' + d.rare.map(function (w) { return '<span class="chip" data-w="' + esc(w) + '">' + esc(w) + '</span>'; }).join('') + '</div>' : '') + '</div>' +
      '<div class="card art color" id="artBody">' + (title ? '<h2>' + esc(title) + '</h2>' : '') +
      '<div class="tools"><label class="switch"><input type="checkbox" id="onlyHard">突出长难句</label><button class="btn sm ghost" id="readAll">🔊 朗读全文</button><span class="hint">点句子看解析，再点单词看词性</span></div>' + body + '</div>';
    $('artOut').innerHTML = html;
    artState = { text: text, title: title || '' };
    store.set('article', artState);
    applySettings();
    $('onlyHard').onchange = function () { $('artBody').classList[this.checked ? 'add' : 'remove']('onlyhard'); };
    $('readAll').onclick = function () { speak(paras.join(' ')); };
    each($('artOut').querySelectorAll('.rare .chip'), function (c) { c.onclick = function (e) { e.stopPropagation(); showPlainWord(c.getAttribute('data-w')); }; });
  }
  $('artOut').onclick = function (e) {
    var panel = closest(e.target, '.panel');
    if (panel) {
      var b = closest(e.target, '[data-act]');
      if (b) {
        var k = panel.getAttribute('data-for'), act = b.getAttribute('data-act');
        if (act === 'close') closeArtPanel();
        if (act === 'speak') speak(REG[k].text);
      }
      return;
    }
    var sent = closest(e.target, '.sent'); if (!sent) return;
    var w = closest(e.target, '.w');
    if (sent.classList.contains('open')) { if (w) { e.stopPropagation(); showWord(sent.getAttribute('data-k'), +w.getAttribute('data-i'), w); } else closeArtPanel(); return; }
    closeArtPanel();
    sent.classList.add('open');
    var p = closest(sent, 'p'), slot = $('artOut').querySelector('.pslot[data-p="' + p.getAttribute('data-p') + '"]');
    slot.innerHTML = panelHTML(sent.getAttribute('data-k'));
    bindPanel(slot.firstChild, sent);
    var r = slot.getBoundingClientRect();
    if (r.bottom > window.innerHeight) { try { window.scrollBy({ top: Math.min(r.bottom - window.innerHeight + 20, r.top - 120), behavior: 'smooth' }); } catch (x) { window.scrollBy(0, r.bottom - window.innerHeight + 20); } }
  };
  function closeArtPanel() {
    each($('artOut').querySelectorAll('.sent.open'), function (s) { s.classList.remove('open'); highlight(s, '', false); });
    each($('artOut').querySelectorAll('.pslot'), function (s) { s.innerHTML = ''; });
    hideSheet();
  }
  $('anaBtn').onclick = function () { status(''); analyzeArticle($('artText').value, ''); scrollToOut(); };
  $('demoArt').onclick = function () { $('artText').value = DEMO_ART.text; status(''); analyzeArticle(DEMO_ART.text, DEMO_ART.title); scrollToOut(); };
  $('clearArt').onclick = function () { $('artText').value = ''; $('url').value = ''; $('artOut').innerHTML = ''; status(''); store.set('article', null); };
  function scrollToOut() { var o = $('artOut'); if (o.firstChild) { var y = o.getBoundingClientRect().top + window.pageYOffset - 70; try { window.scrollTo({ top: y, behavior: 'smooth' }); } catch (x) { window.scrollTo(0, y); } } }

  /* URL fetching with CORS proxy fallback */
  var PROXIES = [
    { name: '直连', make: function (u) { return u; } },
    { name: 'AllOrigins 代理', make: function (u) { return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); } },
    { name: 'corsproxy.io 代理', make: function (u) { return 'https://corsproxy.io/?url=' + encodeURIComponent(u); } },
    { name: 'Jina Reader', make: function (u) { return 'https://r.jina.ai/' + u; } }
  ];
  function fetchText(url, ms) {
    return new Promise(function (resolve, reject) {
      var done = false, ctrl = window.AbortController ? new AbortController() : null;
      var timer = setTimeout(function () { if (!done) { done = true; if (ctrl) ctrl.abort(); reject(new Error('超时')); } }, ms);
      fetch(url, ctrl ? { signal: ctrl.signal } : {}).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(function (t) { if (!done) { done = true; clearTimeout(timer); resolve(t); } }, function (e) { if (!done) { done = true; clearTimeout(timer); reject(e); } });
    });
  }
  function norm(s) { return s.replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, ''); }
  function extractHTML(html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var title = '', m = doc.querySelector('meta[property="og:title"]');
    title = m ? m.getAttribute('content') : (doc.querySelector('h1') ? doc.querySelector('h1').textContent : (doc.title || ''));
    each(doc.querySelectorAll('script,style,noscript,nav,header,footer,aside,form,figure,button,iframe,svg,[role="navigation"],[aria-hidden="true"]'), function (el) { if (el.parentNode) el.parentNode.removeChild(el); });
    function collect(root) {
      var out = [];
      each(root.querySelectorAll('p'), function (p) { var t = norm(p.textContent || ''); if (t.length >= 40 && /[a-z]/i.test(t) && !/^(advertisement|sign up|subscribe|read more)/i.test(t)) out.push(t); });
      return out;
    }
    var root = doc.querySelector('article') || doc.querySelector('main') || doc.querySelector('[itemprop="articleBody"]') || doc.body;
    var ps = root ? collect(root) : [];
    if (ps.length < 3 && doc.body) { var all = collect(doc.body); if (all.length > ps.length) ps = all; }
    return { title: norm(title || ''), text: ps.join('\n\n') };
  }
  function extractMarkdown(md) {
    var title = '', lines = md.replace(/\r/g, '').split('\n'), out = [];
    each(lines, function (l) {
      var mt = /^Title:\s*(.+)$/.exec(l); if (mt) { title = mt[1]; return; }
      if (/^(URL Source|Published Time|Markdown Content|Warning):/.test(l)) return;
      l = l.replace(/!\[[^\]]*\]\([^)]*\)/g, '').replace(/\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/[*_`>#]+/g, '').replace(/^\s*[-+]\s+/, '');
      l = norm(l);
      if (l.length >= 40 && /[.!?"”]$/.test(l)) out.push(l);
    });
    return { title: title, text: out.join('\n\n') };
  }
  function fetchArticle() {
    var u = norm($('url').value);
    if (!u) { status('请输入网址。', true); return; }
    if (!window.fetch || !window.Promise) { status('当前浏览器版本太旧，不支持网址抓取。请直接复制文章粘贴到下面。', true); return; }
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    var i = 0, best = null;
    $('fetchBtn').disabled = true;
    function next() {
      if (i >= PROXIES.length) {
        $('fetchBtn').disabled = false;
        if (best && best.text.length > 80) return finish(best);
        status('抓取失败：这个网站可能禁止了外部读取。请在浏览器中打开文章，全选复制正文，粘贴到下面的输入框。', true);
        return;
      }
      var px = PROXIES[i++];
      status('正在通过 ' + px.name + ' 抓取…（' + i + '/' + PROXIES.length + '）');
      fetchText(px.make(u), i === 1 ? 8000 : 15000).then(function (raw) {
        var r = /<html|<body|<p[\s>]/i.test(raw) ? extractHTML(raw) : extractMarkdown(raw);
        if (!best || r.text.length > best.text.length) best = r;
        if (r.text.length >= 300) { $('fetchBtn').disabled = false; finish(r); } else next();
      }, function () { next(); });
    }
    function finish(r) {
      $('artText').value = r.text;
      status('已抓取 ' + r.text.split(/\s+/).length + ' 词。如有多余内容，可在下面编辑后重新点"分析文章"。');
      analyzeArticle(r.text, r.title); scrollToOut();
    }
    next();
  }
  $('fetchBtn').onclick = fetchArticle;
  $('url').onkeydown = function (e) { if (e.keyCode === 13) fetchArticle(); };

  /* ---------- init ---------- */
  applySettings();
  setTab(tab);
  var saved = store.get('article', null);
  if (saved && saved.text) { $('artText').value = saved.text; analyzeArticle(saved.text, saved.title); }
  var qm = /[?&]url=([^&]+)/.exec(window.location.search);
  if (qm) { setTab('art'); $('url').value = decodeURIComponent(qm[1]); fetchArticle(); }
})();
