<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script src="theme.js?v=1"></script>
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA">
<title>开口说 · 跟读练习</title>
<script src="sync.js?v=1"></script>
<style>
:root{
  --bg:#F4F1EA; --paper:#FFFDF8; --ink:#1D2028; --soft:#5E6573; --faint:#99A0AA; --line:#E3DED3; --chip:#EEE9DF;
  --accent:#6D4BC2; --accent-ink:#fff; --accent-soft:#E9E2F8; --ok:#1E8E4E; --mid:#C98A16; --bad:#C0392B;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 5px 18px rgba(30,35,50,.07);
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#13161C; --paper:#1B1F27; --ink:#E9ECF1; --soft:#A7AEBA; --faint:#6E7583; --line:#2B303B; --chip:#252A35;
  --accent:#A98CF2; --accent-ink:#160F28; --accent-soft:#2B2340; --ok:#5BD38E; --mid:#F2B35E; --bad:#FF7A6B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 5px 18px rgba(0,0,0,.35);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;font-size:15px;line-height:1.55;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;gap:8px;min-height:56px;padding-top:env(safe-area-inset-top)}
.brand{font-weight:800;font-size:19px;color:var(--ink);text-decoration:none;margin-right:auto}
.back{border:0;background:none;font-size:24px;padding:2px 8px 2px 0;line-height:1}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px 4px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:14px}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.note{font-size:13px;color:var(--soft);margin:0 2px 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pk{display:block;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.pk .ic{font-size:26px;line-height:1}
.pk b{display:block;font-size:15px;margin-top:6px}
.pk small{color:var(--faint);font-size:12px}
.pk .bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.pk .bar i{display:block;height:100%;background:var(--ok)}
.intro{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13.5px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.ln{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.ln.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ln .who{font-size:12px;color:var(--faint);font-weight:600;letter-spacing:.03em}
.ln .who.me{color:var(--accent)}
.ln .t{font-family:var(--serif);font-size:18px;line-height:1.4;margin-top:1px}
.ln .t .ok{color:var(--ok)}
.ln .t .miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:3px}
.ln .zh{font-size:13.5px;color:var(--soft);margin-top:2px}
.hidezh .ln .zh{filter:blur(5px);transition:filter .2s}
.hidezh .ln .zh:active,.hidezh .ln .zh.show{filter:none}
.ln .nt{font-size:12.5px;color:var(--faint);margin-top:4px}
.ln .acts{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.ln .acts button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 11px;font-size:13px}
.ln .acts .mic{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.ln .acts .mic.rec{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.ln .score{margin-left:auto;font-weight:700;font-size:14px}
.ln .heard{font-size:12.5px;color:var(--faint);margin-top:5px}
.s-ok{color:var(--ok)}.s-mid{color:var(--mid)}.s-bad{color:var(--bad)}
.bar2{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:16px 0 calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
.bar2 button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 16px;font-size:14px;box-shadow:var(--shadow)}
.bar2 .pri{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.warn{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--soft);margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:rgba(28,28,30,.92);color:#fff;padding:8px 16px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--faint);padding:30px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header><button class="back" id="back" hidden aria-label="返回">‹</button><a class="brand" id="title" href="speak.html">🗣️ 开口说</a></header>
<div id="home">
  <nav class="tabs" id="tabs"></nav>
  <p class="note" id="hnote"></p>
  <div class="warn" id="micWarn" hidden></div>
  <div class="grid" id="grid"><div class="empty">加载中…</div></div>
</div>
<div id="pack" hidden></div>
</div>
<div class="toast" id="toast"></div>
<script src="lookup.js?v=2"></script>
<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function jget(k, d) { try { var v = localStorage.getItem('speak:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function jset(k, v) { try { localStorage.setItem('speak:' + k, JSON.stringify(v)); } catch (e) { } }
  var tt;
  function toast(m) { var t = $('toast'); t.textContent = m; t.className = 'toast on'; clearTimeout(tt); tt = setTimeout(function () { t.className = 'toast'; }, 2200); }

  var FILES = ['en_work', 'en_life', 'en_spoken', 'es_yard'];
  var GROUPS = [['工作', '🦺 工作英语', '码头、调度、司机、主管——每天真用得上的句子'], ['生活', '🏠 生活英语', '看病、DMV、银行、客服电话、修车……'], ['口语', '💬 美式口语', '短语动词、职场客套话、南加州口语、新闻习语'], ['西语', '🇲🇽 现场西语', '和墨西哥同事、司机打交道的西班牙语']];
  var PACKS = [], BYID = {}, GRP = jget('grp', '工作'), BEST = jget('best', {}), SET = jget('set', { rate: 1, hideZh: 0, mode: 'dialog' });
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, CAN_REC = !!(navigator.mediaDevices && window.MediaRecorder);

  /* ---------- 朗读 ---------- */
  var VOICES = {};
  function pickVoices() {
    if (!window.speechSynthesis) return;
    var vs = speechSynthesis.getVoices() || [], i, l;
    VOICES = {};
    for (i = 0; i < vs.length; i++) {
      l = vs[i].lang.replace('_', '-');
      if (!VOICES[l]) VOICES[l] = vs[i];
      if (!VOICES[l.slice(0, 2)]) VOICES[l.slice(0, 2)] = vs[i];
    }
  }
  if (window.speechSynthesis) { pickVoices(); try { speechSynthesis.addEventListener('voiceschanged', pickVoices); } catch (e) { } }
  function say(text, lang, rate, cb) {
    if (!window.speechSynthesis) { toast('这个浏览器不支持朗读'); if (cb) cb(); return; }
    var done = false;
    function fin() { if (done) return; done = true; if (cb) cb(); }
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = lang; u.rate = (rate || 1) * SET.rate;
      var v = VOICES[lang] || VOICES[lang.slice(0, 2)] || (lang === 'es-MX' ? VOICES['es-US'] || VOICES['es-ES'] : null);
      if (v) u.voice = v;
      u.onend = fin; u.onerror = fin;
      speechSynthesis.speak(u);
      setTimeout(fin, 3500 + text.length * 220);
    } catch (e) { fin(); }
  }

  /* ---------- 打分：按词对齐（最长公共子序列） ---------- */
  var NUM = { en: ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'], es: ['cero', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve'] };
  function norm(s, lang) {
    var L = lang.slice(0, 2), nums = NUM[L] || NUM.en, i;
    s = String(s).replace(/\b[A-Z]{2,5}\b/g, function (m) { return m.split('').join(' '); });   // 识别结果里的 CSQU → C S Q U
    s = String(s).toLowerCase().replace(/[’']/g, "'");
    s = s.normalize ? s.normalize('NFD').replace(/[̀-ͯ]/g, '') : s;
    s = s.replace(/[^a-z0-9'\s-]/g, ' ').replace(/-/g, ' ');
    var w = s.split(/\s+/), out = [];
    for (i = 0; i < w.length; i++) {
      var x = w[i].replace(/^'+|'+$/g, '');
      if (!x) continue;
      if (/^\d+$/.test(x)) { for (var k = 0; k < x.length; k++) out.push(x.charAt(k)); continue; }
      var ni = nums.indexOf(x); if (ni < 0 && L === 'en' && x === 'oh') ni = 0;
      out.push(ni >= 0 ? String(ni) : x);
    }
    return out;
  }
  function align(target, heard, lang) {
    var A = norm(target, lang), B = norm(heard, lang), n = A.length, m = B.length, i, j, dp = [];
    for (i = 0; i <= n; i++) { dp.push([]); for (j = 0; j <= m; j++) dp[i].push(0); }
    for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    var hit = [], a = 0, b = 0;
    for (i = 0; i < n; i++) hit.push(false);
    while (a < n && b < m) { if (A[a] === B[b]) { hit[a] = true; a++; b++; } else if (dp[a + 1][b] >= dp[a][b + 1]) a++; else b++; }
    var extra = Math.max(0, m - dp[0][0]);
    var score = n ? Math.max(0, Math.round((dp[0][0] - extra * 0.25) / n * 100)) : 0;
    return { score: Math.min(100, score), hit: hit, A: A };
  }
  // 把打分结果画回原句（原句的词和 norm 后的词不一一对应时，退回只显示分数）
  function paint(target, res, lang) {
    var toks = target.match(/[^\s]+/g) || [], k = 0, out = [], ok = true;
    for (var i = 0; i < toks.length; i++) {
      var n = norm(toks[i], lang), good = true;
      for (var j = 0; j < n.length; j++) { if (k >= res.hit.length) { ok = false; break; } if (!res.hit[k]) good = false; k++; }
      out.push(n.length ? '<span class="' + (good ? 'ok' : 'miss') + '">' + esc(toks[i]) + '</span>' : esc(toks[i]));
    }
    return ok && k === res.hit.length ? out.join(' ') : esc(target);
  }
  function cls(s) { return s >= 85 ? 's-ok' : s >= 60 ? 's-mid' : 's-bad'; }

  /* ---------- 首页 ---------- */
  function load(cb) {
    var left = FILES.length;
    FILES.forEach(function (f) {
      var x = new XMLHttpRequest(); x.open('GET', 'speak/' + f + '.json?v=1');
      x.onload = function () { try { var d = JSON.parse(x.responseText); d.packs.forEach(function (p) { PACKS.push(p); BYID[p.id] = p; }); } catch (e) { } if (--left === 0) cb(); };
      x.onerror = function () { if (--left === 0) cb(); };
      x.send();
    });
  }
  function lines(p) { var out = []; (p.dialog || []).forEach(function (l, i) { out.push(['d' + i, l]); }); (p.phrases || []).forEach(function (l, i) { out.push(['p' + i, l]); }); return out; }
  function done(p) { var L = lines(p), n = 0; L.forEach(function (x) { if ((BEST[p.id + ':' + x[0]] || 0) >= 85) n++; }); return [n, L.length]; }
  function renderHome() {
    $('tabs').innerHTML = GROUPS.map(function (g) { return '<button data-g="' + g[0] + '"' + (g[0] === GRP ? ' class="on"' : '') + '>' + g[1] + '</button>'; }).join('');
    var g = null; GROUPS.forEach(function (x) { if (x[0] === GRP) g = x; });
    $('hnote').textContent = (g ? g[2] + '。' : '') + '每句都能听、能跟读打分。';
    var list = PACKS.filter(function (p) { return p.group === GRP; });
    $('grid').innerHTML = list.length ? list.map(function (p) {
      var d = done(p);
      return '<button class="pk" data-p="' + esc(p.id) + '"><span class="ic">' + esc(p.icon) + '</span><b>' + esc(p.name) + '</b><small>' + d[1] + ' 句' + (d[0] ? ' · 说好了 ' + d[0] : '') + '</small><div class="bar"><i style="width:' + Math.round(d[0] / d[1] * 100) + '%"></i></div></button>';
    }).join('') : '<div class="empty">加载失败，刷新试试</div>';
    var w = [];
    if (!SR) w.push('这个浏览器不支持语音识别打分（iPhone 用 Safari、安卓用 Chrome 可以）。' + (CAN_REC ? '可以用「🎙 录音」录下自己的声音，和原句对比着听。' : ''));
    $('micWarn').hidden = !w.length; $('micWarn').textContent = w.join(' ');
  }
  $('tabs').onclick = function (e) { var b = e.target.closest('[data-g]'); if (!b) return; GRP = b.getAttribute('data-g'); jset('grp', GRP); renderHome(); };
  $('grid').onclick = function (e) { var b = e.target.closest('[data-p]'); if (b) location.hash = b.getAttribute('data-p'); };

  /* ---------- 一个场景 ---------- */
  var P = null, REC = null, PLAY = null, MREC = null;
  function stopAll() {
    if (PLAY) { PLAY.on = false; PLAY = null; }
    try { speechSynthesis.cancel(); } catch (e) { }
    if (REC) { try { REC.abort(); } catch (e) { } REC = null; }
    if (MREC) { try { MREC.r.stop(); } catch (e) { } MREC = null; }
    var b = document.querySelectorAll('.mic.rec'), i; for (i = 0; i < b.length; i++) b[i].className = b[i].className.replace(' rec', '');
  }
  // 英文句子里的词可以点：查词、一键收进语境词库（lookup.js）
  function tx(t) { return window.WordSheet && /^en/.test(P.lang) ? WordSheet.wrap(t) : esc(t); }
  function lineHTML(key, l, isDialog) {
    var me = isDialog && l.who === 'You', best = BEST[P.id + ':' + key];
    return '<div class="ln" id="L-' + key + '" data-k="' + key + '">' +
      (isDialog ? '<div class="who' + (me ? ' me' : '') + '">' + (me ? '你' : esc(l.who)) + '</div>' : '') +
      '<div class="t">' + tx(l.t) + '</div><div class="zh">' + esc(l.zh) + '</div>' + (l.note ? '<div class="nt">💡 ' + esc(l.note) + '</div>' : '') +
      '<div class="acts"><button data-a="say">🔊 听</button><button data-a="slow">🐢 慢</button>' +
      (SR ? '<button class="mic" data-a="mic">🎙 跟读</button>' : CAN_REC ? '<button class="mic" data-a="rec">🎙 录音</button>' : '') +
      '<span class="score ' + (best != null ? cls(best) : '') + '">' + (best != null ? '最好 ' + best : '') + '</span></div><div class="heard"></div></div>';
  }
  function renderPack() {
    var p = P, mode = SET.mode === 'phrases' || !(p.dialog && p.dialog.length) ? 'phrases' : 'dialog', h = '';
    h += '<div class="intro">' + esc(p.intro) + '</div>';
    h += '<div class="seg" id="mode">' + (p.dialog && p.dialog.length ? '<button data-m="dialog"' + (mode === 'dialog' ? ' class="on"' : '') + '>💬 对话 ' + p.dialog.length + '</button>' : '') +
      '<button data-m="phrases"' + (mode === 'phrases' ? ' class="on"' : '') + '>📝 常用句 ' + p.phrases.length + '</button>' +
      '<button data-m="zh"' + (SET.hideZh ? ' class="on"' : '') + '>🙈 遮住中文</button>' +
      '<button data-m="rate">语速 ' + (SET.rate === 1 ? '正常' : SET.rate < 1 ? '慢' : '快') + '</button></div>';
    h += '<div id="lines" class="' + (SET.hideZh ? 'hidezh' : '') + '">';
    if (mode === 'dialog') p.dialog.forEach(function (l, i) { h += lineHTML('d' + i, l, true); });
    else p.phrases.forEach(function (l, i) { h += lineHTML('p' + i, l, false); });
    h += '</div><div class="bar2">' + (mode === 'dialog' ? '<button class="pri" data-a="role">🎭 我来演「你」</button>' : '') + '<button data-a="all">▶ 从头连播</button></div>';
    $('pack').innerHTML = h;
  }
  function lineOf(key) { return key.charAt(0) === 'd' ? P.dialog[+key.slice(1)] : P.phrases[+key.slice(1)]; }
  function setScore(key, s, heard) {
    var el = $('L-' + key); if (!el) return;
    var l = lineOf(key), res = align(l.t, heard, P.lang);
    el.querySelector('.t').innerHTML = paint(l.t, res, P.lang);
    var bk = P.id + ':' + key, best = Math.max(BEST[bk] || 0, s); BEST[bk] = best; jset('best', BEST);
    var sc = el.querySelector('.score'); sc.className = 'score ' + cls(s); sc.textContent = s + ' 分' + (best > s ? '（最好 ' + best + '）' : '');
    el.querySelector('.heard').textContent = '听到的是：' + (heard || '（没听清）');
  }
  function listen(key, btn, cb, keepPlay) {
    if (keepPlay) { try { speechSynthesis.cancel(); } catch (e) { } if (REC) { try { REC.abort(); } catch (e) { } REC = null; } }
    else stopAll();
    var l = lineOf(key), r = new SR(), got = false;
    REC = r;
    r.lang = P.lang; r.interimResults = false; r.maxAlternatives = 3; r.continuous = false;
    btn.className += ' rec'; btn.textContent = '● 说吧…';
    r.onresult = function (e) {
      got = true;
      var alts = e.results[0], best = { s: -1, t: '' }, i;
      for (i = 0; i < alts.length; i++) { var s = align(l.t, alts[i].transcript, P.lang).score; if (s > best.s) best = { s: s, t: alts[i].transcript }; }
      setScore(key, best.s, best.t);
    };
    r.onerror = function (e) { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast('没有麦克风权限：在浏览器设置里允许本站使用麦克风'); else if (e.error === 'network') toast('语音识别要联网，现在网络不通'); else if (e.error === 'no-speech') toast('没听到声音，再试一次'); };
    r.onend = function () { if (REC === r) REC = null; btn.className = btn.className.replace(' rec', ''); btn.textContent = '🎙 跟读'; if (!got) { var h = $('L-' + key); if (h) h.querySelector('.heard').textContent = ''; } if (cb) cb(got); };
    try { r.start(); } catch (e) { toast('语音识别启动失败'); btn.className = btn.className.replace(' rec', ''); btn.textContent = '🎙 跟读'; }
  }
  // 不支持识别时：录音 → 回放自己 → 再放原句
  function record(key, btn) {
    if (MREC) { try { MREC.r.stop(); } catch (e) { } return; }
    stopAll();
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var chunks = [], r = new MediaRecorder(stream);
      MREC = { r: r };
      btn.className += ' rec'; btn.textContent = '■ 说完点我';
      r.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      r.onstop = function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        MREC = null; btn.className = btn.className.replace(' rec', ''); btn.textContent = '🎙 录音';
        var a = new Audio(URL.createObjectURL(new Blob(chunks, { type: r.mimeType || 'audio/webm' })));
        toast('先放你的，再放原句');
        a.onended = function () { say(lineOf(key).t, P.lang, 0.95); };
        a.play().then(null, function () { say(lineOf(key).t, P.lang, 0.95); });
      };
      r.start();
      setTimeout(function () { if (MREC && MREC.r === r) r.stop(); }, 12000);
    }, function () { toast('没有麦克风权限'); });
  }
  function cur(key) { var c = document.querySelectorAll('.ln.cur'), i; for (i = 0; i < c.length; i++) c[i].className = 'ln'; var el = key && $('L-' + key); if (el) { el.className = 'ln cur'; var r = el.getBoundingClientRect(); if (r.top < 60 || r.bottom > window.innerHeight - 90) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }
  // 连播 / 角色扮演
  function play(role) {
    stopAll();
    var mode = $('mode').querySelector('.on[data-m="dialog"]') ? 'dialog' : 'phrases', list = mode === 'dialog' ? P.dialog : P.phrases, i = 0, me = PLAY = { on: true };
    (function step() {
      if (!me.on) return;
      if (i >= list.length) { cur(null); PLAY = null; toast(role ? '演完了！看看哪句分低，再练一遍' : '播完了'); return; }
      var key = (mode === 'dialog' ? 'd' : 'p') + i, l = list[i]; i++;
      cur(key);
      if (role && l.who === 'You' && SR) {
        var btn = $('L-' + key).querySelector('[data-a="mic"]');
        setTimeout(function () { if (me.on) listen(key, btn, function () { setTimeout(step, 700); }, true); }, 250);
      } else if (role && l.who === 'You') {
        toast('轮到你说了：说完点「继续」'); me.wait = step;
        var b2 = document.createElement('button'); b2.textContent = '继续 ▶'; b2.setAttribute('data-a', 'cont'); $('L-' + key).querySelector('.acts').appendChild(b2);
      } else say(l.t, P.lang, 1, function () { setTimeout(step, 500); });
    })();
  }
  $('pack').onclick = function (e) {
    var b = e.target.closest('button'), ln = e.target.closest('.ln');
    if (e.target.classList && e.target.classList.contains('zh')) { e.target.classList.toggle('show'); return; }
    if (!b) return;
    var m = b.getAttribute('data-m'), a = b.getAttribute('data-a');
    if (m === 'zh') { SET.hideZh = SET.hideZh ? 0 : 1; jset('set', SET); renderPack(); return; }
    if (m === 'rate') { SET.rate = SET.rate === 1 ? 0.8 : SET.rate < 1 ? 1.2 : 1; jset('set', SET); renderPack(); return; }
    if (m) { stopAll(); SET.mode = m; jset('set', SET); renderPack(); return; }
    if (a === 'all') { play(false); return; }
    if (a === 'role') { play(true); return; }
    if (!ln) return;
    var key = ln.getAttribute('data-k'), l = lineOf(key);
    if (a === 'say') { stopAll(); say(l.t, P.lang, 1); }
    else if (a === 'slow') { stopAll(); say(l.t, P.lang, 0.7); }
    else if (a === 'mic') { if (REC) { try { REC.stop(); } catch (er) { } return; } listen(key, b); }
    else if (a === 'rec') record(key, b);
    else if (a === 'cont' && PLAY && PLAY.wait) { b.parentNode.removeChild(b); var w = PLAY.wait; PLAY.wait = null; w(); }
  };

  function route() {
    stopAll();
    var id = decodeURIComponent((location.hash || '').replace('#', ''));
    P = BYID[id] || null;
    $('home').hidden = !!P; $('pack').hidden = !P; $('back').hidden = !P;
    if (P) { $('title').textContent = P.icon + ' ' + P.name; document.title = P.name + ' · 开口说'; GRP = P.group; renderPack(); window.scrollTo(0, 0); }
    else { $('title').textContent = '🗣️ 开口说'; document.title = '开口说 · 跟读练习'; renderHome(); }
  }
  if (window.WordSheet) WordSheet.bind($('pack'), function (el) {
    var ln = el.closest ? el.closest('.ln') : null, l = ln ? lineOf(ln.getAttribute('data-k')) : null;
    return l ? { text: l.t, src: '开口说 · ' + P.name } : null;
  });
  $('back').onclick = function () { if (history.length > 1) history.back(); else location.hash = ''; };
  window.addEventListener('hashchange', route);
  load(route);
})();
</script>
