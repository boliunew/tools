<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2A44">
<title>环球网络电台</title>
<style>
:root{--bg:#F2F4F8;--card:#fff;--ink:#141B2D;--soft:#5B6478;--faint:#98A0B3;--line:#DCE1EA;--accent:#3557D6;--accent-ink:#fff;--accent-soft:#E3E9FC;--live:#D7263D;--good:#1F8A5B}
@media (prefers-color-scheme: dark){:root{--bg:#0F131C;--card:#181E2B;--ink:#E8ECF5;--soft:#A0A9BD;--faint:#667089;--line:#273045;--accent:#7D98FF;--accent-ink:#0B1020;--accent-soft:#1E2847;--live:#FF5A6E;--good:#4FCB8E}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",Roboto,sans-serif;line-height:1.45;padding-bottom:120px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
main{max-width:680px;margin:0 auto;padding:16px 16px 0}
.top{display:flex;align-items:center;margin-bottom:12px}
.top h1{font-size:21px;margin:0;flex:1}
.top a{color:var(--soft);text-decoration:none;font-size:14px}
.top button{color:var(--soft);background:none;border:0;font-size:14px;padding:6px 10px}
.tabs{display:flex;overflow-x:auto;gap:8px;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 14px;font-size:15px;white-space:nowrap}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.tabs button span{font-size:19px;margin-right:4px;vertical-align:-2px}
.srch{display:flex;gap:8px;margin-bottom:10px}
.srch input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:16px}
.srch button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:0 16px;font-weight:600}
.chips{display:flex;overflow-x:auto;gap:6px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:13px;color:var(--soft)}
.chips button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.st{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.st:last-child{border-bottom:0}
.st.on{background:var(--accent-soft)}
.ico{width:44px;height:44px;border-radius:10px;background:var(--bg);flex:0 0 44px;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;margin-right:12px}
.ico img{width:100%;height:100%;object-fit:contain}
.st .t{flex:1;min-width:0}
.st .t b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .t small{display:block;font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .fav{border:0;background:none;font-size:20px;padding:6px 4px 6px 10px;color:var(--faint)}
.st .fav.on{color:#F2B01E}
.st.bad{opacity:.45}
.msg{padding:28px 16px;text-align:center;color:var(--soft)}
.more{display:block;width:100%;border:0;background:none;padding:14px;color:var(--accent);font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.08);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:10}
.bar .in{max-width:680px;margin:0 auto;display:flex;align-items:center}
.bar .ico{margin-right:10px}
.bar .t{flex:1;min-width:0}
.bar .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t small{font-size:12.5px;color:var(--soft)}
.bar .t small.live{color:var(--live);font-weight:600}
.bar .t small.err{color:var(--live)}
.bar .t .song{display:block;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.bar .t .song a,.songs a{color:var(--accent);font-weight:400;margin-left:6px;text-decoration:none;font-size:12px}
.addbtn{border:1px dashed var(--accent);background:none;color:var(--accent);border-radius:12px;padding:0 12px;font-weight:600;white-space:nowrap}
.addcard{display:block;width:100%;border:1.5px dashed var(--accent);background:none;color:var(--accent);border-radius:14px;padding:14px;font-size:15px;font-weight:600;margin-bottom:10px}
.mov{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:30;display:none}.mov.on{display:block}
.msh{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:620px;margin:0 auto;background:var(--card);color:var(--ink);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,0,0,.25);display:none}.msh.on{display:block}
.msh h3{margin:0 0 10px;font-size:17px}.msh label{display:block;font-size:12.5px;color:var(--soft);margin:10px 0 4px}
.msh input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:16px}
.msh .row{display:flex;gap:8px;margin-top:14px}.msh .row button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px;font-size:15px}
.msh .row button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}.msh .row button.red{color:var(--live)}
.msh .tip{font-size:12.5px;color:var(--soft);margin-top:10px;line-height:1.6}
.songs{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:14px}
.songs summary{cursor:pointer;font-weight:600}
.songs div{padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.songs small{display:block;color:var(--soft);font-size:12px}
.ctl{display:flex;align-items:center}
.ctl button{border:0;background:none;width:44px;height:44px;border-radius:50%;font-size:20px}
.ctl .pp{width:54px;height:54px;background:var(--accent);color:var(--accent-ink);font-size:22px;margin:0 4px}
.ctl .tm{font-size:13px;width:auto;padding:0 6px;color:var(--soft)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:5px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.hint{font-size:12.5px;color:var(--faint);text-align:center;margin:14px 0;line-height:1.7}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:18px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
.toast.on{opacity:.93}
</style>
<script src="sync.js?v=1"></script>
</head>
<body>
<main>
  <div class="top"><h1>📻 环球网络电台</h1><button id="fmRefresh">🔄 更新</button><a href="./">主页</a></div>
  <div class="tabs" id="tabs"></div>
  <div class="srch"><input id="q" placeholder="搜台名、风格，例如 news、jazz、BBC" autocomplete="off"><button id="qBtn">搜索</button><button class="addbtn" id="addSt">＋ 添加</button></div>
  <div class="chips" id="chips"></div>
  <div class="list" id="list"><div class="msg">加载中…</div></div>
  <details class="songs" id="songs" style="display:none"></details>
  <div class="hint">电台目录来自开源的 Radio Browser 社区数据库，节目由各电台官方直播流提供。<br>部分电台只在本国播放、或临时停播，连不上会自动提示。连车载蓝牙时方向盘「上一首 / 下一首」可以换台。</div>
</main>
<div class="bar" id="bar" style="display:none"><div class="in">
  <div class="ico" id="bIco">📻</div>
  <div class="t"><b id="bName"></b><span class="song" id="bSong" style="display:none"></span><small id="bStat"></small></div>
  <div class="ctl"><button id="bPrev" aria-label="上一个台">⏮</button><button class="pp" id="bPlay" aria-label="播放">▶</button><button id="bNext" aria-label="下一个台">⏭</button><button class="tm" id="bTimer" aria-label="睡眠定时">⏲</button></div>
</div></div>
<div class="toast" id="toast"></div>
<audio id="au" preload="none"></audio>
<div class="mov" id="mov"></div><div class="msh" id="msh"></div>
<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function get(k, d) { try { var v = localStorage.getItem('fm:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function put(k, v) { try { localStorage.setItem('fm:' + k, JSON.stringify(v)); } catch (e) { } }
  var toastT;
  function toast(m) { var t = $('toast'); t.textContent = m; t.className = 'toast on'; clearTimeout(toastT); toastT = setTimeout(function () { t.className = 'toast'; }, 2600); }

  var C = [
    { k: 'RU', f: '🇷🇺', n: '俄罗斯' }, { k: 'DE', f: '🇩🇪', n: '德国' }, { k: 'GB', f: '🇬🇧', n: '英国' },
    { k: 'US', f: '🇺🇸', n: '美国' }, { k: 'CN', f: '🇨🇳', n: '中国' }, { k: 'FAV', f: '⭐', n: '收藏' }, { k: 'MY', f: '➕', n: '我添加的' }
  ];
  var TAGZH = { news: '新闻', talk: '谈话', music: '音乐', pop: '流行', rock: '摇滚', classical: '古典', jazz: '爵士', dance: '舞曲', electronic: '电子', 'hip-hop': '嘻哈', hiphop: '嘻哈', rap: '说唱', country: '乡村', oldies: '怀旧', '80s': '80年代', '90s': '90年代', chillout: '放松', ambient: '氛围', sports: '体育', culture: '文化', public: '公共台', christian: '宗教', religion: '宗教', kids: '儿童', top40: '热门40', hits: '热歌', blues: '布鲁斯', metal: '金属', folk: '民谣', 'easy listening': '轻音乐', lounge: '休闲', soul: '灵魂', rnb: 'R&B', schlager: '德国流行', chanson: '香颂', information: '资讯', 'news talk': '新闻谈话', entertainment: '娱乐', variety: '综合', traffic: '交通', local: '本地' };
  var SERVERS = ['https://de1.api.radio-browser.info', 'https://fi1.api.radio-browser.info', 'https://de2.api.radio-browser.info'];
  var country = get('country', 'RU'), FAV = get('fav', {}), MY = get('custom', []), cache = {}, list = [], shown = [], tag = '', query = '', cur = null, curIdx = -1, hls = null, timer = null, timerEnd = 0, watchdog = null;
  var au = $('au'), ms = navigator.mediaSession;

  function api(path, cb, i) {
    i = i || 0;
    if (i >= SERVERS.length) { cb(null); return; }
    var x = new XMLHttpRequest();
    x.open('GET', SERVERS[i] + path);
    x.timeout = 12000;
    x.onload = function () { if (x.status === 200) { try { cb(JSON.parse(x.responseText)); return; } catch (e) { } } api(path, cb, i + 1); };
    x.onerror = x.ontimeout = function () { api(path, cb, i + 1); };
    x.send();
  }
  function clean(arr) {
    var seen = {}, out = [], i, s, key;
    for (i = 0; i < (arr || []).length; i++) {
      s = arr[i];
      if (!s || !s.url_resolved && !s.url) continue;
      key = (s.name || '').toLowerCase().replace(/\s+/g, ' ').replace(/^\s|\s$/g, '');
      if (!key || seen[key]) continue;
      seen[key] = 1;
      out.push({ id: s.stationuuid, name: (s.name || '').replace(/^\s+|\s+$/g, ''), url: s.url_resolved || s.url, fav: s.favicon || '', tags: (s.tags || '').toLowerCase().split(',').filter(function (t) { return t; }), codec: s.codec || '', br: s.bitrate || 0, hls: s.hls === 1 || /\.m3u8(\?|$)/i.test(s.url_resolved || s.url), cc: s.countrycode || '', votes: s.votes || 0, home: s.homepage || '' });
    }
    return out;
  }
  function loadCountry(cc, cb) {
    if (cache[cc]) { cb(cache[cc]); return; }
    api('/json/stations/search?countrycode=' + cc + '&hidebroken=true&order=clickcount&reverse=true&limit=300', function (d) {
      if (!d) { cb(null); return; }
      cache[cc] = clean(d); cb(cache[cc]);
    });
  }

  /* ---------- 保持链接最新：收藏 / 上次听的台换了地址时自动更新 ---------- */
  var RR = {};
  function fresh(s, n) { s.url = n.url; s.hls = n.hls; s.codec = n.codec; s.br = n.br; if (n.fav) s.fav = n.fav; }
  function refreshFavs(force, cb) {
    var ids = Object.keys(FAV), lastS = get('last', null);
    if (lastS && lastS.id && ids.indexOf(lastS.id) < 0) ids.push(lastS.id);
    if (!ids.length || (!force && Date.now() - get('favChecked', 0) < 12 * 3600000)) { if (cb) cb(0, 0); return; }
    api('/json/stations/byuuid?uuids=' + ids.join(','), function (d) {
      if (!d) { if (cb) cb(-1, 0); return; }
      var changed = 0, seen = {}, gone = 0, i, n;
      for (i = 0; i < d.length; i++) {
        n = clean([d[i]])[0]; if (!n) continue; seen[n.id] = 1;
        if (FAV[n.id]) { if (FAV[n.id].url !== n.url) changed++; fresh(FAV[n.id], n); delete FAV[n.id].gone; }
        if (lastS && lastS.id === n.id && lastS.url !== n.url) { fresh(lastS, n); put('last', lastS); if (!FAV[n.id]) changed++; }
      }
      for (i in FAV) if (FAV.hasOwnProperty(i) && !seen[i]) { FAV[i].gone = 1; gone++; }
      put('fav', FAV); put('favChecked', Date.now());
      if (cb) cb(changed, gone);
    });
  }
  $('fmRefresh').onclick = function () {
    var b = this; b.disabled = true; b.textContent = '🔄 更新中…';
    cache = {};
    refreshFavs(true, function (changed, gone) {
      b.disabled = false; b.textContent = '🔄 更新';
      toast(changed < 0 ? '电台目录暂时连不上，稍后再试' : '台单已更新' + (changed ? '，' + changed + ' 个收藏换了新地址' : '') + (gone ? '，' + gone + ' 个收藏已停播' : ''));
      open();
    });
  };

  /* ---------- UI ---------- */
  function renderTabs() {
    $('tabs').innerHTML = C.map(function (c) { return '<button data-c="' + c.k + '" class="' + (c.k === country ? 'on' : '') + '"><span>' + c.f + '</span>' + c.n + '</button>'; }).join('');
  }
  $('tabs').onclick = function (e) {
    var b = e.target.closest ? e.target.closest('button') : null; if (!b) return;
    country = b.getAttribute('data-c'); put('country', country); tag = ''; query = ''; $('q').value = '';
    renderTabs(); open();
  };
  function open() {
    if (country === 'FAV') { list = favList(); afterLoad(); return; }
    if (country === 'MY') { list = MY.slice(); afterLoad(); return; }
    $('list').innerHTML = '<div class="msg">正在加载' + nameOf(country) + '的电台…</div>'; $('chips').innerHTML = '';
    var want = country;
    loadCountry(want, function (arr) {
      if (want !== country) return;
      if (!arr) { $('list').innerHTML = '<div class="msg">电台目录暂时连不上，稍后再试。</div>'; return; }
      list = arr; afterLoad();
    });
  }
  function nameOf(cc) { for (var i = 0; i < C.length; i++) if (C[i].k === cc) return C[i].n; return cc; }
  function favList() { var a = [], k; for (k in FAV) if (FAV.hasOwnProperty(k)) a.push(FAV[k]); a.sort(function (x, y) { return (y.t || 0) - (x.t || 0); }); return a; }
  function afterLoad() { renderChips(); render(); }
  function renderChips() {
    if (country === 'FAV' || country === 'MY') { $('chips').innerHTML = ''; return; }
    var cnt = {}, i, j, t;
    for (i = 0; i < list.length; i++) for (j = 0; j < list[i].tags.length; j++) { t = list[i].tags[j]; if (TAGZH[t]) cnt[t] = (cnt[t] || 0) + 1; }
    var ts = Object.keys(cnt).filter(function (t) { return cnt[t] >= 3; }).sort(function (a, b) { return cnt[b] - cnt[a]; }).slice(0, 14);
    $('chips').innerHTML = '<button data-t="" class="' + (!tag ? 'on' : '') + '">全部</button>' + ts.map(function (t) { return '<button data-t="' + esc(t) + '" class="' + (t === tag ? 'on' : '') + '">' + TAGZH[t] + '</button>'; }).join('');
  }
  $('chips').onclick = function (e) { var b = e.target.closest ? e.target.closest('button') : null; if (!b) return; tag = b.getAttribute('data-t'); renderChips(); render(); };
  function match(s) {
    if (tag && s.tags.indexOf(tag) < 0) return false;
    if (query) { var q = query.toLowerCase(); if ((s.name.toLowerCase().indexOf(q) < 0) && s.tags.join(' ').indexOf(q) < 0) return false; }
    return true;
  }
  var PAGE = 60, limit = PAGE;
  function render() {
    shown = list.filter(match);
    var addCard = country === 'MY' ? '<button class="addcard" id="addCard">＋ 自己添加一个电台（粘贴直播流地址）</button>' : '';
    if (!shown.length) { $('list').innerHTML = addCard + '<div class="msg">' + (country === 'MY' ? '还没有自己添加的电台。<br>在电台的官网找到「直播流」地址（一般以 .mp3、.aac、.m3u8 结尾），粘贴进来就能听。' : country === 'FAV' ? '还没有收藏。点电台右边的 ☆ 收藏常听的台。' : query ? '这里没找到「' + esc(query) + '」，点「搜索」会在整个目录里找。' : '没有电台') + '</div>'; return; }
    var h = '', i, s;
    for (i = 0; i < shown.length && i < limit; i++) {
      s = shown[i];
      var meta = [];
      if (country === 'FAV' || query) meta.push(flagOf(s.cc));
      if (s.tags.length) meta.push(s.tags.slice(0, 3).map(function (t) { return TAGZH[t] || t; }).join(' · '));
      if (s.br) meta.push(s.br + 'k'); else if (s.codec) meta.push(s.codec);
      if (s.my && !meta.length) meta.push('自己添加 · ' + s.url.replace(/^https?:\/\//, '').split('/')[0]);
      h += '<div class="st' + (cur && cur.id === s.id ? ' on' : '') + (s.bad ? ' bad' : '') + '" data-i="' + i + '"><div class="ico">' + icon(s) + '</div><div class="t"><b>' + esc(s.name) + '</b><small>' + esc(meta.join(' · ')) + '</small></div>' + (country === 'MY' ? '<button class="fav" data-edit="' + i + '" aria-label="修改">⋯</button>' : '<button class="fav' + (FAV[s.id] ? ' on' : '') + '" data-fav="' + i + '" aria-label="收藏">' + (FAV[s.id] ? '★' : '☆') + '</button>') + '</div>';
    }
    if (shown.length > limit) h += '<button class="more" id="more">再显示 ' + Math.min(PAGE, shown.length - limit) + ' 个（共 ' + shown.length + '）</button>';
    $('list').innerHTML = addCard + h;
    if ($('more')) $('more').onclick = function () { limit += PAGE; render(); };
  }
  function flagOf(cc) { for (var i = 0; i < C.length; i++) if (C[i].k === cc) return C[i].f; return cc ? '🌐 ' + cc : ''; }
  function icon(s) { return s.fav && /^https:/i.test(s.fav) ? '<img src="' + esc(s.fav) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.textContent=\'📻\'">' : '📻'; }
  $('list').onclick = function (e) {
    if (e.target.id === 'addCard') { editSt(null); return; }
    var ed = e.target.closest ? e.target.closest('[data-edit]') : null;
    if (ed) { e.stopPropagation(); editSt(shown[+ed.getAttribute('data-edit')]); return; }
    var f = e.target.closest ? e.target.closest('[data-fav]') : null;
    if (f) { e.stopPropagation(); var s = shown[+f.getAttribute('data-fav')]; toggleFav(s); render(); return; }
    var row = e.target.closest ? e.target.closest('.st') : null;
    if (row) play(+row.getAttribute('data-i'));
  };
  function toggleFav(s) { if (FAV[s.id]) delete FAV[s.id]; else { var c = JSON.parse(JSON.stringify(s)); c.t = Date.now(); delete c.bad; FAV[s.id] = c; toast('已收藏 ⭐'); } put('fav', FAV); }
  function doSearch() {
    query = $('q').value.replace(/^\s+|\s+$/g, ''); limit = PAGE;
    if (!query) { render(); return; }
    render();
    if (country === 'FAV') return;
    var want = country, q = query;
    $('qBtn').textContent = '…';
    api('/json/stations/search?name=' + encodeURIComponent(q) + '&countrycode=' + want + '&hidebroken=true&order=clickcount&reverse=true&limit=100', function (d1) {
      api('/json/stations/search?tag=' + encodeURIComponent(q.toLowerCase()) + '&countrycode=' + want + '&hidebroken=true&order=clickcount&reverse=true&limit=100', function (d2) {
        $('qBtn').textContent = '搜索';
        if (want !== country || q !== query) return;
        var extra = clean((d1 || []).concat(d2 || [])), have = {}, i;
        for (i = 0; i < list.length; i++) have[list[i].id] = 1;
        for (i = 0; i < extra.length; i++) if (!have[extra[i].id]) list.push(extra[i]);
        render();
      });
    });
  }
  $('qBtn').onclick = doSearch;
  $('q').onkeydown = function (e) { if (e.keyCode === 13) doSearch(); };
  $('q').oninput = function () { query = this.value.replace(/^\s+|\s+$/g, ''); limit = PAGE; render(); };

  /* ---------- playback ---------- */
  function stat(t, cls) { $('bStat').innerHTML = t; $('bStat').className = cls || ''; }
  function stopHls() { if (hls) { try { hls.destroy(); } catch (e) { } hls = null; } }
  function withHls(cb) {
    if (window.Hls) { cb(); return; }
    var s = document.createElement('script'); s.src = 'vendor/hls.min.js'; s.onload = cb;
    s.onerror = function () { stat('这个台需要 HLS 播放组件，加载失败', 'err'); };
    document.head.appendChild(s);
  }

  /* ---------- 自己添加的电台 ---------- */
  function guessHls(u) { return /\.m3u8(\?|$)/i.test(u); }
  function closeEd() { $('msh').className = 'msh'; $('mov').className = 'mov'; }
  $('mov').onclick = closeEd;
  $('addSt').onclick = function () { editSt(null); };
  function editSt(s0) {
    var isNew = !s0;
    $('msh').innerHTML = '<h3>' + (isNew ? '＋ 添加电台' : '修改电台') + '</h3>' +
      '<label>直播流地址</label><input id="eUrl" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://…/stream.mp3 或 .m3u8 / .pls / .m3u" value="' + esc(s0 ? s0.url : '') + '">' +
      '<label>名字</label><input id="eName" autocomplete="off" placeholder="例如 KPCC 南加新闻" value="' + esc(s0 ? s0.name : '') + '">' +
      '<div class="tip" id="eTip">地址要以 https 开头（http 的台浏览器会拦）。播放列表（.pls / .m3u）会自动读出里面的真实地址。</div>' +
      '<div class="row"><button id="eTry">▶ 试听</button><button class="pri" id="eSave">保存</button>' + (isNew ? '' : '<button class="red" id="eDel">删除</button>') + '</div>';
    $('msh').className = 'msh on'; $('mov').className = 'mov on';
    if (isNew) $('eUrl').focus();
    function tip(t, bad) { $('eTip').innerHTML = t; $('eTip').style.color = bad ? 'var(--live)' : ''; }
    function resolve(cb) {
      var u = $('eUrl').value.replace(/^\s+|\s+$/g, '');
      if (!/^https?:\/\/\S+$/i.test(u)) { tip('请粘贴完整的地址（https://…）', true); return; }
      if (/^http:/i.test(u)) tip('这是 http 地址，会先自动改成 https 试试；如果连不上，说明这个台不支持 https。');
      if (/\.(pls|m3u)(\?|$)/i.test(u) && !/\.m3u8/i.test(u)) {
        var x = new XMLHttpRequest(); x.open('GET', u.replace(/^http:/i, 'https:')); x.timeout = 8000;
        x.onload = function () { var m = /(?:File\d+=)?(https?:\/\/[^\s]+)/i.exec(x.responseText || ''); if (m) { tip('从播放列表读到：' + esc(m[1])); cb(m[1]); } else cb(u); };
        x.onerror = x.ontimeout = function () { cb(u); };
        x.send(); return;
      }
      cb(u);
    }
    function build(u) { return { id: s0 ? s0.id : 'my-' + Date.now().toString(36), my: 1, name: $('eName').value.replace(/^\s+|\s+$/g, '') || u.replace(/^https?:\/\//, '').split('/')[0], url: u, fav: '', tags: [], codec: '', br: 0, hls: guessHls(u), cc: '', votes: 0, home: '' }; }
    $('eTry').onclick = function () { resolve(function (u) { var s = build(u); shown = [s]; curIdx = 0; cur = s; $('bar').style.display = 'block'; $('bName').textContent = s.name; $('bIco').innerHTML = '📻'; stat('连接中…'); start(s); }); };
    $('eSave').onclick = function () {
      resolve(function (u) {
        var s = build(u), i;
        for (i = 0; i < MY.length; i++) if (MY[i].id === s.id) { MY[i] = s; break; }
        if (i === MY.length) MY.unshift(s);
        put('custom', MY); closeEd(); toast(isNew ? '已添加到「我添加的」' : '已保存');
        country = 'MY'; put('country', country); renderTabs(); open();
      });
    };
    if (!isNew) $('eDel').onclick = function () {
      MY = MY.filter(function (x) { return x.id !== s0.id; }); put('custom', MY);
      if (FAV[s0.id]) { delete FAV[s0.id]; put('fav', FAV); }
      closeEd(); toast('已删除'); open();
    };
  }
  function play(i) {
    if (i < 0 || i >= shown.length) return;
    curIdx = i; cur = shown[i];
    $('bar').style.display = 'block';
    $('bName').textContent = cur.name; $('bIco').innerHTML = icon(cur);
    stat('连接中…');
    put('last', cur);
    render(); start(cur); npStart(cur);
    if (!cur.my) try { var x = new XMLHttpRequest(); x.open('GET', SERVERS[0] + '/json/url/' + cur.id); x.send(); } catch (e) { }
    meta();
  }
  function start(s) {
    stopHls(); clearTimeout(watchdog);
    var url = s.url.replace(/^http:\/\//i, 'https://');
    var native = au.canPlayType('application/vnd.apple.mpegurl');
    if (s.hls && !native) {
      withHls(function () {
        if (!window.Hls.isSupported()) { fail('浏览器不支持这个台的格式'); return; }
        hls = new window.Hls(); hls.loadSource(url); hls.attachMedia(au);
        hls.on(window.Hls.Events.MANIFEST_PARSED, function () { tryPlay(); });
        hls.on(window.Hls.Events.ERROR, function (ev, d) { if (d && d.fatal) fail('这个台连不上'); });
        hls.on(window.Hls.Events.FRAG_PARSING_METADATA, function (ev, d) { (d && d.samples || []).forEach(function (sm) { var t = id3Title(sm.data); if (t) npShow(t, s); }); });
      });
    } else { au.src = url; tryPlay(); }
    watchdog = setTimeout(function () { if (au.paused || au.readyState < 3) fail('连接超时'); }, 15000);
  }
  function tryPlay() { var p = au.play(); if (p && p.catch) p.catch(function (e) { if (e && e.name === 'NotAllowedError') stat('点 ▶ 开始播放'); }); }
  function fail(why) {
    clearTimeout(watchdog);
    if (!cur) return;
    if (cur.id && !cur.my && !RR[cur.id]) {
      var s0 = cur; RR[s0.id] = 1; stat('连不上，正在查这个台的新地址…');
      api('/json/stations/byuuid?uuids=' + s0.id, function (d) {
        var n = d && d[0] ? clean([d[0]])[0] : null;
        if (cur !== s0) return;
        if (n && n.url !== s0.url) {
          fresh(s0, n); if (FAV[s0.id]) { fresh(FAV[s0.id], n); put('fav', FAV); }
          var L0 = get('last', null); if (L0 && L0.id === s0.id) { fresh(L0, n); put('last', L0); }
          toast('这个台换了新地址，已自动更新'); start(s0); npStart(s0);
        } else { RR[s0.id] = 2; fail(why); }
      });
      return;
    }
    cur.bad = true;
    stat(why + '（可能只限本国收听或已停播），按 ⏭ 换下一个', 'err');
    $('bPlay').textContent = '▶';
    render();
  }
  au.addEventListener('playing', function () { clearTimeout(watchdog); if (cur) cur.bad = false; stat('<span class="dot"></span>直播中' + (cur && cur.br ? ' · ' + cur.br + 'kbps' : ''), 'live'); $('bPlay').textContent = '❚❚'; if (ms) ms.playbackState = 'playing'; });
  au.addEventListener('pause', function () { $('bPlay').textContent = '▶'; if (cur && !cur.bad) stat('已暂停'); if (ms) ms.playbackState = 'paused'; });
  au.addEventListener('waiting', function () { if (cur) stat('缓冲中…'); });
  au.addEventListener('error', function () { if (!hls) fail('这个台连不上'); });
  function toggle() {
    if (!cur) { if (shown.length) play(0); return; }
    if (au.paused) { if (au.readyState === 0 || cur.bad) { start(cur); npStart(cur); } else tryPlay(); } else au.pause();
  }
  function step(d) {
    if (!shown.length) return;
    var i = curIdx, n = 0;
    do { i = (i + d + shown.length) % shown.length; n++; } while (shown[i].bad && n < shown.length);
    play(i);
  }
  $('bPlay').onclick = toggle;
  $('bNext').onclick = function () { step(1); };
  $('bPrev').onclick = function () { step(-1); };
  function meta() {
    if (!ms || !cur) return;
    try {
      var art = cur.fav && /^https:/i.test(cur.fav) ? [{ src: cur.fav, sizes: '256x256' }] : [];
      ms.metadata = new window.MediaMetadata({ title: NP.song || cur.name, artist: NP.song ? cur.name : flagOf(cur.cc) + ' ' + nameOf(cur.cc) + ' · 网络电台', album: cur.tags.slice(0, 3).map(function (t) { return TAGZH[t] || t; }).join(' · '), artwork: art });
    } catch (e) { }
  }
  if (ms) {
    var H = { play: function () { toggle(); }, pause: function () { au.pause(); }, nexttrack: function () { step(1); }, previoustrack: function () { step(-1); } };
    for (var a in H) if (H.hasOwnProperty(a)) { try { ms.setActionHandler(a, H[a]); } catch (e) { } }
  }

  /* ---------- sleep timer ---------- */
  var TIMERS = [0, 15, 30, 60, 90];
  $('bTimer').onclick = function () {
    var curMin = timerEnd ? Math.round((timerEnd - Date.now()) / 60000) : 0, k = 0, i;
    for (i = 0; i < TIMERS.length; i++) if (TIMERS[i] >= curMin) { k = i; break; }
    var next = TIMERS[(k + 1) % TIMERS.length];
    clearInterval(timer); timerEnd = 0;
    if (next) {
      timerEnd = Date.now() + next * 60000;
      timer = setInterval(function () {
        var left = timerEnd - Date.now();
        if (left <= 0) { clearInterval(timer); timerEnd = 0; au.pause(); $('bTimer').textContent = '⏲'; toast('睡眠定时到了，已停止播放'); return; }
        $('bTimer').textContent = Math.ceil(left / 60000) + "'";
      }, 15000);
      $('bTimer').textContent = next + "'";
      toast(next + ' 分钟后自动停止');
    } else { $('bTimer').textContent = '⏲'; toast('已取消睡眠定时'); }
  };

  /* ---------- now playing: Icecast status / Shoutcast stats / ICY in-stream / HLS ID3 (best effort) ---------- */
  var NP = { tok: 0, timer: null, song: '', hist: get('songs', []) };
  function xget(url, cb) {
    var x = new XMLHttpRequest(); x.open('GET', url); x.timeout = 8000;
    x.onload = function () { cb(x.status === 200 ? x.responseText : null); };
    x.onerror = x.ontimeout = function () { cb(null); };
    try { x.send(); } catch (e) { cb(null); }
  }
  function icecast(u, s, cb) {
    xget(u.origin + '/status-json.xsl', function (t) {
      if (!t) { cb(null); return; }
      try {
        var src = JSON.parse(t).icestats.source, arr = [].concat(src || []), pick = null, i;
        for (i = 0; i < arr.length; i++) { var lu = String(arr[i].listenurl || ''); if (lu && u.pathname.length > 1 && lu.slice(-u.pathname.length) === u.pathname) pick = arr[i]; }
        if (!pick && arr.length === 1) pick = arr[0];
        if (!pick) { cb(null); return; }
        cb((pick.artist && pick.title ? pick.artist + ' - ' + pick.title : pick.title || pick.artist || '') + '');
      } catch (e) { cb(null); }
    });
  }
  function shoutcast(u, s, cb) {
    xget(u.origin + '/stats?sid=1&json=1', function (t) {
      if (t) { try { var d = JSON.parse(t); if (d && d.songtitle != null) { cb(String(d.songtitle)); return; } } catch (e) { } }
      xget(u.origin + '/currentsong?sid=1', function (t2) { cb(t2 && t2.length < 300 && !/</.test(t2) ? t2 : null); });
    });
  }
  function decodeText(bytes) {
    var t = '';
    try { t = new TextDecoder('utf-8', { fatal: true }).decode(bytes); }
    catch (e) { for (var i = 0; i < bytes.length; i++) t += String.fromCharCode(bytes[i]); }
    return t;
  }
  function icy(u, s, cb) {
    if (!window.fetch || !window.AbortController || !window.TextDecoder) { cb(null); return; }
    var ac = new AbortController(), done = false;
    function fin(v) { if (done) return; done = true; try { ac.abort(); } catch (e) { } cb(v); }
    setTimeout(function () { fin(null); }, 12000);
    fetch(u.href, { headers: { 'Icy-MetaData': '1' }, signal: ac.signal, cache: 'no-store' }).then(function (r) {
      var mi = parseInt(r.headers.get('icy-metaint'), 10);
      if (!mi || !r.body || !r.body.getReader) { fin(null); return; }
      var rd = r.body.getReader(), buf = new Uint8Array(mi + 4081), got = 0;
      (function pump() {
        rd.read().then(function (x) {
          if (x.done) { fin(null); return; }
          var c = x.value, n = Math.min(c.length, buf.length - got);
          buf.set(c.subarray(0, n), got); got += n;
          if (got > mi) {
            var L = buf[mi] * 16;
            if (got >= mi + 1 + L) { var m = /StreamTitle='(.*?)';/.exec(decodeText(buf.subarray(mi + 1, mi + 1 + L))); fin(m ? m[1] : ''); return; }
          }
          pump();
        }, function () { fin(null); });
      })();
    }, function () { fin(null); });
  }
  function id3Title(b) {
    try {
      if (!b || b[0] !== 73 || b[1] !== 68 || b[2] !== 51) return '';
      var ver = b[3], end = 10 + ((b[6] & 127) << 21 | (b[7] & 127) << 14 | (b[8] & 127) << 7 | (b[9] & 127)), p = 10, f = {};
      while (p + 10 <= end && p + 10 <= b.length) {
        var id = String.fromCharCode(b[p], b[p + 1], b[p + 2], b[p + 3]);
        var sz = ver >= 4 ? ((b[p + 4] & 127) << 21 | (b[p + 5] & 127) << 14 | (b[p + 6] & 127) << 7 | (b[p + 7] & 127)) : (b[p + 4] << 24 | b[p + 5] << 16 | b[p + 6] << 8 | b[p + 7]);
        if (!/^[A-Z0-9]{4}$/.test(id) || sz <= 0) break;
        var body = b.subarray(p + 10, p + 10 + sz), enc = body[0], txt = '', i;
        if (id.charAt(0) === 'T') {
          if (enc === 1 || enc === 2) { for (i = 1 + (enc === 1 ? 2 : 0); i + 1 < body.length; i += 2) { var cc = (enc === 1 && body[1] === 0xFE) || enc === 2 ? body[i] << 8 | body[i + 1] : body[i + 1] << 8 | body[i]; if (cc) txt += String.fromCharCode(cc); } }
          else txt = decodeText(body.subarray(1)).replace(/\u0000/g, '');
          f[id] = txt;
        }
        p += 10 + sz;
      }
      if (f.TXXX && /StreamTitle/i.test(f.TXXX)) { var m = /StreamTitle\W*(.+)/i.exec(f.TXXX); if (m) return m[1]; }
      return f.TIT2 ? (f.TPE1 ? f.TPE1 + ' - ' : '') + f.TIT2 : '';
    } catch (e) { return ''; }
  }
  function npShow(song, s) {
    if (s !== cur || song == null) return;
    song = String(song).replace(/\s+/g, ' ').replace(/^\s|\s$/g, '');
    if (!song || /^(-|unknown|n\/a|none)$/i.test(song) || song.toLowerCase() === (s.name || '').toLowerCase() || song === NP.song) return;
    NP.song = song;
    $('bSong').innerHTML = '🎵 ' + esc(song) + '<a href="https://music.youtube.com/search?q=' + encodeURIComponent(song) + '" target="_blank" rel="noopener">搜歌 ↗</a>';
    $('bSong').style.display = 'block';
    NP.hist = NP.hist.filter(function (h) { return h.song !== song; });
    NP.hist.unshift({ song: song, st: s.name, t: Date.now() });
    if (NP.hist.length > 40) NP.hist.length = 40;
    put('songs', NP.hist); renderSongs(); meta();
  }
  function renderSongs() {
    var el = $('songs');
    if (!NP.hist.length) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    var open = el.open;
    el.innerHTML = '<summary>🎵 最近听到的歌（' + NP.hist.length + '）</summary>' + NP.hist.map(function (h) {
      var d = new Date(h.t);
      return '<div>' + esc(h.song) + '<a href="https://music.youtube.com/search?q=' + encodeURIComponent(h.song) + '" target="_blank" rel="noopener">搜歌 ↗</a><small>' + esc(h.st) + ' · ' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2) + '</small></div>';
    }).join('');
    el.open = open;
  }
  function npStop() { NP.tok++; clearTimeout(NP.timer); NP.song = ''; $('bSong').style.display = 'none'; $('bSong').innerHTML = ''; }
  function npStart(s) {
    npStop();
    if (s.hls) return; // HLS streams report titles through ID3 tags (handled in start())
    var tok = NP.tok, u;
    try { u = new URL(s.url.replace(/^http:\/\//i, 'https://')); } catch (e) { return; }
    var tries = [icecast, shoutcast, icy], k = 0;
    function loop(f) { NP.timer = setTimeout(function () { if (tok !== NP.tok) return; f(u, s, function (v) { if (tok !== NP.tok) return; if (v) npShow(v, s); loop(f); }); }, 20000); }
    (function nextTry() {
      if (tok !== NP.tok || k >= tries.length) return;
      var f = tries[k++];
      f(u, s, function (v) { if (tok !== NP.tok) return; if (v == null) { nextTry(); return; } npShow(v, s); loop(f); });
    })();
  }
  renderSongs();

  renderTabs(); open();
  refreshFavs(false, function (changed) { if (changed > 0 && country === 'FAV') open(); });
  var last = get('last', null);
  if (last) { cur = last; curIdx = -1; $('bar').style.display = 'block'; $('bName').textContent = last.name; $('bIco').innerHTML = icon(last); stat('上次听的 · 点 ▶ 继续'); shown = shown.length ? shown : [last]; }
})();
</script>
