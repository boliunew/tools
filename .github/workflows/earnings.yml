name: 财报与经济日历

on:
  schedule:
    # GitHub 的定时任务经常晚 4～6 小时才真正开始，所以早上那次提前到半夜排队
    - cron: "11 7 * * 1-5"    # 美东凌晨：开盘前把今天的日历准备好
    - cron: "41 12 * * 1-5"   # 补跑一次（以防上面那次被延迟或失败）
    - cron: "23 21 * * 1-5"   # 收盘后：补上当天盘前财报的结果、昨晚盘后财报的反应
    - cron: "37 18 * * 0"     # 周日提前准备下周
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["earnings/build.py"]

permissions:
  contents: write

concurrency:
  group: earnings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: earnings/requirements.txt
      - run: pip install -r earnings/requirements.txt
      - run: python earnings/build.py
      - name: Upload (test branches)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: earnings-data
          path: earnings/data/*.json
      - name: Commit
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add earnings/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "财报日历更新 $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
