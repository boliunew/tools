name: traffic-probe
on:
  push:
    branches: [traffic-probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          exec > probe.txt 2>&1
          curl -sS -m 60 https://cwwp2.dot.ca.gov/data/d4/lcs/lcsStatusD04.json -o lcs.json
          python3 -c "
          import json;d=json.load(open('lcs.json'))['data'];print(len(d))
          print(json.dumps(d[0],indent=1)[:6000])
          import collections;c=collections.Counter()
          for x in d:
            cl=x['lcs'].get('closure',{});c[(cl.get('typeOfClosure'),cl.get('typeOfWork'))]+=1
          print(c.most_common(30))
          "
          curl -sS -m 60 -o overpass.json --data-urlencode 'data=[out:json][timeout:120];way["highway"="motorway"]["ref"](37.70,-122.52,37.80,-122.38);out tags 20;' https://overpass-api.de/api/interpreter; head -c 3000 overpass.json
      - run: |
          git config user.name bot; git config user.email bot@x
          git add probe.txt; git commit -m out; git push origin HEAD:traffic-probe
