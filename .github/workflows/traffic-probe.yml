name: traffic-probe
on:
  push:
    branches: [traffic-probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e; exec > probe.txt 2>&1
          H(){ echo "=== $1"; curl -sS -m 30 -D /tmp/h -o /tmp/b -A "Mozilla/5.0 (Linux; Android 14)" -H "Origin: https://boliunew.github.io" "$1"; echo "rc=$?"; grep -i -E "^HTTP|access-control-allow-origin|^location|content-type" /tmp/h; head -c ${2:-600} /tmp/b | tr -d '\r'; echo; }
          curl -sS -m 30 "https://api.fxtwitter.com/status/1585341984679469056" -o fx1.json
          curl -sS -m 30 "https://api.fxtwitter.com/NASA/status/1838297133457662341" -o fx2.json
          python3 -c "
          import json
          for f in ('fx1.json','fx2.json'):
            d=json.load(open(f)); print(f, d.get('code')); print(json.dumps(d.get('tweet',{}).get('media'),indent=0)[:2500])
          "
      - run: |
          git config user.name bot; git config user.email bot@x
          git add probe.txt fx1.json fx2.json; git commit -m out; git push origin HEAD:traffic-probe
