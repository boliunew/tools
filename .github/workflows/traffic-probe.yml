name: traffic-probe
on:
  push:
    branches: [traffic-probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          exec > probe.txt 2>&1
          for u in "https://embed.waze.com/iframe?zoom=10&lat=37.6&lon=-122.2&pin=1" "https://www.waze.com/live-map/" "https://embed.waze.com/iframe?zoom=12&lat=37.77&lon=-122.42&ct=livemap"; do
            echo "=== $u"; curl -sS -m 30 -L -D /tmp/h -o /tmp/b -A "Mozilla/5.0 (Linux; Android 14)" "$u"; echo rc=$?
            grep -i -E "^HTTP|x-frame-options|content-security-policy|^location" /tmp/h | cut -c1-300; head -c 500 /tmp/b; echo
          done
      - run: |
          git config user.name bot; git config user.email bot@x
          git add probe.txt; git commit -m out; git push origin HEAD:traffic-probe
