name: traffic-probe
on:
  push:
    branches: [traffic-probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          exec > probe.txt 2>&1
          H(){ echo "=== $1"; curl -sS -m 60 -D /tmp/h -o /tmp/b -A "Mozilla/5.0" -H "Origin: https://boliunew.github.io" "$1"; echo "rc=$?"; grep -i -E "^HTTP|access-control-allow-origin|^location|content-type|content-length" /tmp/h; head -c ${2:-600} /tmp/b | tr -d '\r'; echo; }
          curl -sS -m 60 "https://api-v3.amtraker.com/v3/trains" -o tr.json
          python3 -c "import json;d=json.load(open('tr.json'));t=d.get('11',d[list(d)[0]])[0];print(json.dumps(t,indent=1)[:5000]);print(len(d), sum(len(v) for v in d.values()))"
          curl -sSL -m 120 -A "Mozilla/5.0" https://content.amtrak.com/content/gtfs/GTFS.zip -o g.zip
          unzip -p g.zip agency.txt | head -5
          unzip -p g.zip routes.txt | grep -i -E "joaquin|surfliner|starlight|zephyr|chief|sunset|eagle|capitol"
          unzip -p g.zip trips.txt | head -3
          unzip -p g.zip stop_times.txt | head -3
      - run: |
          git config user.name bot; git config user.email bot@x
          git add probe.txt; git commit -m out; git push origin HEAD:traffic-probe
