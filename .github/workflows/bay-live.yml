name: 湾区实时路况

# 每 15 分钟抓一次 CHP 事故、Caltrans 路牌行车时间和封路，生成 live.json，强推到 live-data 分支（只保留最新一份，不增加主分支历史）
# 页面从 https://raw.githubusercontent.com/boliunew/tools/live-data/bay/live.json 读
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/build_bay_live.py", ".github/workflows/bay-live.yml"]

permissions:
  contents: write

concurrency:
  group: bay-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          mkdir -p out/bay
          curl -sfL -m 30 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/live-data/bay/cms_base.json?t=$(date +%s)" -o out/bay/cms_base.json || rm -f out/bay/cms_base.json
          python scripts/build_bay_live.py out/bay
      - name: Publish to live-data
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bay
          git commit -qm "湾区实时路况 $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live-data
