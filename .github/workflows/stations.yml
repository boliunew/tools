name: 附近车站

# 把 Amtrak、BART、Muni、VTA、Caltrain、Metrolink 的车站合成 stations/near.json（📍 附近车站用）
on:
  schedule:
    - cron: "47 13 * * 2"   # 每周二（在 Amtrak 时刻表更新之后）
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/build_stations.py", ".github/workflows/stations.yml", "amtrak.html"]

permissions:
  contents: write

concurrency:
  group: stations
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_stations.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stations/near.json stations/deps.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "附近车站数据更新 $(date -u +%F)"
          B="${GITHUB_REF_NAME}"
          for i in 1 2 3; do git pull --rebase origin "$B" && git push origin "HEAD:$B" && break; sleep 5; done
