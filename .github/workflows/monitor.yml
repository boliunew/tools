name: 网页监控

on:
  issues:
    types: [opened, edited, reopened, closed]
  schedule:
    - cron: "17 */4 * * *"   # 每 4 小时
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    # 只处理「监控」issue，并且只处理仓库主人自己提交的
    if: >-
      github.event_name != 'issues' ||
      (startsWith(github.event.issue.title, '监控') && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: monitor/requirements.txt
      - run: pip install -r monitor/requirements.txt
      - name: Check pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_ACTION: ${{ github.event.action }}
        run: python monitor/check.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "监控更新 $(date -u +%F-%H%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
