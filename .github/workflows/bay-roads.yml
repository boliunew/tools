name: 湾区高速路线图

# 每月从 OpenStreetMap 重新取湾区高速公路走向，生成 bay/roads.json
on:
  schedule:
    - cron: "37 13 5 * *"   # 每月 5 号
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/build_bay_roads.py", ".github/workflows/bay-roads.yml"]

permissions:
  contents: write

concurrency:
  group: bay-roads
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/build_bay_roads.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bay/roads.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "湾区高速路线图更新 $(date -u +%F)"
          B="${GITHUB_REF_NAME}"
          for i in 1 2 3; do git pull --rebase origin "$B" && git push origin "HEAD:$B" && break; sleep 5; done
