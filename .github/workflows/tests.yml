name: 测试

# 每次推送代码就跑一遍核心计算的测试：RSI、股价提醒解析、回测的入选日期修正、长线评分、推送格式、简报解析、柜号校验
on:
  push:
    branches: [main]
    paths: ["**.py", "cf/**", "tests/**", ".github/workflows/tests.yml"]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stocks/requirements.txt
      - run: pip install -r stocks/requirements.txt pytest
      - name: Python
        run: python -m pytest -q tests
      - name: Cloudflare worker
        run: node --test tests/worker.test.mjs
