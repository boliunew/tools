name: 圣何塞交通图

# 每月从 VTA、Caltrain 公开的 GTFS 里重画轻轨、火车、主要巴士线路，生成 sj/transit.json
on:
  schedule:
    - cron: "23 13 3 * *"   # 每月 3 号
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/build_sj_transit.py", ".github/workflows/sj-transit.yml"]

permissions:
  contents: write

concurrency:
  group: sj-transit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/build_sj_transit.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sj/transit.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "圣何塞交通图更新 $(date -u +%F)"
          B="${GITHUB_REF_NAME}"
          ok=0; for i in 1 2 3 4 5; do git pull --rebase origin "$B" && git push origin "HEAD:$B" && { ok=1; break; }; git rebase --abort 2>/dev/null || true; sleep $((i * 5)); done; [ "$ok" = 1 ] || { echo "::error::推送失败（重试 5 次）"; exit 1; }
