name: 通勤电台
on:
  schedule:
    - cron: "55 13 * * *"   # 6:55 am Pacific (daylight time)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["radio/build.py"]
permissions:
  contents: write
concurrency:
  group: radio
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r radio/requirements.txt
          sudo apt-get install -y ffmpeg >/dev/null 2>&1 || true
          ffmpeg -version | head -1
      - name: Build radio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python radio/build.py
      - name: Commit
        run: |
          git config user.name "radio-bot"
          git config user.email "radio-bot@users.noreply.github.com"
          git add radio/data/
          git diff --cached --quiet && exit 0
          git commit -m "radio: $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 5; done
