name: AI 研判（TradingAgents）

# Runs after 每日股票池扫描 finishes. Needs ONE repo secret (Settings → Secrets and
# variables → Actions): DEEPSEEK_API_KEY (cheapest) or OPENAI_API_KEY / ANTHROPIC_API_KEY /
# GOOGLE_API_KEY. Without a secret the job just records "not configured" and costs nothing.
# Optional repo variables: AGENTS_N (default 3), AGENTS_EXTRA (e.g. VOO,NVDA).

on:
  workflow_run:
    workflows: ["每日股票池扫描"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tickers:
        description: "只研判这些代码（空格分隔，留空 = 用股票池）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: stock-agents
  cancel-in-progress: false

jobs:
  agents:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      AGENTS_N: ${{ vars.AGENTS_N }}
      AGENTS_EXTRA: ${{ vars.AGENTS_EXTRA }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Any key configured?
        id: key
        run: |
          if [ -n "$DEEPSEEK_API_KEY$OPENAI_API_KEY$ANTHROPIC_API_KEY$GOOGLE_API_KEY" ]; then echo "has=1" >> "$GITHUB_OUTPUT"; else echo "has=0" >> "$GITHUB_OUTPUT"; echo "No LLM key secret — skipping (nothing to pay for)."; fi
      - uses: actions/setup-python@v5
        if: steps.key.outputs.has == '1'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stocks/requirements-agents.txt
      - if: steps.key.outputs.has == '1'
        run: pip install -r stocks/requirements-agents.txt
      - name: Run TradingAgents
        if: steps.key.outputs.has == '1'
        env:
          TICKERS: ${{ github.event.inputs.tickers }}
        run: |
          T="$(printf '%s' "$TICKERS" | tr -cd 'A-Za-z0-9.^ -')"
          python stocks/agents.py $T
      - name: Commit results
        if: steps.key.outputs.has == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks/data/agents.json stocks/data/history/agents-*.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "AI 研判 $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
