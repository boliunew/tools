name: 网络电视台单

# 每天从 iptv-org 拿全部免费公开的电视直播，逐个连一遍（美国机房），按国家写进 tv/data/。
on:
  schedule:
    - cron: "37 9 * * *"    # 每天凌晨 2:37（太平洋夏令时）
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tv/build.py", ".github/workflows/tv.yml"]
permissions:
  contents: write
concurrency:
  group: tv
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build TV list
        run: python tv/build.py
      - name: Commit
        run: |
          git config user.name "tv-bot"
          git config user.email "tv-bot@users.noreply.github.com"
          git add tv/data/
          git diff --cached --quiet && exit 0
          git commit -q -m "tv: $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && { ok=1; break; }; git rebase --abort 2>/dev/null || true; sleep $((i * 5)); done; [ "$ok" = 1 ] || { echo "::error::推送失败（重试 5 次）"; exit 1; }
