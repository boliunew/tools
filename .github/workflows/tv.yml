name: 网络电视台单

# 一天两次：从 iptv-org 拿全部免费公开的电视直播，逐个连一遍（美国机房），再下载能对上号的节目表。
# 台单写进 main 的 tv/data/；节目表（约 8MB，每次都全变）强推到 tv-data 分支，只保留最新一份，不增加主分支历史。
# 页面从 https://raw.githubusercontent.com/boliunew/tools/tv-data/epg/<国家>.json 读
on:
  schedule:
    - cron: "37 9 * * *"    # 太平洋凌晨 1:37（冬令时）/ 2:37（夏令时）
    - cron: "37 21 * * *"   # 太平洋下午 1:37 / 2:37：节目表只有 30 小时，一天更新两次
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tv/build.py", ".github/workflows/tv.yml"]
permissions:
  contents: write
concurrency:
  group: tv
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore last TV guide
        # 节目表这次全下载失败时，build.py 会保留上一次的，所以先从 tv-data 分支取回来
        run: |
          mkdir -p tv/data/epg
          if git fetch -q --depth=1 origin tv-data; then git archive FETCH_HEAD epg | tar -x -C tv/data; else echo "还没有 tv-data 分支"; fi
      - name: Build TV list
        run: python tv/build.py
      - name: Publish TV guide (tv-data branch, latest only)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -n "$(ls tv/data/epg 2>/dev/null)" ] || { echo "没有节目表，跳过"; exit 0; }
          rm -rf out && mkdir -p out && cp -r tv/data/epg out/epg
          cd out && git init -q -b tv-data && git add epg && \
            git -c user.name="tv-bot" -c user.email="tv-bot@users.noreply.github.com" commit -qm "节目表 $(date -u +%FT%TZ)" && \
            git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tv-data
      - name: Commit
        run: |
          git config user.name "tv-bot"
          git config user.email "tv-bot@users.noreply.github.com"
          git add tv/data/   # tv/data/epg/ 在 .gitignore 里，不进 main
          git diff --cached --quiet && exit 0
          git commit -q -m "tv: $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && { ok=1; break; }; git rebase --abort 2>/dev/null || true; sleep $((i * 5)); done; [ "$ok" = 1 ] || { echo "::error::推送失败（重试 5 次）"; exit 1; }
