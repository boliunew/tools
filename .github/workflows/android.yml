name: 安卓 App

# 把工具箱打包成 APK（android/，一个全屏打开网站的外壳，补上相机、麦克风、定位、下载），发到 Releases。
# 下载地址固定：https://github.com/boliunew/tools/releases/latest/download/tools.apk
# 网站内容更新不需要重新打包；只有改了 android/ 才会重新出一个版本。
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["android/**", "icons/icon-192.png", ".github/workflows/android.yml"]

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Firebase 配置
        id: fb
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning title=安卓 App::还没加 secret GOOGLE_SERVICES_JSON（Firebase 的 google-services.json），这次不打包"
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 -c "import json;d=json.load(open('android/app/google-services.json'));pk=[c['client_info']['android_client_info']['package_name'] for c in d['client']];print('packages',pk);assert 'io.github.boliunew.tools' in pk, 'google-services.json 里没有 io.github.boliunew.tools'"
      - uses: actions/setup-java@v5
        if: steps.fb.outputs.skip != '1'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        if: steps.fb.outputs.skip != '1'
        with:
          gradle-version: "8.7"
      - name: App icon
        if: steps.fb.outputs.skip != '1'
        run: |
          pip install -q pillow
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=android/app/src/main/res/mipmap-${d%%:*}; mkdir -p "$dir"
            python3 - "$dir/ic_launcher.png" "${d##*:}" <<'PY'
          import sys
          from PIL import Image
          Image.open("icons/icon-192.png").convert("RGBA").resize((int(sys.argv[2]),) * 2, Image.LANCZOS).save(sys.argv[1])
          PY
          done
      - name: Build APK
        if: steps.fb.outputs.skip != '1'
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log || {
            grep -E "error:|What went wrong|FAILURE|Could not|> " /tmp/build.log | head -40 | while IFS= read -r l; do echo "::error title=打包失败::$l"; done
            exit 1; }
          cp android/app/build/outputs/apk/release/app-release.apk tools.apk
          ls -la tools.apk
          echo "::notice title=安卓 App::打包成功，$(du -h tools.apk | cut -f1)"
      - name: Release
        if: steps.fb.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="android-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" tools.apk --title "工具箱 App 1.${GITHUB_RUN_NUMBER}" --latest \
            --notes "手机下载安装：https://github.com/boliunew/tools/releases/latest/download/tools.apk （第一次安装要允许「安装未知应用」）"
          echo "::notice title=安卓 App::已发布 $tag ｜ 下载：https://github.com/boliunew/tools/releases/latest/download/tools.apk"
