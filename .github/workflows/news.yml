name: 英文新闻精选

on:
  schedule:
    - cron: "7 13 * * *"   # 每天 6:07 太平洋夏令时
    - cron: "7 1 * * *"    # 每天 18:07 太平洋夏令时
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["news/build.py", "news/feeds.json", "news/contexts.py", "news/articles.py"]

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: news/requirements.txt
      - run: pip install -r news/requirements.txt
      - run: python news/build.py
      - run: python news/contexts.py
      - run: python news/articles.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "新闻更新 $(date -u +%F-%H%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
