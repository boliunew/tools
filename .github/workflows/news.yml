name: 英文新闻精选

on:
  schedule:
    - cron: "7 13 * * *"   # 每天 6:07 太平洋夏令时
    - cron: "7 1 * * *"    # 每天 18:07 太平洋夏令时
    - cron: "37 */2 * * *" # 每两小时只更新「今日大事」（GitHub 定时常晚几个小时，多排几次才跟得上）
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["news/build.py", "news/feeds.json", "news/contexts.py", "news/articles.py", "news/today.py"]

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: news/requirements.txt
      - run: pip install -r news/requirements.txt
      - if: github.event.schedule != '37 */2 * * *'
        run: python news/build.py
      - if: github.event.schedule != '37 */2 * * *'
        run: python news/contexts.py
      - if: github.event.schedule != '37 */2 * * *'
        run: python news/articles.py
      - run: python news/today.py   # 今日大事 · 趣闻 · 历史上的今天
      - if: github.event.schedule != '37 */2 * * *'
        run: python card/today.py   # 每日一句 for home-screen widgets
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/data card/today.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "新闻更新 $(date -u +%F-%H%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
