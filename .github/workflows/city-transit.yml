name: 纽约 · 洛杉矶交通图

# 每月从 MTA、LA Metro、Metrolink 公开的 GTFS 重画线路和车站，生成 ny/transit.json、la/transit.json
on:
  schedule:
    - cron: "29 13 4 * *"   # 每月 4 号
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/build_city_transit.py", ".github/workflows/city-transit.yml"]

permissions:
  contents: write

concurrency:
  group: city-transit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_city_transit.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ny/transit.json la/transit.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "纽约 · 洛杉矶交通图更新 $(date -u +%F)"
          B="${GITHUB_REF_NAME}"
          for i in 1 2 3; do git pull --rebase origin "$B" && git push origin "HEAD:$B" && break; sleep 5; done
