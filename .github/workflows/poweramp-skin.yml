name: Poweramp 湖光皮肤

# 把 poweramp-skin/ 编译成 Poweramp v3 皮肤 APK，发到固定的 Release「lakeside-skin」。
# 下载地址固定：https://github.com/boliunew/tools/releases/download/lakeside-skin/Lakeside-Poweramp-Skin.apk
# 只有改了 poweramp-skin/ 才会重新编译。不设成 latest，免得抢了工具箱 App 的下载地址。
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["poweramp-skin/**", ".github/workflows/poweramp-skin.yml"]

permissions:
  contents: write

concurrency:
  group: poweramp-skin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: 底图（backgrounds/ 里的照片 → 各尺寸 + 皮肤选项）
        working-directory: poweramp-skin
        run: |
          pip install -q pillow
          python3 tools/gen_backgrounds.py
      - name: 字体 霞鹜文楷（SIL OFL 1.1）
        working-directory: poweramp-skin
        run: |
          f=lakeside_skin/src/main/res/font/lxgw_wenkai_regular.ttf
          for u in \
            https://github.com/lxgw/LxgwWenKai/releases/latest/download/LXGWWenKai-Regular.ttf \
            https://mirrors.ctan.org/fonts/lxgw-fonts/LXGWWenKaiGBLite-Regular.ttf ; do
            curl -fsSL --retry 3 -o "$f" "$u" && [ "$(stat -c%s "$f")" -gt 1000000 ] && { echo "字体来自 $u（$(du -h "$f" | cut -f1)）"; break; }
            rm -f "$f"
          done
          [ -f "$f" ] || { echo "::error title=字体下载失败::霞鹜文楷没下载到"; exit 1; }
          mkdir -p lakeside_skin/src/main/assets/licenses
          curl -fsSL -o lakeside_skin/src/main/assets/licenses/LXGW-WenKai-OFL.txt https://raw.githubusercontent.com/lxgw/LxgwWenKai/main/OFL.txt \
            || echo "LXGW WenKai is licensed under the SIL Open Font License 1.1 - https://github.com/lxgw/LxgwWenKai" > lakeside_skin/src/main/assets/licenses/LXGW-WenKai-OFL.txt
      - name: Build APK
        working-directory: poweramp-skin
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :lakeside_skin:assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log || {
            grep -E "error:|ERROR:|What went wrong|FAILURE|Could not|> " /tmp/build.log | head -40 | while IFS= read -r l; do echo "::error title=皮肤打包失败::$l"; done
            exit 1; }
          cp lakeside_skin/build/outputs/apk/release/*.apk ../Lakeside-Poweramp-Skin.apk
          ls -la ../Lakeside-Poweramp-Skin.apk
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="lakeside-skin"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Lakeside-Poweramp-Skin.apk --clobber
            gh release edit "$tag" --title "🏞️ 湖光 Lakeside 皮肤（第 ${GITHUB_RUN_NUMBER} 版）" --latest=false
          else
            gh release create "$tag" Lakeside-Poweramp-Skin.apk --latest=false \
              --title "🏞️ 湖光 Lakeside 皮肤（第 ${GITHUB_RUN_NUMBER} 版）" \
              --notes "Poweramp v3 皮肤，自己拍的湖景做底图。手机下载安装：https://github.com/boliunew/tools/releases/download/lakeside-skin/Lakeside-Poweramp-Skin.apk"
          fi
          echo "::notice title=湖光皮肤::已发布 ｜ 下载：https://github.com/boliunew/tools/releases/download/lakeside-skin/Lakeside-Poweramp-Skin.apk"
