name: Amtrak 时刻表

# 每周从 Amtrak 官方 GTFS 重新生成 amtrak/data.json（加州和西部几条线的时刻表、走向）
on:
  schedule:
    - cron: "17 13 * * 2"   # 每周二
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/build_amtrak.py", ".github/workflows/amtrak.yml"]

permissions:
  contents: write

concurrency:
  group: amtrak
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/build_amtrak.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amtrak/data.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Amtrak 时刻表更新 $(date -u +%F)"
          B="${GITHUB_REF_NAME}"
          ok=0; for i in 1 2 3 4 5; do git pull --rebase origin "$B" && git push origin "HEAD:$B" && { ok=1; break; }; git rebase --abort 2>/dev/null || true; sleep $((i * 5)); done; [ "$ok" = 1 ] || { echo "::error::推送失败（重试 5 次）"; exit 1; }
