name: 每日股票池扫描

on:
  schedule:
    # 周一到周五 21:47 UTC（美股收盘后约 1.5 小时，夏令时；冬令时为收盘后 45 分钟）
    - cron: "47 21 * * 1-5"
    # 晚上 9:17 美东再跑一次：Yahoo 偶尔收盘后很久才更新
    - cron: "17 1 * * 2-6"
    # 次日早上再跑一次（太平洋时间 6:47），补上前一晚 Yahoo 延迟发布的数据
    - cron: "47 13 * * 2-6"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["stocks/scan.py", "stocks/alerts.py"]

permissions:
  contents: write
  issues: write     # 股价提醒：触发时在 issue 下留言

concurrency:
  group: stock-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stocks/requirements.txt
      - run: pip install -r stocks/requirements.txt
      - name: Scan
        run: python stocks/scan.py
      - name: Price alerts
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: python stocks/alerts.py check
      - name: Summary (test branches)
        if: github.ref != 'refs/heads/main'
        run: |
          python - <<'PY'
          import json
          d = json.load(open("stocks/data/latest.json"))
          out = [f"date {d['date']} regime {d['regime']['label']} stats_meta {d.get('stats_meta')} diag {d.get('diag')}"]
          for k, v in d["signals"].items():
              s = v["stats"]
              out.append(f"{k}: n={s['n']} blocks={s.get('blocks')} edge={s.get('edge')} ci=[{s.get('ci_lo')},{s.get('ci_hi')}] {s['verdict']} | "
                         + " ".join(f"{rg}:{r.get('edge')}/{r.get('blocks')}/{r['verdict']}" for rg, r in s["by_regime"].items()) + f" | now={v.get('now')}")
          c = d["candidates"]
          out.append(f"candidates {len(c)} picks {sum(1 for x in c if x.get('tier') == 'pick')}")
          for x in c[:14]:
              out.append(f"  {x['t']} {x['tier']} {x['primary']} exp={x.get('exp')} {x.get('exp_src')} earn={x.get('earn')} {x['sector']} why={x.get('why')}")
          T = d["tracking"]
          out.append(f"tracking since {T.get('since')} summary {T['summary']} tiers {T.get('by_tier')}")
          out.append(f"by_sig {T.get('by_sig')}")
          msg = "\n".join(out)
          for i in range(0, len(msg), 3500):
              print("::notice title=summary" + str(i // 3500) + "::" + msg[i:i + 3500].replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
      - name: Commit results
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks/data stocks/universe.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "股票池更新 $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
