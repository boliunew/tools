<style>

body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.45}

.top h1{font-size:21px;margin:0;flex:1}

.upd{font-size:12.5px;color:var(--faint);margin-bottom:10px}

.groups{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 8px;padding:0 16px 2px}

.schips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 8px;padding:0 16px 2px}

.stp{margin:2px 0 10px}

.stp .row2::-webkit-scrollbar{display:none}
.stp .sc{flex:0 0 auto;width:118px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 9px;text-align:left}
.stp .sc .e{font-size:13px;font-weight:600}

.pick{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.pick h3{margin:0;padding:9px 12px;font-size:14.5px;background:var(--chip)}
.pick .pr2{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}
.pick .pr2 i{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.pick .pr2 .t{flex:1;min-width:0}
.pick .pr2 .t small{display:block;color:var(--faint);font-size:12px}
.pick .pr2 button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:5px 10px;font-size:13px;white-space:nowrap}
.pick .pr2 button.on{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.tg.up{background:#E7EEFF;color:#3355AA}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;opacity:0;transition:all .25s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

    h += '<button class="star' + (on ? ' on' : '') + '" data-id="' + esc(x.id) + '" aria-label="加入清单">' + (on ? '★' : '☆') + '</button></div>';
    h += '<div class="bd"><div class="pr">' + priceHTML(x) + '</div>' + (tags ? '<div class="tags">' + tags + '</div>' : '') + '<div class="nm">' + esc(x.n) + '</div>';
    if (x.zh) h += '<div class="zh">' + esc(x.zh) + '</div>';
    h += '<div class="mt"><span class="sb" style="color:' + st.color + '">' + esc(st.name) + '</span>';
    if (x.src === 'flyer' && x.to) h += '· 到 ' + md(x.to);
    else if (x.via) h += '· ' + esc(x.via) + (x.score ? ' 👍' + x.score : '');
    h += '</div></div></a>';
    return h;
  }

  /* ---------- store manager ---------- */
  function renderPick() {
    var h = '<div class="cmp" style="background:var(--chip)">点「📌」把常去的店加进<b>我的店</b>，首页就只显示它们的特价。拖不动？顺序就是加入的先后。</div>', g, i, k;
    for (g = 0; g < GRP.length; g++) {
      var ids = [];
      for (k in ST) if (ST.hasOwnProperty(k) && (ST[k].grp || []).indexOf(GRP[g].k) >= 0 && (ST[k].grp[0] === GRP[g].k)) ids.push(k);
      if (!ids.length) continue;
      ids.sort(function (a, b) { return (ST[b].n || 0) - (ST[a].n || 0); });
      h += '<div class="pick"><h3>' + GRP[g].e + ' ' + GRP[g].zh + '</h3>';
      for (i = 0; i < ids.length; i++) {
        var st = ST[ids[i]], f = st.flyers || [], d = f.length ? md(f[0].from) + '–' + md(f[f.length - 1].to) : '';
        h += '<div class="pr2"><i style="background:' + st.color + '"></i><div class="t">' + esc(st.name) + '<small>' + (st.n || 0) + ' 件' + (d ? ' · ' + d : '') + (f.length > 1 ? ' · ' + f.length + ' 份广告' : '') + '</small></div><button data-go="' + ids[i] + '">看看</button><button data-pin="' + ids[i] + '" class="' + (inMine(ids[i]) ? 'on' : '') + '">' + (inMine(ids[i]) ? '✓ 我的店' : '📌 加入') + '</button></div>';
      }
      h += '</div>';
    }
    $('body').innerHTML = h;
  }
  function togglePin(id) {
    var i = MINE.indexOf(id);
    if (i >= 0) { MINE.splice(i, 1); toast('已从我的店移除'); } else { MINE.push(id); toast('已加入我的店 ⭐'); }
    put('mine', MINE);
  }

  /* ---------- shopping list ---------- */
  function pruneList() {
    var t = todayPT(), k, n = 0;
    for (k in LIST) if (LIST.hasOwnProperty(k) && LIST[k].to && LIST[k].to < t && LIST[k].saved && (Date.now() - LIST[k].saved) > 14 * 864e5) { delete LIST[k]; n++; }
    if (n) put('list', LIST);
  }
  function toggleList(id) {
    var x = null, i;
    for (i = 0; i < ITEMS.length; i++) if (ITEMS[i].id === id) { x = ITEMS[i]; break; }
    if (LIST[id]) { delete LIST[id]; toast('已从清单移除'); }
    else if (x) { LIST[id] = { id: id, s: x.s, n: x.n, pt: (x.pq ? '约' : '') + (x.pt || (x.p != null ? '$' + x.p : '')), e: x._e, img: x.img, u: x.u, to: x.to || '', stz: x.stz || '', zh: x.zh || '', saved: Date.now() }; toast('已加入购物清单 🛒'); }
    put('list', LIST);
  }
  function renderList() {
    var by = {}, order = [], k, t = todayPT(), h = '', n = 0, tot = 0;
    for (k in LIST) if (LIST.hasOwnProperty(k)) { var e = LIST[k]; if (!by[e.s]) { by[e.s] = []; order.push(e.s); } by[e.s].push(e); n++; if (e.e != null && !(e.to && e.to < t)) tot += e.e; }
    if (!n) { $('body').innerHTML = '<div class="msg">清单是空的。<br>在商品图片右上角点 ☆，就能加进购物清单，去哪家店买一目了然。</div>'; return; }
    order.sort(function (a, b) { return (inMine(b) ? 1 : 0) - (inMine(a) ? 1 : 0); });
    h += '<div class="acts"><button class="pri" id="copyL">📋 复制清单</button><button id="clearOld">🧹 清掉过期的</button><button id="clearAll">清空</button></div>';
    for (var o = 0; o < order.length; o++) {
      var L = by[order[o]], st = storeOf(order[o]), sum = 0, j;
      for (j = 0; j < L.length; j++) if (L[j].e != null) sum += L[j].e;
      h += '<div class="list"><h3><span style="color:' + st.color + '">' + esc(st.name) + '</span><span>' + L.length + ' 件 · 约 $' + sum.toFixed(2) + '</span></h3>';
      for (j = 0; j < L.length; j++) {
        var x = L[j], old = x.to && x.to < t;
        h += '<div class="row' + (old ? ' old' : '') + '">' + (x.img && !LITE ? '<img loading="lazy" referrerpolicy="no-referrer" src="' + esc(x.img) + '" alt="">' : '') + '<a class="t" href="' + esc(x.u || '#') + '" target="_blank" rel="noopener"><div>' + esc(x.n) + '</div><small>' + esc([x.zh, x.stz, old ? '已过期' : (x.to ? '到 ' + md(x.to) : '')].filter(function (z) { return z; }).join(' · ')) + '</small></a><span class="p">' + esc(x.pt) + '</span><button class="rm" data-id="' + esc(x.id) + '" aria-label="移除">×</button></div>';
      }
      h += '</div>';
    }
    h += '<div class="foot" style="margin-top:6px">合计约 $' + tot.toFixed(2) + '（按单件价估算，不含税）</div>';
    $('body').innerHTML = h;
    $('copyL').onclick = function () {
      var lines = ['🛒 购物清单 ' + md(t)], o2, j2;
      for (o2 = 0; o2 < order.length; o2++) { var L2 = by[order[o2]]; lines.push(''); lines.push('【' + sname(order[o2]) + '】'); for (j2 = 0; j2 < L2.length; j2++) lines.push('□ ' + L2[j2].n + (L2[j2].zh ? '（' + L2[j2].zh + '）' : '') + '  ' + L2[j2].pt + (L2[j2].stz ? '  ' + L2[j2].stz : '')); }
      copy(lines.join('\n'));
    };
    $('clearOld').onclick = function () { var c = 0; for (var k2 in LIST) if (LIST.hasOwnProperty(k2) && LIST[k2].to && LIST[k2].to < t) { delete LIST[k2]; c++; } put('list', LIST); toast(c ? '清掉 ' + c + ' 件过期的' : '没有过期的'); render(); };
    $('clearAll').onclick = function () { if (this.getAttribute('data-sure')) { LIST = {}; put('list', LIST); render(); } else { this.setAttribute('data-sure', '1'); this.textContent = '再点一次确认清空'; } };
  }
  function copy(text) {
    var ok = function () { toast('已复制，可以粘贴到微信了'); };
    var fallback = function () { var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('复制失败，请长按选择'); } document.body.removeChild(ta); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
  }

  /* ---------- events ---------- */
  function closest(e, sel) { return e.target.closest ? e.target.closest(sel) : null; }
  function reset() { cat = 'all'; shown = 60; }
  $('groups').onclick = function (e) { var b = closest(e, 'button'); if (!b) return; grp = b.getAttribute('data-g'); put('grp', grp); reset(); render(); window.scrollTo(0, 0); };
  $('schips').onclick = function (e) {
    var b = closest(e, 'button'); if (!b) return;
    var s = b.getAttribute('data-s');
    if (s === '__pick') { grp = 'pick'; reset(); render(); window.scrollTo(0, 0); return; }
    SEL[grp] = s; put('sel', SEL); reset(); render();
  };
  $('shead').onclick = function (e) {
    var b = closest(e, 'button'); if (!b) return;
    if (b.id === 'pinBtn') { togglePin(selOf(grp)); render(); }
    if (b.id === 'mineOnly') { mineOnly = !mineOnly; shown = 60; render(); }
  };
  $('subs').onclick = function (e) { var b = closest(e, 'button'); if (!b) return; sub[selOf(grp)] = b.getAttribute('data-sub'); put('sub', sub); reset(); render(); };
  $('stp').onclick = function (e) { var b = closest(e, '.sc'); if (!b) return; $('q').value = b.getAttribute('data-q'); $('qx').style.display = 'block'; q = $('q').value.toLowerCase(); reset(); render(); window.scrollTo(0, 0); };
  $('chips').onclick = function (e) { var b = closest(e, 'button'); if (!b) return; cat = b.getAttribute('data-c'); shown = 60; render(); };
  $('sorts').onclick = function (e) { var b = closest(e, 'button'); if (!b || !b.getAttribute('data-o')) return; sort = b.getAttribute('data-o'); put('sort', sort); shown = 60; render(); };
  $('body').onclick = function (e) {
    var wb = closest(e, '[data-wsel],[data-wdel],[data-wpush]');
    if (wb) {
      if (wb.getAttribute('data-wsel') != null) { var k = +wb.getAttribute('data-wsel'); WSEL = WSEL === k ? -1 : k; shown = 60; render(); }
      else if (wb.getAttribute('data-wdel') != null) { var d = +wb.getAttribute('data-wdel'); toast('已取消关注「' + wlabel(WATCH[d]) + '」'); WATCH.splice(d, 1); WSEL = -1; saveWatch(); render(); }
      else {
        var w2 = WATCH[+wb.getAttribute('data-wpush')], x2 = new XMLHttpRequest();
        x2.open('POST', 'api/issues'); x2.setRequestHeader('Content-Type', 'application/json');
        x2.onload = function () { toast(x2.status === 201 ? '好了：有新特价会推送到手机（ntfy）' : '没设成功，稍后再试'); };
        x2.send(JSON.stringify({ title: '打折关注: ' + wlabel(w2), body: '' }));
      }
      return;
    }
    var p = closest(e, '[data-pin],[data-go]');
    if (p) {
      if (p.getAttribute('data-pin')) { togglePin(p.getAttribute('data-pin')); render(); }
      else { var id = p.getAttribute('data-go'), g = (storeOf(id).grp || ['general'])[0]; grp = g; SEL[g] = id; put('grp', grp); put('sel', SEL); reset(); render(); window.scrollTo(0, 0); }
      return;
    }
    var b = closest(e, '.star,.rm'); if (!b) return;
    e.preventDefault(); e.stopPropagation();
    toggleList(b.getAttribute('data-id'));
    if (grp === 'list') render();
    else { var on = !!LIST[b.getAttribute('data-id')]; b.className = 'star' + (on ? ' on' : ''); b.textContent = on ? '★' : '☆'; renderGroups(); }
  };
  var qt = null;
  $('q').oninput = function () {
    var v = this.value; $('qx').style.display = v ? 'block' : 'none';
    clearTimeout(qt); qt = setTimeout(function () { q = v.toLowerCase().replace(/^\s+|\s+$/g, ''); if (q && (grp === 'list' || grp === 'pick')) grp = 'mine'; reset(); render(); }, 220);
  };
  $('qx').onclick = function () { $('q').value = ''; $('qx').style.display = 'none'; q = ''; mineOnly = false; reset(); render(); };
  if (grp === 'pick') grp = 'mine';
  liteBtn();
  $('lite').onclick = function () { LITE = !LITE; put('lite', LITE); liteBtn(); toast(LITE ? '省流量：不加载商品图片，打开一次约 260 KB' : '已显示商品图片'); if (META) render(); };

  load();
})();
</script>
