<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F7F1EA">
<title>西班牙语练习 · Español</title>
<style>
:root{
  --bg:#F7F1EA; --paper:#FFFFFF; --ink:#1B1E23; --soft:#5F6B76; --faint:#98A2AC; --line:#DCE3EA; --chip:#E6ECF1;
  --accent:#C0392B; --accent-ink:#FFFFFF; --accent-soft:#F8E1DB; --good:#2E7D32; --good-soft:#DDF1E1; --bad:#C8412B; --bad-soft:#F8E1DB;
  --l1:#A9C2DA; --l3:#E39A8C; --outline:#E3E8EE; --stroke:#1B1E23; --draw:#C0392B; --hint:#F2A33A;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15181C; --paper:#1F2328; --ink:#ECEEF0; --soft:#A7B0B9; --faint:#6F7881; --line:#30363D; --chip:#282D33;
    --accent:#FF8A73; --accent-ink:#1A0E0B; --accent-soft:#3A2420; --good:#6FD07A; --good-soft:#1D3321; --bad:#FF7F66; --bad-soft:#3A2420;
    --l1:#3C4F63; --l3:#7A3E34; --outline:#343A42; --stroke:#ECEEF0; --draw:#FF8A73; --hint:#F2B35E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{position:-webkit-sticky;position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;min-height:56px}
.brand{font-weight:700;font-size:19px;margin-right:auto;display:flex;align-items:center;cursor:pointer}
.brand i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:30px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);margin-right:8px;font-size:13px;font-weight:800;letter-spacing:-.02em}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:12px;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--soft)}
.btn:disabled{opacity:.4}
main{padding:14px 0 60px}
.view{display:none}.view.on{display:block}
.free{padding:14px 16px;margin-bottom:6px}
.free h3{margin:0 0 8px;font-size:15px}
.frow{display:flex}
.frow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;margin-right:8px;font-size:17px}
.frow input:focus{outline:2px solid var(--accent);border-color:transparent}
h2.sec{font-size:13px;letter-spacing:.06em;color:var(--faint);margin:20px 0 10px;font-weight:600;display:flex;justify-content:space-between}
.lessons{display:flex;flex-wrap:wrap;margin:0 -5px}
.lesson{width:calc(50% - 10px);margin:0 5px 10px;padding:12px 14px;cursor:pointer;text-align:left}
.lesson:hover{border-color:var(--accent)}
.l-n{font-size:12px;color:var(--faint)}
.l-t{font-weight:700;font-size:16px}
.l-c{font-size:15px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 6px}
.pbar{height:5px;background:var(--chip);border-radius:5px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--good);border-radius:5px}
.sbar{display:flex;align-items:center;margin-bottom:10px}
.sbar .ti{flex:1;text-align:center;font-weight:600}
.sbar .ti small{display:block;font-weight:400;color:var(--faint);font-size:12px}
.stage{padding:18px 12px 16px;text-align:center}
.board{display:inline-block;touch-action:none;-webkit-user-select:none;user-select:none;max-width:100%;cursor:crosshair}
.board svg{display:block}
.ipa{font-size:20px;color:var(--accent);margin-top:6px;font-family:"Lucida Sans Unicode","Arial Unicode MS","Segoe UI",sans-serif}
.zh{font-size:18px;margin-top:2px}
.pair{font-size:15px;color:var(--soft);margin-top:4px}
.ex{display:inline-block;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 14px;margin-top:10px;cursor:pointer}
.ex b{font-size:18px}
.ex span{color:var(--soft);font-size:13.5px;margin-left:6px}
.info{font-size:13px;color:var(--faint);margin-top:6px;min-height:20px}
.fb{font-size:15px;font-weight:600;min-height:24px;margin-top:4px}
.fb.ok{color:var(--good)} .fb.bad{color:var(--bad)}
.tools{display:flex;flex-wrap:wrap;justify-content:center;margin-top:10px}
.tools .btn{margin:0 4px 8px;min-width:92px}
.nav{display:flex;align-items:center;margin-top:12px}
.nav .btn{flex:1}
.nav .btn.mid{flex:1.4;margin:0 8px}
.dots{display:flex;justify-content:center;flex-wrap:wrap;margin-top:12px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);margin:0 3px 4px}
.dots i.l{background:var(--good)} .dots i.c{background:var(--accent);transform:scale(1.3)}
.qcard{padding:22px 16px;text-align:center}
.qp{font-size:14px;color:var(--soft)}
.qq{font-size:30px;font-weight:700;margin:10px 0 16px;min-height:44px}
.opts{display:flex;flex-wrap:wrap;margin:0 -5px}
.opt{width:calc(50% - 10px);margin:0 5px 10px;min-height:70px;font-size:24px;font-weight:600;border-radius:14px}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.slots{display:flex;justify-content:center;flex-wrap:wrap;margin:6px 0 14px;min-height:52px}
.slot{width:40px;height:48px;border-bottom:3px solid var(--line);margin:0 3px;font-size:28px;font-weight:700;line-height:46px;cursor:pointer}
.slot.f{border-color:var(--accent)}
.slots.ok .slot{color:var(--good);border-color:var(--good)}
.slots.no .slot{color:var(--bad);border-color:var(--bad)}
.tiles{display:flex;justify-content:center;flex-wrap:wrap}
.tile{width:48px;height:52px;margin:0 4px 8px;font-size:24px;font-weight:700;border-radius:12px;padding:0}
.tile.used{visibility:hidden}
.score{font-size:48px;font-weight:700;color:var(--accent)}
.hint{font-size:12.5px;color:var(--faint);text-align:center;margin-top:14px;line-height:1.7}
@media (max-width:420px){ .lesson{width:calc(100% - 10px)} .tools .btn{min-width:0;flex:1 1 40%} }
.g-m{color:#2466B8}.g-f{color:#C2185B}
@media (prefers-color-scheme: dark){.g-m{color:#7FB2FF}.g-f{color:#F48FB1}}
.art{font-size:22px;font-weight:700;margin-right:6px}
.syl{font-size:21px;margin-top:8px;letter-spacing:.02em}
.syl b{color:var(--accent);text-decoration:underline;text-underline-offset:4px}
.gtag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--chip);margin-left:6px;vertical-align:middle}
.note{font-size:13px;color:var(--soft);background:var(--bg);border-radius:10px;padding:6px 10px;margin:8px auto 0;max-width:420px}
.tip{font-size:14px;color:var(--soft);margin-top:8px;max-width:440px;margin-left:auto;margin-right:auto}
</style>
</head>

<header class="top"><div class="wrap"><div class="bar">

    var k = LEARNED[key(it)];
    h += '<div class="nav"><button class="btn" id="bPrev"' + (idx === 0 ? ' disabled' : '') + '>‹ 上一个</button><button class="btn mid ' + (k ? 'good' : '') + '" id="bKnow">' + (k ? '✓ 已学会' : '✓ 学会了') + '</button><button class="btn primary" id="bNext"' + (idx === lesson.items.length - 1 ? ' disabled' : '') + '>下一个 ›</button></div>';
    h += '<div class="dots">'; for (i = 0; i < lesson.items.length; i++) h += '<i class="' + (i === idx ? 'c' : LEARNED[key(lesson.items[i])] ? 'l' : '') + '"></i>'; h += '</div>';
    h += '<div class="hint">加粗带下划线的是重读音节；重音符号和 ñ 上的波浪线最后写</div></div>';
    $('vStudy').innerHTML = h;
    var avail = document.querySelector('main').clientWidth - 60;
    board = Board($('board'), it.letter ? it.w : it.noun, it.letter ? 210 : 160, Math.min(avail, 640));
    $('info').textContent = it.letter ? '共 ' + board.strokes.length + ' 笔' : '共 ' + board.letters + ' 个字母 · ' + board.strokes.length + ' 笔';
    $('backBtn').onclick = showHome;
    $('quizBtn').onclick = function () { startQuiz(lesson); };
    $('bSay').onclick = function () { sayItem(it); };
    if ($('exBtn')) $('exBtn').onclick = function () { say(it.ex.w); };
    $('bAnim').onclick = function () { flash('', ''); board.animate(); };
    $('bTrace').onclick = function () { practice(true); };
    $('bRecall').onclick = function () { practice(false); };
    $('bPrev').onclick = function () { if (idx > 0) { idx--; renderStudy(); } };
    $('bNext').onclick = function () { if (idx < lesson.items.length - 1) { idx++; renderStudy(); } };
    $('bKnow').onclick = function () { var kk = key(it); if (LEARNED[kk]) delete LEARNED[kk]; else LEARNED[kk] = 1; put('learned', LEARNED); if (LEARNED[kk] && idx < lesson.items.length - 1) idx++; renderStudy(); };
    setTimeout(function () { sayItem(it); }, 250);
  }
  function practice(outline) {
    flash(outline ? '照着浅色笔画写第 1 笔' : '凭记忆写，从第 1 笔开始', '');
    board.trace(outline, {
      mistake: function () { flash('这一笔不对，注意起笔位置和方向', 'bad'); },
      correct: function (k, n) { if (k < n) flash('✓ 第 ' + k + ' 笔，继续写第 ' + (k + 1) + ' 笔', 'ok'); },
      complete: function (m) { flash(m === 0 ? '¡Muy bien! 全部写对了 👍' : '写完了！错了 ' + m + ' 次，再练练', m === 0 ? 'ok' : 'bad'); board.outline(true); }
    });
  }

  /* ================= quiz ================= */
  var STRIP = { 'á': 'a', 'é': 'e', 'í': 'i', 'ó': 'o', 'ú': 'u', 'ñ': 'n', 'ü': 'u' };
  function startQuiz(l) {
    if (board) board.cancel();
    var pool = shuffle(l.items.slice()), qs = [], i, all = [];
    for (i = 0; i < LESSONS.length; i++) if (LESSONS[i].kind === l.kind) all = all.concat(LESSONS[i].items);
    if (l.id === 'free') all = l.items.slice();
    for (i = 0; i < Math.min(10, pool.length); i++) {
      var ans = pool[i], types = ['listen'];
      if (l.kind === 'words') {
        if (ans.zh) types.push('meaning');
        if (ans.noun.indexOf(' ') < 0 && ans.noun.length > 1) types.push('spell');
        if (ans.art) types.push('gender', 'gender');
      }
      var type = types[Math.floor(Math.random() * types.length)], q = { ans: ans, type: type };
      if (type === 'listen' || type === 'meaning') {
        var opts = [ans], guard = 0, src = l.items.length >= 4 ? l.items : all;
        while (opts.length < 4 && guard++ < 200) { var c = src[Math.floor(Math.random() * src.length)]; if (opts.indexOf(c) < 0 && c.noun !== ans.noun) opts.push(c); }
        q.opts = shuffle(opts);
      } else if (type === 'gender') {
        q.opts = /s$/.test(ans.art) ? ['los', 'las'] : ['el', 'la'];
      } else {
        var letters = ans.noun.split(''), extra = 'abcdefghijlmnopqrstuvz', acc = '';
        for (var z = 0; z < letters.length; z++) if (STRIP[letters[z]]) acc = STRIP[letters[z]];
        letters.push(acc || extra.charAt(Math.floor(Math.random() * extra.length)));
        letters.push(extra.charAt(Math.floor(Math.random() * extra.length)));
        q.tiles = shuffle(letters); q.target = ans.noun; q.typed = [];
      }
      qs.push(q);
    }
    quiz = { l: l, qs: qs, i: 0, score: 0, lock: false };
    show('vQuiz'); renderQ();
  }
  function renderQ() {
    var q = quiz.qs[quiz.i], a = q.ans, h = '<div class="sbar"><button class="btn ghost" id="qBack">‹ 返回</button><div class="ti">第 ' + (quiz.i + 1) + ' / ' + quiz.qs.length + ' 题</div><span style="width:70px"></span></div><div class="card qcard">';
    var P = { listen: '听一听，选出正确的' + (quiz.l.kind === 'letters' ? '字母' : '单词'), meaning: '选出对应的西语单词', spell: '听一听，拼出这个单词', gender: '选出正确的冠词（阳性 / 阴性）' };
    h += '<div class="qp">' + P[q.type] + '</div>';
    if (q.type === 'listen') h += '<div class="qq"><button class="btn primary" id="qSay" style="font-size:22px;padding:10px 26px">🔊</button></div>';
    else if (q.type === 'meaning') h += '<div class="qq">' + esc(a.zh) + '</div>';
    else if (q.type === 'gender') h += '<div class="qq">___ ' + esc(a.noun) + '<div style="font-size:15px;font-weight:400;color:var(--soft)">' + esc(a.zh) + '</div></div>';
    else h += '<div class="qq" style="font-size:22px">' + esc(a.zh) + ' <button class="btn primary" id="qSay">🔊</button></div>';
    if (q.type === 'spell') {
      h += '<div class="slots" id="slots">'; for (var s = 0; s < q.target.length; s++) h += '<div class="slot"></div>'; h += '</div><div class="tiles">';
      for (s = 0; s < q.tiles.length; s++) h += '<button class="btn tile" data-t="' + s + '">' + q.tiles[s] + '</button>';
      h += '</div><div style="margin-top:6px"><button class="btn ghost" id="qBackspace">⌫ 删除</button></div>';
    } else {
      h += '<div class="opts">';
      for (var i = 0; i < q.opts.length; i++) { var lab = q.type === 'gender' ? q.opts[i] : (quiz.l.kind === 'letters' ? q.opts[i].w : q.opts[i].w); h += '<button class="btn opt" style="font-size:' + (q.type === 'gender' ? 26 : 19) + 'px" data-i="' + i + '">' + esc(lab) + '</button>'; }
      h += '</div>';
    }
    h += '<div class="fb" id="fb"></div><div class="hint" id="tip"></div></div>';
    $('vQuiz').innerHTML = h;
    $('qBack').onclick = function () { openLesson(quiz.l, quiz.l.li); };
    if ($('qSay')) { $('qSay').onclick = function () { sayItem(a); }; setTimeout(function () { sayItem(a); }, 200); }
    function finish(ok) {
      if (ok) quiz.score++;
      $('fb').innerHTML = esc(a.letter ? a.w + '（' + a.name + '）' : a.w) + (a.zh ? ' · ' + esc(a.zh) : '');
      $('fb').className = 'fb ' + (ok ? 'ok' : 'bad');
      if (q.type === 'gender') $('tip').textContent = a.note || (a.g === 'm' ? '阳性名词用 el / los，常以 -o 结尾' : '阴性名词用 la / las，常以 -a、-ción、-dad 结尾');
      sayItem(a);
      setTimeout(function () { quiz.lock = false; quiz.i++; if (quiz.i < quiz.qs.length) renderQ(); else renderDone(); }, ok ? 1300 : 2500);
    }
    if (q.type === 'spell') {
      var tiles = $('vQuiz').querySelectorAll('.tile'), slots = $('vQuiz').querySelectorAll('.slot');
      var paint = function () { for (var k = 0; k < slots.length; k++) { slots[k].textContent = q.typed[k] != null ? q.tiles[q.typed[k]] : ''; slots[k].className = 'slot' + (q.typed[k] != null ? ' f' : ''); } for (k = 0; k < tiles.length; k++) tiles[k].className = 'btn tile' + (q.typed.indexOf(k) >= 0 ? ' used' : ''); };
      for (var t = 0; t < tiles.length; t++) tiles[t].onclick = function () {
        if (quiz.lock) return;
        var ti = +this.getAttribute('data-t'); if (q.typed.indexOf(ti) >= 0) return;
        q.typed.push(ti); paint();
        if (q.typed.length === q.target.length) {
          quiz.lock = true;
          var word = q.typed.map(function (x) { return q.tiles[x]; }).join(''), ok = word === q.target;
          $('slots').className = 'slots ' + (ok ? 'ok' : 'no');
          finish(ok);
        }
      };
      $('qBackspace').onclick = function () { if (!quiz.lock && q.typed.length) { q.typed.pop(); paint(); } };
    } else {
      var bs = $('vQuiz').querySelectorAll('.opt');
      for (var b = 0; b < bs.length; b++) bs[b].onclick = function () {
        if (quiz.lock) return; quiz.lock = true;
        var pick = q.opts[+this.getAttribute('data-i')], right = q.type === 'gender' ? a.art : a, ok = pick === right;
        for (var k = 0; k < bs.length; k++) { var o = q.opts[+bs[k].getAttribute('data-i')]; if (o === right) bs[k].className += ' right'; else if (bs[k] === this) bs[k].className += ' wrong'; }
        finish(ok);
      };
    }
  }
  function renderDone() {
    var pct = Math.round(quiz.score / quiz.qs.length * 100);
    $('vQuiz').innerHTML = '<div class="card qcard"><div class="qp">测验完成</div><div class="score">' + quiz.score + ' / ' + quiz.qs.length + '</div><div style="font-size:30px;margin:6px 0 16px">' + (pct === 100 ? '🏆' : pct >= 70 ? '🎉' : '💪') + '</div><button class="btn primary" id="qAgain">再测一次</button> <button class="btn" id="qHome">回到课程</button></div>';
    $('qAgain').onclick = function () { startQuiz(quiz.l); };
    $('qHome').onclick = showHome;
  }
  showHome();
})();
</script>
</body>
</html>
