<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F7F1EA">
<title>西班牙语练习 · Español</title>
<style>
:root{
  --bg:#F7F1EA; --paper:#FFFFFF; --ink:#1B1E23; --soft:#5F6B76; --faint:#98A2AC; --line:#DCE3EA; --chip:#E6ECF1;
  --accent:#C0392B; --accent-ink:#FFFFFF; --accent-soft:#F8E1DB; --good:#2E7D32; --good-soft:#DDF1E1; --bad:#C8412B; --bad-soft:#F8E1DB;
  --l1:#A9C2DA; --l3:#E39A8C; --outline:#E3E8EE; --stroke:#1B1E23; --draw:#C0392B; --hint:#F2A33A;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15181C; --paper:#1F2328; --ink:#ECEEF0; --soft:#A7B0B9; --faint:#6F7881; --line:#30363D; --chip:#282D33;
    --accent:#FF8A73; --accent-ink:#1A0E0B; --accent-soft:#3A2420; --good:#6FD07A; --good-soft:#1D3321; --bad:#FF7F66; --bad-soft:#3A2420;
    --l1:#3C4F63; --l3:#7A3E34; --outline:#343A42; --stroke:#ECEEF0; --draw:#FF8A73; --hint:#F2B35E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{position:-webkit-sticky;position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;min-height:56px}
.brand{font-weight:700;font-size:19px;margin-right:auto;display:flex;align-items:center;cursor:pointer}
.brand i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:30px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);margin-right:8px;font-size:13px;font-weight:800;letter-spacing:-.02em}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:12px;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--soft)}
.btn:disabled{opacity:.4}
main{padding:14px 0 60px}
.view{display:none}.view.on{display:block}
.free{padding:14px 16px;margin-bottom:6px}
.free h3{margin:0 0 8px;font-size:15px}
.frow{display:flex}
.frow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;margin-right:8px;font-size:17px}
.frow input:focus{outline:2px solid var(--accent);border-color:transparent}
h2.sec{font-size:13px;letter-spacing:.06em;color:var(--faint);margin:20px 0 10px;font-weight:600;display:flex;justify-content:space-between}
.lessons{display:flex;flex-wrap:wrap;margin:0 -5px}
.lesson{width:calc(50% - 10px);margin:0 5px 10px;padding:12px 14px;cursor:pointer;text-align:left}
.lesson:hover{border-color:var(--accent)}
.l-n{font-size:12px;color:var(--faint)}
.l-t{font-weight:700;font-size:16px}
.l-c{font-size:15px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 6px}
.pbar{height:5px;background:var(--chip);border-radius:5px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--good);border-radius:5px}
.sbar{display:flex;align-items:center;margin-bottom:10px}
.sbar .ti{flex:1;text-align:center;font-weight:600}
.sbar .ti small{display:block;font-weight:400;color:var(--faint);font-size:12px}
.stage{padding:18px 12px 16px;text-align:center}
.board{display:inline-block;touch-action:none;-webkit-user-select:none;user-select:none;max-width:100%;cursor:crosshair}
.board svg{display:block}
.ipa{font-size:20px;color:var(--accent);margin-top:6px;font-family:"Lucida Sans Unicode","Arial Unicode MS","Segoe UI",sans-serif}
.zh{font-size:18px;margin-top:2px}
.pair{font-size:15px;color:var(--soft);margin-top:4px}
.ex{display:inline-block;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 14px;margin-top:10px;cursor:pointer}
.ex b{font-size:18px}
.ex span{color:var(--soft);font-size:13.5px;margin-left:6px}
.info{font-size:13px;color:var(--faint);margin-top:6px;min-height:20px}
.fb{font-size:15px;font-weight:600;min-height:24px;margin-top:4px}
.fb.ok{color:var(--good)} .fb.bad{color:var(--bad)}
.tools{display:flex;flex-wrap:wrap;justify-content:center;margin-top:10px}
.tools .btn{margin:0 4px 8px;min-width:92px}
.nav{display:flex;align-items:center;margin-top:12px}
.nav .btn{flex:1}
.nav .btn.mid{flex:1.4;margin:0 8px}
.dots{display:flex;justify-content:center;flex-wrap:wrap;margin-top:12px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);margin:0 3px 4px}
.dots i.l{background:var(--good)} .dots i.c{background:var(--accent);transform:scale(1.3)}
.qcard{padding:22px 16px;text-align:center}
.qp{font-size:14px;color:var(--soft)}
.qq{font-size:30px;font-weight:700;margin:10px 0 16px;min-height:44px}
.opts{display:flex;flex-wrap:wrap;margin:0 -5px}
.opt{width:calc(50% - 10px);margin:0 5px 10px;min-height:70px;font-size:24px;font-weight:600;border-radius:14px}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.slots{display:flex;justify-content:center;flex-wrap:wrap;margin:6px 0 14px;min-height:52px}
.slot{width:40px;height:48px;border-bottom:3px solid var(--line);margin:0 3px;font-size:28px;font-weight:700;line-height:46px;cursor:pointer}
.slot.f{border-color:var(--accent)}
.slots.ok .slot{color:var(--good);border-color:var(--good)}
.slots.no .slot{color:var(--bad);border-color:var(--bad)}
.tiles{display:flex;justify-content:center;flex-wrap:wrap}
.tile{width:48px;height:52px;margin:0 4px 8px;font-size:24px;font-weight:700;border-radius:12px;padding:0}
.tile.used{visibility:hidden}
.score{font-size:48px;font-weight:700;color:var(--accent)}
.hint{font-size:12.5px;color:var(--faint);text-align:center;margin-top:14px;line-height:1.7}
@media (max-width:420px){ .lesson{width:calc(100% - 10px)} .tools .btn{min-width:0;flex:1 1 40%} }
.g-m{color:#2466B8}.g-f{color:#C2185B}
@media (prefers-color-scheme: dark){.g-m{color:#7FB2FF}.g-f{color:#F48FB1}}
.art{font-size:22px;font-weight:700;margin-right:6px}
.syl{font-size:21px;margin-top:8px;letter-spacing:.02em}
.syl b{color:var(--accent);text-decoration:underline;text-underline-offset:4px}
.gtag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--chip);margin-left:6px;vertical-align:middle}
.note{font-size:13px;color:var(--soft);background:var(--bg);border-radius:10px;padding:6px 10px;margin:8px auto 0;max-width:420px}
.levhome{padding:14px 16px;margin-bottom:16px;cursor:pointer;display:block;width:100%;text-align:left;background:linear-gradient(135deg,var(--accent-soft),var(--paper))}
.levhome b{font-size:17px}.levhome div{font-size:13px;color:var(--soft);margin-top:3px}
.lvtop{padding:14px 10px;margin-bottom:12px}
.lvstats{display:flex;text-align:center}.lvstats div{flex:1}.lvstats b{display:block;font-size:24px;color:var(--accent);font-weight:800}.lvstats span{font-size:12px;color:var(--soft)}
.lvsub{font-size:13px;color:var(--soft)}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;margin:0 0 12px}
.tabs button{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:6px 14px;margin:0 4px 6px;font-size:14px;color:var(--soft)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.fam{padding:12px 14px;margin-bottom:10px;cursor:pointer}.fam.done{border-color:var(--good)}
.fam .fb0{display:flex;align-items:center}.fam .mid{flex:1;margin-left:12px;min-width:0}
.fam .cnt{font-size:12.5px;color:var(--good);font-weight:600}
.rule{font-size:19px;white-space:nowrap}.rule span{color:var(--soft)}.rule i{font-style:normal;color:var(--faint);margin:0 6px}.rule b{color:var(--accent)}
.rule.big{font-size:32px;text-align:center}
.tipb{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0;text-align:left;line-height:1.7}
.blk{text-align:left;font-size:14px;padding:7px 0;border-bottom:1px dashed var(--line)}.blk span{display:inline-block;min-width:78px;font-weight:700;color:var(--accent)}
.numout{font-size:30px;font-weight:700;margin:12px 0 4px;word-break:break-word}
.pchip{display:inline-block;background:var(--chip);border-radius:8px;padding:1px 8px;margin:2px}
.row{display:flex;flex-wrap:wrap;justify-content:center;margin-top:10px}.row .btn{margin:0 4px 8px}
.pairs{text-align:left}.pair2{display:flex;align-items:baseline;flex-wrap:wrap;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.pair2 .en{color:var(--soft);min-width:110px}.pair2 i{font-style:normal;color:var(--faint);margin:0 8px}.pair2 b{font-size:17px}.pair2 small{margin-left:auto;color:var(--faint);font-size:12.5px;padding-left:8px}
.ends{display:flex;flex-wrap:wrap;justify-content:center;margin:6px 0}.ends div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px 10px;margin:0 4px 8px;text-align:center;min-width:88px}.ends small{display:block;font-size:11.5px;color:var(--soft)}.ends b{font-size:20px;color:var(--accent)}
.vsel{display:flex;flex-wrap:wrap;justify-content:center;margin:8px 0}.vb{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:4px 10px;margin:0 3px 6px;font-size:14px}.vb.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.ctab{max-width:380px;margin:0 auto}.crow{display:flex;justify-content:space-between;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-size:17px}.crow span{color:var(--soft)}.crow em{font-style:normal;color:var(--accent);font-weight:800}
.opt.small{font-size:16px!important}
.tip{font-size:14px;color:var(--soft);margin-top:8px;max-width:440px;margin-left:auto;margin-right:auto}
</style>
</head>

    $('qAgain').onclick = function () { if (quiz.again) quiz.again(); else startQuiz(quiz.l); };
    $('qHome').onclick = function () { if (quiz.back) quiz.back(); else showHome(); };
    if (quiz.back) $('qHome').textContent = '返回';
  }

  /* ================= 以少胜多 ================= */
  var LEV = get('lev', {}), levTab = get('levTab', 'num'), levSel = null;
  function setLev(k, v) { if (v) LEV[k] = 1; else delete LEV[k]; put('lev', LEV); }
  function estNum(s) { var m = /(\d+)/.exec(s); if (m) return +m[1]; if (/上千/.test(s)) return 1000; if (/几百/.test(s)) return 300; return 100; }
  function levStats() {
    var w = 0, v = 0, i, g;
    for (i = 0; i < ES.lev.cognates.length; i++) if (LEV['r:' + ES.lev.cognates[i].en]) w += estNum(ES.lev.cognates[i].est);
    for (g in ES.lev.verbs) if (ES.lev.verbs.hasOwnProperty(g) && LEV['v:' + g]) v += ES.lev.verbs[g].verbs.length * 5;
    return { w: w, v: v, n: LEV.num ? 1000000 : 0 };
  }
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function showLev() {
    if (board) { board.destroy(); board = null; }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    var st = levStats(), h = '', i;
    h += '<div class="sbar"><button class="btn ghost" id="lvBack">‹ 返回</button><div class="ti">🪄 以少胜多</div><span style="width:70px"></span></div>';
    h += '<div class="card lvtop"><div class="lvstats"><div><b>' + fmt(st.n) + '</b><span>个数字会读</span></div><div><b>≈' + fmt(st.w) + '</b><span>个单词秒懂</span></div><div><b>' + fmt(st.v) + '</b><span>个动词形式</span></div></div></div>';
    var tabs = [['num', '数字魔法'], ['cog', '英语变西语'], ['verb', '动词变位']];
    h += '<div class="tabs">';
    for (i = 0; i < tabs.length; i++) h += '<button data-t="' + tabs[i][0] + '" class="' + (levTab === tabs[i][0] ? 'on' : '') + '">' + tabs[i][1] + '</button>';
    h += '</div><div id="lvBody"></div>';
    $('vLev').innerHTML = h;
    show('vLev');
    $('lvBack').onclick = function () { if (levTab === 'cog' && levSel != null) { levSel = null; showLev(); } else showHome(); };
    var tb = $('vLev').querySelectorAll('.tabs button');
    for (i = 0; i < tb.length; i++) tb[i].onclick = function () { levTab = this.getAttribute('data-t'); put('levTab', levTab); levSel = null; showLev(); };
    if (levTab === 'num') renderNum();
    else if (levTab === 'cog') { if (levSel != null) renderRule(levSel); else renderRules(); }
    else renderVerb(levSel || 'ar');
  }

  /* ----- numbers ----- */
  var U = ['cero', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once', 'doce', 'trece', 'catorce', 'quince', 'dieciséis', 'diecisiete', 'dieciocho', 'diecinueve', 'veinte', 'veintiuno', 'veintidós', 'veintitrés', 'veinticuatro', 'veinticinco', 'veintiséis', 'veintisiete', 'veintiocho', 'veintinueve'];
  var TENS = { 3: 'treinta', 4: 'cuarenta', 5: 'cincuenta', 6: 'sesenta', 7: 'setenta', 8: 'ochenta', 9: 'noventa' };
  var HUN = { 1: 'ciento', 2: 'doscientos', 3: 'trescientos', 4: 'cuatrocientos', 5: 'quinientos', 6: 'seiscientos', 7: 'setecientos', 8: 'ochocientos', 9: 'novecientos' };
  function es99(n) { if (n < 30) return [U[n]]; var t = Math.floor(n / 10), u = n % 10; return u ? [TENS[t], 'y', U[u]] : [TENS[t]]; }
  function es999(n) {
    if (n === 100) return ['cien'];
    var h = Math.floor(n / 100), r = n % 100, out = [];
    if (h) out.push(HUN[h]);
    if (r) out = out.concat(es99(r));
    return out;
  }
  function numParts(n) {
    if (n === 0) return [['cero']];
    var th = Math.floor(n / 1000), r = n % 1000, parts = [];
    if (th) {
      var a = th === 1 ? [] : es999(th);
      if (a.length) { var last = a[a.length - 1]; if (last === 'uno') a[a.length - 1] = 'un'; else if (last === 'veintiuno') a[a.length - 1] = 'veintiún'; }
      parts.push(a.concat(['mil']));
    }
    if (r) parts.push(es999(r));
    return parts;
  }
  function numEs(n) { var p = numParts(n), a = [], i; for (i = 0; i < p.length; i++) a = a.concat(p[i]); return a.join(' '); }
  var BLOCKS = [['0–15', 'cero uno dos tres cuatro cinco seis siete ocho nueve diez once doce trece catorce quince'], ['16–29 连写', 'dieci- + 6~9 → dieciséis…　veinti- + 1~9 → veintiuno…'], ['整十', 'treinta cuarenta cincuenta sesenta setenta ochenta noventa'], ['整百', 'cien / ciento, doscientos, trescientos, cuatrocientos, quinientos, seiscientos, setecientos, ochocientos, novecientos'], ['千', 'mil　(2000 = dos mil)']];
  function randNum() {
    var r = Math.random();
    if (r < 0.3) return 16 + Math.floor(Math.random() * 84);
    if (r < 0.65) return 100 + Math.floor(Math.random() * 900);
    if (r < 0.9) return 1000 + Math.floor(Math.random() * 9000);
    return 10000 + Math.floor(Math.random() * 990000);
  }
  function renderNum() {
    var h = '<div class="card stage"><div class="tipb">学会下面这 <b>5 组、大约 40 个词</b>，再记住 3 条规则，就能读出 0 到 999,999 的<b>每一个</b>数：<br>① 31–99 用 <b>y</b> 连接：treinta <b>y</b> uno　② 100 整是 cien，101 起是 ciento…　③ 1000 是 mil，不说 un mil</div>';
    for (var i = 0; i < BLOCKS.length; i++) h += '<div class="blk"><span>' + BLOCKS[i][0] + '</span>' + esc(BLOCKS[i][1]) + '</div>';
    h += '<div class="frow" style="max-width:360px;margin:12px auto 0"><input id="numIn" type="number" inputmode="numeric" min="0" max="999999" placeholder="输入 0–999999"><button class="btn" id="numRand">🎲 随机</button></div>';
    h += '<div class="numout" id="numOut"></div><div class="lvsub" id="numParts"></div>';
    h += '<div class="row"><button class="btn" id="numSay">🔊 读音</button><button class="btn primary" id="numQuiz">🎯 数字测验</button><button class="btn ' + (LEV.num ? 'good' : '') + '" id="numGot">' + (LEV.num ? '✓ 已学会' : '✓ 我学会了') + '</button></div></div>';
    $('lvBody').innerHTML = h;
    var cur = '';
    function upd(n) {
      if (isNaN(n) || n < 0 || n > 999999) { cur = ''; $('numOut').textContent = ''; $('numParts').innerHTML = ''; return; }
      n = Math.floor(n); cur = numEs(n);
      $('numOut').textContent = cur;
      var p = numParts(n);
      $('numParts').innerHTML = '拆开看：' + p.map(function (x) { return '<span class="pchip">' + esc(x.join(' ')) + '</span>'; }).join(' + ');
    }
    $('numIn').oninput = function () { upd(parseInt(this.value, 10)); };
    $('numRand').onclick = function () { var n = randNum(); $('numIn').value = n; upd(n); say(cur); };
    $('numSay').onclick = function () { if (cur) say(cur); };
    $('numQuiz').onclick = numQuiz;
    $('numGot').onclick = function () { setLev('num', !LEV.num); showLev(); };
    var n0 = randNum(); $('numIn').value = n0; upd(n0);
  }
  function tweak(n) {
    var s = String(n).split(''), k = Math.floor(Math.random() * s.length), r = Math.random();
    if (r < 0.45) s[k] = String((+s[k] + 1 + Math.floor(Math.random() * 8)) % 10);
    else if (s.length > 1) { var j = (k + 1) % s.length, t = s[k]; s[k] = s[j]; s[j] = t; }
    else s[k] = String((+s[k] + 3) % 10);
    if (s[0] === '0') s[0] = '1';
    return parseInt(s.join(''), 10);
  }
  function numQuiz() {
    var qs = [], i;
    for (i = 0; i < 10; i++) {
      var n = randNum(), opts = [n], g = 0, listen = i % 2 === 1;
      while (opts.length < 4 && g++ < 100) { var m = tweak(n); if (opts.indexOf(m) < 0 && m > 0) opts.push(m); }
      while (opts.length < 4) opts.push(n + opts.length * 11);
      var oo = [];
      for (var k = 0; k < opts.length; k++) oo.push({ w: listen ? fmt(opts[k]) : numEs(opts[k]) });
      qs.push({ custom: true, ans: oo[0], opts: shuffle(oo), label: listen ? '听一听，是哪个数？' : '这个数用西语怎么说？', prompt: listen ? '<button class="btn primary" id="qSay" style="font-size:22px;padding:10px 26px">🔊</button>' : '<span style="font-size:40px">' + fmt(n) + '</span>', say: numEs(n), sayFirst: listen, small: !listen, fb: '<b>' + fmt(n) + '</b> = ' + esc(numEs(n)) });
    }
    runQuiz({ l: null, qs: qs, back: showLev, again: numQuiz, onDone: function (p) { if (p >= 80) setLev('num', 1); } });
  }

  /* ----- cognate rules ----- */
  var ARTRE = /^(el \/ la|el|la|los|las) /;
  function bare(s) { return s.replace(ARTRE, ''); }
  function renderRules() {
    var rs = ES.lev.cognates, h = '<div class="tipb">英语和西语有成千上万个「长得像」的词。掌握一条<b>结尾变身规则</b>，一大批英语单词直接变成西语！点开一条规则看看。</div>', i;
    for (i = 0; i < rs.length; i++) {
      var r = rs[i], on = LEV['r:' + r.en];
      h += '<div class="card fam' + (on ? ' done' : '') + '" data-i="' + i + '"><div class="fb0"><div class="rule"><span>' + esc(r.en) + '</span><i>→</i><b>' + esc(r.es) + '</b></div><div class="mid"><div class="cnt">' + (on ? '✓ 已学会 · ' : '') + esc(r.est) + '</div><div class="lvsub">' + esc(r.pairs[0][0]) + ' → ' + esc(r.pairs[0][1]) + ' · ' + esc(r.pairs[1][0]) + ' → ' + esc(r.pairs[1][1]) + '</div></div></div></div>';
    }
    $('lvBody').innerHTML = h;
    var cs = $('lvBody').querySelectorAll('.fam');
    for (i = 0; i < cs.length; i++) cs[i].onclick = function () { levSel = +this.getAttribute('data-i'); showLev(); };
  }
  function renderRule(i) {
    var r = ES.lev.cognates[i], on = LEV['r:' + r.en], h = '<div class="card stage"><div class="rule big"><span>' + esc(r.en) + '</span><i>→</i><b>' + esc(r.es) + '</b></div>';
    h += '<div class="lvsub">' + esc(r.est) + (r.gender ? ' · ' + esc(r.gender) : '') + '</div><div class="tipb">' + esc(r.tip) + '</div><div class="pairs">';
    for (var k = 0; k < r.pairs.length; k++) h += '<div class="pair2" data-say="' + esc(r.pairs[k][1]) + '"><span class="en">' + esc(r.pairs[k][0]) + '</span><i>→</i><b>' + esc(r.pairs[k][1]) + '</b><small>' + esc(r.pairs[k][2]) + '</small></div>';
    h += '</div><div class="row"><button class="btn primary" id="rQuiz">🎯 考考我</button><button class="btn ' + (on ? 'good' : '') + '" id="rGot">' + (on ? '✓ 已学会' : '✓ 我学会了') + '</button></div></div>';
    $('lvBody').innerHTML = h;
    var ps = $('lvBody').querySelectorAll('.pair2');
    for (k = 0; k < ps.length; k++) ps[k].onclick = function () { say(this.getAttribute('data-say')); };
    $('rQuiz').onclick = function () { ruleQuiz(i); };
    $('rGot').onclick = function () { setLev('r:' + r.en, !LEV['r:' + r.en]); showLev(); };
  }
  var UNACC = { 'á': 'a', 'é': 'e', 'í': 'i', 'ó': 'o', 'ú': 'u' };
  function unacc(s) { return s.replace(/[áéíóú]/g, function (c) { return UNACC[c]; }); }
  function ruleQuiz(ri) {
    var r = ES.lev.cognates[ri], pool = shuffle(r.pairs.slice()).slice(0, 10), qs = [], i;
    var esS = r.es.replace(/^-/, ''), enS = r.en.replace(/^-/, '');
    for (i = 0; i < pool.length; i++) {
      var p = pool[i], full = p[1], m = ARTRE.exec(full), art = m ? m[0] : '', w = bare(full), stem = w.slice(0, w.length - esS.length), cands = [], k;
      cands.push(unacc(w));
      cands.push(stem + enS);
      var others = shuffle(ES.lev.cognates.slice());
      for (k = 0; k < others.length; k++) { var o = others[k].es.replace(/^-/, ''); if (o !== esS) cands.push(stem + o); }
      var opts = [{ w: full }], seen = {}; seen[full] = 1;
      for (k = 0; k < cands.length && opts.length < 4; k++) { var c = art + cands[k]; if (!seen[c] && cands[k] !== w) { seen[c] = 1; opts.push({ w: c }); } }
      qs.push({ custom: true, ans: opts[0], opts: shuffle(opts), label: '这个英语单词，西语怎么写？', prompt: '<span style="font-size:32px">' + esc(p[0]) + '</span><div style="font-size:16px;font-weight:400;color:var(--soft)">' + esc(p[2]) + '</div>', say: full, small: true, fb: esc(p[0]) + ' → <b>' + esc(full) + '</b>' });
    }
    runQuiz({ l: null, qs: qs, back: showLev, again: function () { ruleQuiz(ri); }, onDone: function (pc) { if (pc >= 80) setLev('r:' + r.en, 1); } });
  }

  /* ----- verbs ----- */
  var PRON = ES.lev.pronouns;
  function conj(v, g, k) { return v.slice(0, -2) + ES.lev.verbs[g].endings[k]; }
  function renderVerb(g) {
    var G = ES.lev.verbs[g], on = LEV['v:' + g], sel = get('verb:' + g, 0), v = G.verbs[sel] || G.verbs[0], i;
    var h = '<div class="tabs sm">';
    for (var gg in ES.lev.verbs) if (ES.lev.verbs.hasOwnProperty(gg)) h += '<button data-g="' + gg + '" class="' + (gg === g ? 'on' : '') + '">-' + gg + ' 动词' + (LEV['v:' + gg] ? ' ✓' : '') + '</button>';
    h += '</div><div class="card stage"><div class="tipb">西语动词按人称变结尾。<b>记住一套 -' + g + ' 结尾（5 个）</b>，下面这 ' + G.verbs.length + ' 个规则动词（还有几百个）全都会变！<br>拉美说「你们」用 ustedes，和「他们」同一个形式。</div>';
    h += '<div class="ends">'; for (i = 0; i < 5; i++) h += '<div><small>' + esc(PRON[i]) + '</small><b>-' + esc(G.endings[i]) + '</b></div>'; h += '</div>';
    h += '<div class="vsel">'; for (i = 0; i < G.verbs.length; i++) h += '<button class="vb' + (G.verbs[i] === v ? ' on' : '') + '" data-v="' + i + '">' + esc(G.verbs[i][0]) + '</button>'; h += '</div>';
    h += '<div class="numout" style="font-size:28px">' + esc(v[0]) + ' <span style="font-size:17px;color:var(--soft);font-weight:400">' + esc(v[1]) + '</span></div><div class="ctab">';
    var stem = v[0].slice(0, -2);
    for (i = 0; i < 5; i++) { var f = conj(v[0], g, i); h += '<div class="crow" data-say="' + esc(PRON[i].split(' / ')[0] + ' ' + f) + '"><span>' + esc(PRON[i]) + '</span><b>' + esc(stem) + '<em>' + esc(G.endings[i]) + '</em></b></div>'; }
    h += '</div><div class="row"><button class="btn primary" id="vbQuiz">🎯 考考我</button><button class="btn ' + (on ? 'good' : '') + '" id="vGot">' + (on ? '✓ 已学会' : '✓ 我学会了') + '</button></div></div>';
    $('lvBody').innerHTML = h;
    var b = $('lvBody').querySelectorAll('.tabs button');
    for (i = 0; i < b.length; i++) b[i].onclick = function () { levSel = this.getAttribute('data-g'); showLev(); };
    b = $('lvBody').querySelectorAll('.vb');
    for (i = 0; i < b.length; i++) b[i].onclick = function () { put('verb:' + g, +this.getAttribute('data-v')); renderVerb(g); say(G.verbs[+this.getAttribute('data-v')][0]); };
    b = $('lvBody').querySelectorAll('.crow');
    for (i = 0; i < b.length; i++) b[i].onclick = function () { say(this.getAttribute('data-say')); };
    $('vbQuiz').onclick = function () { verbQuiz(g); };
    $('vGot').onclick = function () { setLev('v:' + g, !LEV['v:' + g]); levSel = g; showLev(); };
  }
  function verbQuiz(g) {
    var G = ES.lev.verbs[g], qs = [], i, vs = shuffle(G.verbs.slice());
    for (i = 0; i < 10; i++) {
      var v = vs[i % vs.length], k = Math.floor(Math.random() * 5), opts = [], j;
      for (j = 0; j < 5; j++) opts.push({ w: conj(v[0], g, j) });
      var ans = opts[k]; opts.splice(k, 1); opts = shuffle(opts).slice(0, 3); opts.push(ans);
      var pr = PRON[k].split(' / ')[0];
      qs.push({ custom: true, ans: ans, opts: shuffle(opts), label: '选出正确的变位', prompt: '<span style="font-size:28px">' + esc(pr) + ' + ' + esc(v[0]) + '</span><div style="font-size:15px;font-weight:400;color:var(--soft)">' + esc(v[1]) + '</div>', say: pr + ' ' + ans.w, fb: esc(pr) + ' <b>' + esc(ans.w) + '</b>' });
    }
    runQuiz({ l: null, qs: qs, back: function () { levSel = g; showLev(); }, again: function () { verbQuiz(g); }, onDone: function (pc) { if (pc >= 80) setLev('v:' + g, 1); } });
  }

  showHome();
})();
</script>
</body>
</html>
