<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3EEE4">
<title>人物专栏</title>
<script src="sync.js?v=1"></script>
<style>
:root{
  --bg:#F3EEE4; --paper:#FFFCF5; --ink:#2A251D; --soft:#6E6455; --faint:#A39987; --line:#E5DCCB; --chip:#ECE4D4;
  --accent:#8C2F1F; --accent-soft:#F3DFD6; --gold:#A4791E; --gold-soft:#F4EAD0;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(60,40,20,.08);
  --serif:"Songti SC","STSong","Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","BiauKai","Noto Serif SC",serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#16130F; --paper:#201C16; --ink:#EEE6D8; --soft:#B5AA97; --faint:#7B715F; --line:#363026; --chip:#2B261E;
  --accent:#E3896F; --accent-soft:#3A221B; --gold:#E2B85C; --gold-soft:#352A13;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;font-size:15px;line-height:1.65;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;min-height:52px;padding-top:env(safe-area-inset-top)}
.brand{font-weight:800;font-size:18px;color:var(--ink);text-decoration:none;margin-right:auto}
.who{display:flex;gap:8px;margin-bottom:12px}
.who button{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:9px 4px;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who button.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:0 16px 2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13.5px}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.chips button small{opacity:.6;margin-left:3px}
.sec{font-size:17px;font-weight:800;margin:22px 2px 10px;display:flex;align-items:baseline;gap:8px}
.sec small{font-size:12.5px;color:var(--faint);font-weight:400}
.empty{text-align:center;color:var(--soft);padding:24px}
.foot{font-size:12px;color:var(--faint);text-align:center;margin-top:22px;line-height:1.8}

/* ---------- 苏轼 ---------- */
.ss-hero{background:linear-gradient(160deg,#3B2A1C,#1E1712);color:#F1E6D2;border-radius:18px;padding:18px 18px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.ss-hero:after{content:"東坡";position:absolute;right:-6px;bottom:-26px;font-family:var(--kai);font-size:110px;color:rgba(255,255,255,.06);pointer-events:none}
.ss-hero h1{margin:0;font-family:var(--kai);font-size:34px;letter-spacing:.12em}
.ss-hero .sub{font-size:13px;opacity:.8;margin-top:2px}
.ss-hero p{font-size:14px;margin:10px 0 0;opacity:.92;line-height:1.75}
.ss-hero .seal{display:inline-block;border:1.5px solid #C9573C;color:#E07A5F;border-radius:4px;font-family:var(--kai);font-size:13px;padding:0 6px;margin-left:8px;vertical-align:4px}
.ss-hero .bt{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.ss-hero .bt button,.ss-hero .bt a{border:1px solid rgba(255,255,255,.35);background:none;color:#F1E6D2;border-radius:999px;padding:5px 13px;font-size:13.5px;text-decoration:none}
.road{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0;padding:4px 16px 8px}
.road::-webkit-scrollbar{display:none}
.stop{flex:0 0 auto;min-width:92px;padding:0 8px 0 0;position:relative}
.stop:before{content:"";position:absolute;left:6px;right:0;top:8px;height:2px;background:var(--line)}
.stop i{position:relative;display:block;width:14px;height:14px;border-radius:50%;background:var(--paper);border:3px solid var(--faint)}
.stop.low i{border-color:var(--accent)}
.stop b{display:block;font-family:var(--serif);font-size:15px;margin-top:4px}
.stop small{display:block;font-size:11.5px;color:var(--soft);line-height:1.4}
.wk{background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.wk .hd{padding:13px 14px 11px;cursor:pointer}
.wk .tl{display:flex;align-items:center;gap:8px}
.wk h3{margin:0;font-family:var(--serif);font-size:18px;flex:1;line-height:1.35}
.kind{font-size:11.5px;font-weight:700;border-radius:5px;padding:0 6px;flex:0 0 auto}
.k-词{background:var(--accent-soft);color:var(--accent)}.k-诗{background:var(--gold-soft);color:var(--gold)}.k-文{background:var(--chip);color:var(--soft)}
.wk .mt{font-size:12.5px;color:var(--faint);margin-top:2px}
.wk .why{font-size:13.5px;color:var(--soft);margin-top:6px}
.wk .open{display:inline-block;margin-top:8px;font-size:13px;color:var(--accent);font-weight:600}
.wk .bd{display:none;border-top:1px dashed var(--line);padding:14px 16px 14px}
.wk.on .bd{display:block}
.wk.on .open{display:none}
.poem{font-family:var(--kai);font-size:20px;line-height:2.05;letter-spacing:.04em;text-align:center;padding:4px 0 8px}
.poem.prose{text-align:left;font-size:18px;line-height:2}
.poem span.n{border-bottom:2px dotted var(--accent);cursor:pointer;border-radius:2px}
.poem span.n.act{background:var(--accent-soft)}
.pop{background:var(--ink);color:var(--paper);border-radius:12px;padding:9px 12px;font-size:14px;margin:4px 0 10px;line-height:1.6}
.pop b{color:#F2B39E;margin-right:6px}
.tg2{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.tg2 button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--soft)}
.tg2 button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.box{border-radius:12px;padding:10px 12px;font-size:14.5px;margin-top:8px;line-height:1.8}
.box.tr{background:var(--gold-soft)}
.box.bg{background:var(--chip)}
.box h4{margin:0 0 2px;font-size:12.5px;color:var(--soft)}
.wk .src{font-size:12px;margin-top:10px;color:var(--faint)}

/* ---------- George Michael ---------- */
.gm-hero{background:radial-gradient(120% 140% at 85% 0%,#3A3F8F 0%,#15172E 55%,#0B0C18 100%);color:#EDEBFA;border-radius:18px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.gm-hero:after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;border:18px solid rgba(255,255,255,.05);pointer-events:none}
.gm-hero h1{margin:0;font-size:30px;font-weight:800;letter-spacing:.02em;font-family:Georgia,"Iowan Old Style",serif}
.gm-hero .sub{font-size:13px;opacity:.75}
.gm-hero p{font-size:14px;opacity:.9;margin:10px 0 0}
.gm-hero .bt{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.gm-hero .bt button{border:1px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:999px;padding:5px 13px;font-size:13.5px}
.bio{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:6px 16px;margin-top:10px}
.bio p{margin:10px 0;font-size:15px;line-height:1.85}
.path{counter-reset:p;display:flex;flex-direction:column;gap:6px}
.path button{counter-increment:p;display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 12px;font-size:15px}
.path button:before{content:counter(p);flex:0 0 26px;height:26px;border-radius:50%;background:#2C2F6B;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.path button small{margin-left:auto;color:var(--faint);font-size:12px}
.albums{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 8px;scroll-snap-type:x mandatory}
.albums::-webkit-scrollbar{display:none}
.al{flex:0 0 78%;max-width:320px;scroll-snap-align:start;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.al .cv{height:86px;border-radius:12px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-family:Georgia,serif;font-size:20px;font-weight:700;line-height:1.15;margin-bottom:10px}
.al .yr{font-size:12px;color:var(--faint)}
.al p{font-size:13.5px;color:var(--soft);margin:6px 0}
.al .ls{font-size:13px;margin-top:auto}
.al .ls a{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 9px;margin:3px 4px 0 0;text-decoration:none;color:var(--ink)}
.al .nt{font-size:12px;color:var(--faint);margin-top:6px}
.sg{background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.sg .hd{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.sg .disc{flex:0 0 40px;height:40px;border-radius:50%;background:radial-gradient(circle,#ddd 0 3px,#222 4px 9px,#111 10px 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.sg.on .disc{animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sg h3{margin:0;font-size:16px;font-family:Georgia,"Iowan Old Style",serif}
.sg .mt{font-size:12.5px;color:var(--faint)}
.sg .bd{display:none;padding:0 14px 14px 64px}
.sg.on .bd{display:block}
.sg .row{font-size:14.5px;margin-top:8px;line-height:1.75}
.sg .row b{display:block;font-size:12px;color:var(--faint);font-weight:600}
.mood{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.mood span{font-size:12px;background:var(--chip);border-radius:999px;padding:0 9px;color:var(--soft)}
.go{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.go a{font-size:13px;border-radius:999px;padding:4px 12px;text-decoration:none;font-weight:600}
.go .yt{background:#E33;color:#fff}.go .sp{background:#1DB954;color:#062}.go .am{background:var(--ink);color:var(--paper)}
.tl2{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl2 div{position:relative;padding:5px 0;font-size:14px}
.tl2 div:before{content:"";position:absolute;left:-20px;top:12px;width:10px;height:10px;border-radius:50%;background:#2C2F6B}
.tl2 b{font-family:Georgia,serif;margin-right:8px}
.facts{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:6px 16px}
.facts div{padding:9px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.facts div:last-child{border-bottom:0}


/* ---------- 人生七年 ---------- */
.up-hero{background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 10px,transparent 10px 22px) top/100% 12px no-repeat,repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 10px,transparent 10px 22px) bottom/100% 12px no-repeat,linear-gradient(160deg,#2B2B2B,#121212);color:#EDE7DA;border-radius:18px;padding:24px 18px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.up-hero:after{content:"7·14·21·28·35";position:absolute;right:-8px;bottom:6px;font-family:Georgia,serif;font-size:44px;font-weight:700;color:rgba(255,255,255,.05);pointer-events:none;white-space:nowrap}
.up-hero h1{margin:0;font-size:28px;font-weight:800;letter-spacing:.06em}
.up-hero .sub{font-size:13px;opacity:.75;margin-top:2px}
.up-hero p{font-size:14px;opacity:.92;margin:10px 0 0;line-height:1.75}
.up-seg{display:flex;gap:6px;margin:12px 0 4px}
.up-seg button{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 4px;font-size:14.5px;font-weight:600}
.up-seg button.on{background:#2B2B2B;border-color:#2B2B2B;color:#F3EEE4}
@media (prefers-color-scheme: dark){.up-seg button.on{background:#EDE7DA;border-color:#EDE7DA;color:#16130F}}
.up-intro{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:4px 16px;margin-top:10px}
.up-intro p{margin:10px 0;font-size:14.5px;line-height:1.85}
.up-intro .more{border:0;background:none;color:var(--accent);font-size:13.5px;padding:0 0 10px;font-weight:600}
.up-facts{margin:10px 0 0;padding:0;list-style:none}
.up-facts li{font-size:13.5px;color:var(--soft);padding:3px 0 3px 16px;position:relative}
.up-facts li:before{content:"▪";position:absolute;left:2px;color:var(--gold)}
.reel{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 8px;scroll-snap-type:x proximity}
.reel::-webkit-scrollbar{display:none}
.fr{flex:0 0 150px;scroll-snap-align:start;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);cursor:pointer}
.fr.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.fr .ag{font-family:Georgia,serif;font-size:30px;font-weight:700;line-height:1;color:var(--gold)}
.fr .ag small{font-size:12px;color:var(--faint);margin-left:3px;font-family:inherit;font-weight:400}
.fr b{display:block;font-size:13px;margin-top:4px;line-height:1.35}
.fr .yr{font-size:11.5px;color:var(--faint)}
.fr p{font-size:12px;color:var(--soft);margin:5px 0 0;line-height:1.5}
.spo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--gold-soft);border-radius:12px;padding:8px 12px;font-size:13px;margin:4px 0 10px}
.spo select{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:3px 6px;font-size:13.5px}
.pc{background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.pc .hd{display:flex;gap:11px;padding:12px 14px;cursor:pointer;align-items:flex-start}
.pc .av{flex:0 0 42px;height:42px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:21px}
.pc .nm{flex:1;min-width:0}
.pc h3{margin:0;font-size:16.5px;line-height:1.3}
.pc h3 small{font-weight:400;font-size:12.5px;color:var(--faint);margin-left:6px;font-family:Georgia,serif}
.pc .fm{font-size:12.5px;color:var(--soft)}
.pc .dots{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.pc .dots i{font-style:normal;font-size:10px;line-height:16px;min-width:22px;text-align:center;border-radius:5px;background:var(--chip);color:var(--faint)}
.pc .dots i.y{background:#2B2B2B;color:#F3EEE4}
.pc .dots i.hid{opacity:.35}
@media (prefers-color-scheme: dark){.pc .dots i.y{background:#D9CFBC;color:#16130F}}
.pc .sv{font-size:13.5px;margin-top:6px;line-height:1.6}
.pc .sv b{color:var(--gold);font-size:12px;margin-right:4px}
.pc .bd{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px}
.pc.on .bd{display:block}
.pc .then{background:var(--chip);border-radius:10px;padding:8px 11px;font-size:14px;line-height:1.7;margin-bottom:10px}
.pc .then b{display:block;font-size:12px;color:var(--soft)}
.ages{border-left:2px solid var(--line);margin-left:18px;padding-left:28px}
.ages .a{position:relative;padding:6px 0 8px;font-size:14.5px;line-height:1.75}
.ages .a:before{content:attr(data-age);position:absolute;left:-47px;top:6px;width:34px;height:24px;border-radius:12px;background:var(--paper);border:2px solid var(--gold);font-family:Georgia,serif;font-weight:700;font-size:12.5px;color:var(--gold);display:flex;align-items:center;justify-content:center}
.ages .a.no{color:var(--faint);font-size:13px}
.ages .lock{font-size:13px;color:var(--faint);padding:6px 0}
.look{margin-top:10px;border-left:3px solid var(--accent);padding:4px 0 4px 11px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.look b{display:block;font-size:12px;color:var(--accent)}
.up-th{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:10px}
.up-th h3{margin:0 0 4px;font-size:16.5px}
.up-th p{margin:8px 0;font-size:14.5px;line-height:1.85}
.pair{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.pair .two{display:flex;gap:8px;margin:8px 0}
.pair .two button{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px;text-align:left;font-size:13px;line-height:1.4}
.pair .two button b{display:block;font-size:14.5px}
.pair .two .vs{flex:0 0 auto;align-self:center;font-family:Georgia,serif;color:var(--faint);font-size:13px}
.pair p{margin:0;font-size:14px;line-height:1.75;color:var(--soft)}
.up-src{font-size:12.5px;line-height:1.9;color:var(--faint)}
.up-src a{color:var(--soft)}

.edu{display:flex;gap:8px;align-items:flex-start;background:var(--gold-soft);border-radius:10px;padding:8px 11px;font-size:13.5px;line-height:1.65;margin-bottom:8px}
.edu i{font-style:normal}
.edu b{display:block;font-size:12px;color:var(--soft)}
.ktag{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 10px}
.ktag span{font-size:12px;border-radius:999px;padding:0 9px;background:var(--chip);color:var(--soft)}
.lesson{margin-top:10px;border-left:3px solid var(--gold);padding:4px 0 4px 11px;font-size:14.5px;line-height:1.8}
.lesson b{display:block;font-size:12px;color:var(--gold)}
.les{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:10px}
.les h3{margin:0;font-size:16.5px;display:flex;gap:8px;align-items:baseline}
.les h3 i{font-style:normal;font-family:Georgia,serif;color:var(--gold);font-size:18px}
.les .ob{margin:8px 0 0;font-size:14.5px;line-height:1.85}
.les .ob b,.les .my b{font-size:12px;color:var(--soft);margin-right:4px}
.les .my{margin:8px 0 0;font-size:14.5px;line-height:1.85;background:var(--gold-soft);border-radius:10px;padding:8px 11px}
.les .who2{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.les .who2 button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 10px;font-size:13px}
.etab{width:100%;border-collapse:collapse;font-size:13px;background:var(--paper);border-radius:12px;overflow:hidden}
.etab th{text-align:left;font-size:12px;color:var(--soft);font-weight:600;padding:7px 8px;background:var(--chip);position:sticky;top:0}
.etab td{padding:8px;border-top:1px solid var(--line);vertical-align:top;line-height:1.55}
.etab td:first-child{white-space:nowrap;font-weight:600}
.etab td small{display:block;font-weight:400;color:var(--faint);font-size:11.5px}
.etab tr{cursor:pointer}
.etab .k{display:inline-block;font-size:11px;background:var(--chip);border-radius:6px;padding:0 5px;margin:1px 2px 1px 0;color:var(--soft)}
.twrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
.twrap .etab{min-width:560px}
.cav{font-size:13px;color:var(--soft);background:var(--chip);border-radius:12px;padding:9px 12px;line-height:1.7;margin-top:6px}
/* ---------- 阿西莫夫 ---------- */
.as-hero{background:radial-gradient(1.5px 1.5px at 18% 30%,rgba(255,255,255,.8),transparent),radial-gradient(1px 1px at 72% 18%,rgba(255,255,255,.7),transparent),radial-gradient(1.5px 1.5px at 86% 62%,rgba(255,255,255,.6),transparent),radial-gradient(1px 1px at 40% 78%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 58% 44%,rgba(255,255,255,.6),transparent),radial-gradient(130% 120% at 100% 0%,#3B5A7A 0%,#152232 50%,#080D14 100%);color:#E6EEF6;border-radius:18px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.as-hero:after{content:"";position:absolute;right:-60px;bottom:-90px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(160,200,240,.18);box-shadow:0 0 0 26px rgba(160,200,240,.04),0 0 0 54px rgba(160,200,240,.03);pointer-events:none}
.as-hero h1{margin:0;font-size:28px;font-weight:800;letter-spacing:.02em;font-family:Georgia,"Iowan Old Style",serif}
.as-hero .sub{font-size:13px;opacity:.75}
.as-hero p{font-size:14px;opacity:.92;margin:10px 0 0;line-height:1.75}
.as-hero .bt{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.as-hero .bt button{border:1px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:999px;padding:5px 13px;font-size:13.5px}
.prog{display:flex;gap:4px;margin-top:12px}
.prog i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.15)}
.prog i.reading{background:#E2B85C}.prog i.done{background:#7FC8A9}
.prog-t{font-size:12px;opacity:.75;margin-top:5px}
.ord{display:flex;gap:6px;margin-bottom:6px}
.ord button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13.5px}
.ord button.on{background:#1F3A56;border-color:#1F3A56;color:#fff;font-weight:700}
.ord-why{font-size:13px;color:var(--soft);margin:0 2px 10px}
.bk{background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.bk .hd{display:flex;gap:12px;padding:12px 14px;cursor:pointer;align-items:flex-start}
.bk .spine{flex:0 0 40px;height:56px;border-radius:4px 8px 8px 4px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Georgia,serif;font-size:20px;font-weight:700;box-shadow:inset 4px 0 0 rgba(0,0,0,.25)}
.bk h3{margin:0;font-size:16.5px;font-family:Georgia,"Iowan Old Style",serif;line-height:1.3}
.bk .zh{font-size:13px;color:var(--soft)}
.bk .hk{font-size:13.5px;color:var(--soft);margin-top:4px;line-height:1.55}
.bk .st{margin-left:auto;flex:0 0 auto;font-size:11.5px;border-radius:999px;padding:1px 8px;white-space:nowrap}
.st.want{background:var(--chip);color:var(--soft)}.st.reading{background:var(--gold-soft);color:var(--gold)}.st.done{background:#DDF0E6;color:#1F6F4C}
@media (prefers-color-scheme: dark){.st.done{background:#173326;color:#7FC8A9}}
.bk .bd{display:none;padding:0 14px 14px}
.bk.on .bd{display:block}
.bk .meta{font-size:12.5px;color:var(--faint)}
.bk .ab{font-size:14.5px;line-height:1.85;margin:8px 0}
.bk .parts{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.bk .parts span{font-size:12px;background:var(--chip);border-radius:6px;padding:1px 8px;font-family:Georgia,serif}
.sts{display:flex;gap:6px;margin:10px 0}
.sts button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 0;font-size:13px;color:var(--soft)}
.sts button.on{border-color:#1F3A56;background:#1F3A56;color:#fff;font-weight:700}
.spl{border:1px dashed var(--accent);background:none;color:var(--accent);border-radius:10px;padding:7px 12px;font-size:13.5px;width:100%;margin-top:4px}
.voc{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.voc .vh{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:14.5px}
.voc .vh small{font-weight:400;font-size:12px;color:var(--faint)}
.voc .add{display:block;width:100%;margin:8px 0 6px;border:0;border-radius:12px;background:#1F3A56;color:#fff;font-weight:700;padding:10px;font-size:14.5px}
.voc .add:disabled{background:var(--chip);color:var(--soft)}
.vw{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.vw:last-child{border-bottom:0}
.vw div{flex:1;min-width:0}
.vw b{font-family:Georgia,serif;font-size:15.5px}
.vw .z{font-size:13px;color:var(--soft);margin-left:6px}
.vw .e{font-size:13px;color:var(--faint);line-height:1.5;margin-top:1px;font-style:italic}
.vw .in{flex:0 0 auto;font-size:11.5px;color:#1F6F4C;background:#DDF0E6;border-radius:999px;padding:0 7px;margin-top:3px}
@media (prefers-color-scheme: dark){.vw .in{background:#173326;color:#7FC8A9}}
.vw .say{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);border-radius:50%;width:30px;height:30px;font-size:13px;padding:0}
.ppl{display:grid;grid-template-columns:1fr;gap:8px}
.pp{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.pp b{font-family:Georgia,serif;font-size:15px}
.pp .z{font-size:12.5px;color:var(--soft);margin-left:6px}
.pp .d{font-size:13.5px;color:var(--soft);margin-top:3px;line-height:1.55}
.pp .bb{display:flex;gap:4px;margin-top:5px}
.pp .bb span{font-size:11px;border-radius:4px;padding:0 5px;color:#fff}
.cpt{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:4px 16px}
.cpt div{padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.7}
.cpt div:last-child{border-bottom:0}
.cpt b{font-size:15px}.cpt i{font-family:Georgia,serif;color:var(--faint);margin-left:6px;font-size:13px}
.tips2{background:var(--gold-soft);border-radius:16px;padding:6px 16px;margin:0}
.tips2 li{font-size:14px;margin:8px 0;line-height:1.7}
</style>

<body>
<div class="wrap">
  <header><a class="brand" href="./">⭐ 人物专栏</a></header>
  <div class="who" id="who"><button data-p="sushi">🖋️ 苏轼</button><button data-p="gm">🎤 G. Michael</button><button data-p="asimov">🚀 阿西莫夫</button><button data-p="up">📽️ 人生七年</button></div>
  <div id="view"><div class="empty">加载中…</div></div>
</div>
<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function jget(k, d) { try { var v = localStorage.getItem('ppl:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function jset(k, v) { try { localStorage.setItem('ppl:' + k, JSON.stringify(v)); } catch (e) { } }
  function getJSON(u, cb) { var x = new XMLHttpRequest(); x.open('GET', u + '?v=2'); x.onload = function () { var d = null; try { d = JSON.parse(x.responseText); } catch (e) { } cb(d); }; x.onerror = function () { cb(null); }; x.send(); }
  var HP = (location.hash || '').replace('#', '').split('/'), WHO = HP[0] || jget('who', 'sushi'), PEND = '', SS = null, GM = null;
  try { PEND = HP[1] ? decodeURIComponent(HP[1]) : ''; } catch (e) { }

  /* ====================== 苏轼 ====================== */
  var ROAD = [[1037, '眉山', '出生，四川', 0], [1057, '汴京', '与弟弟同榜进士', 0], [1061, '凤翔', '第一次做官', 0], [1071, '杭州', '通判，爱上西湖', 0], [1074, '密州', '「明月几时有」', 0], [1077, '徐州', '抗洪', 0], [1079, '湖州', '乌台诗案被捕', 1],
    [1080, '黄州', '贬居四年，号东坡', 1], [1086, '汴京', '回朝，官至翰林学士', 0], [1089, '杭州', '知州，修苏堤', 0], [1094, '惠州', '再贬岭南', 1], [1097, '儋州', '贬到海南', 1], [1101, '常州', '北归途中去世', 0]];
  var SK = jget('ssk', ''), OPEN = {}, MODE = {}, NOTE = {};
  function wiki(t) { return 'https://zh.wikisource.org/w/index.php?search=' + encodeURIComponent(t.replace(/（.*?）/g, '') + ' 苏轼'); }
  function annotate(w) {
    // 把注解词变成可点的下划线；长词优先，避免互相覆盖
    var notes = w.notes.slice().sort(function (a, b) { return b.w.length - a.w.length; });
    return w.text.map(function (line) {
      var parts = [{ s: line }];
      notes.forEach(function (n, ni) {
        var out = [];
        parts.forEach(function (p) {
          if (p.n != null) { out.push(p); return; }
          var i = p.s.indexOf(n.w);
          if (i < 0 || n._used) { out.push(p); return; }
          n._used = 1;
          if (i) out.push({ s: p.s.slice(0, i) });
          out.push({ s: n.w, n: w.notes.indexOf(n) });
          if (i + n.w.length < p.s.length) out.push({ s: p.s.slice(i + n.w.length) });
        });
        parts = out;
      });
      return parts.map(function (p) { return p.n != null ? '<span class="n' + (NOTE[w.id] === p.n ? ' act' : '') + '" data-n="' + p.n + '">' + esc(p.s) + '</span>' : esc(p.s); }).join('');
    }).join('<br>');
  }
  function workCard(w) {
    var on = OPEN[w.id], m = MODE[w.id] || 'tr';
    var h = '<div class="wk' + (on ? ' on' : '') + '" id="w-' + w.id + '"><div class="hd" data-w="' + w.id + '"><div class="tl"><h3>' + esc(w.title) + '</h3><span class="kind k-' + w.kind + '">' + w.kind + '</span></div>' +
      '<div class="mt">' + [w.year ? w.year + ' 年' : '年代不详', w.age != null ? w.age + ' 岁' : '', w.place].filter(function (x) { return x; }).join(' · ') + '</div>' +
      '<div class="why">' + esc(w.why) + '</div><span class="open">📜 点开阅读</span></div>';
    if (on) {
      w.notes.forEach(function (n) { delete n._used; });
      var inTitle = w.notes.filter(function (n) { return w.text.join('').indexOf(n.w) < 0; });
      h += '<div class="bd"><div class="poem' + (w.kind === '文' ? ' prose' : '') + '" data-w="' + w.id + '">' + annotate(w) + '</div>';
      if (NOTE[w.id] != null) { var nn = w.notes[NOTE[w.id]]; h += '<div class="pop"><b>' + esc(nn.w) + '</b>' + esc(nn.n) + '</div>'; }
      else h += '<div class="src" style="text-align:center;margin:0 0 6px">点带下划线的字词看注解</div>';
      if (inTitle.length) h += '<div class="src">题目里的：' + inTitle.map(function (n) { return '<b>' + esc(n.w) + '</b>：' + esc(n.n); }).join('　') + '</div>';
      h += '<div class="tg2" data-w="' + w.id + '"><button data-m="tr" class="' + (m === 'tr' ? 'on' : '') + '">白话翻译</button><button data-m="bg" class="' + (m === 'bg' ? 'on' : '') + '">写作背景</button><button data-m="all" class="' + (m === 'all' ? 'on' : '') + '">都看</button><button data-m="none" class="' + (m === 'none' ? 'on' : '') + '">只读原文</button></div>';
      if (m === 'tr' || m === 'all') h += '<div class="box tr"><h4>白话</h4>' + esc(w.trans) + '</div>';
      if (m === 'bg' || m === 'all') h += '<div class="box bg"><h4>背景</h4>' + esc(w.bg) + '</div>';
      h += '<div class="src">标签：' + w.tags.map(esc).join(' · ') + '　·　<a href="' + wiki(w.title) + '" target="_blank" rel="noopener">维基文库查原文和异文</a></div></div>';
    }
    return h + '</div>';
  }
  function renderSushi() {
    var all = SS, kinds = { 词: 0, 诗: 0, 文: 0 };
    all.forEach(function (w) { kinds[w.kind]++; });
    var list = all.filter(function (w) { return !SK || (SK.length === 1 ? w.kind === SK : w.place.indexOf(SK) >= 0); });
    var h = '<div class="ss-hero"><h1>苏轼<span class="seal">東坡</span></h1><div class="sub">1037–1101 · 字子瞻，号东坡居士 · 北宋</div>' +
      '<p>诗、词、文、书、画样样一流，美食家，水利工程师，一辈子被贬三次，越贬越远，却越活越通透。他把最苦的日子过成了最好的作品。</p>' +
      '<div class="bt"><button id="rnd">🎲 今天读一首</button><a href="kb.html#su-shi">📖 他的一生（长文）</a></div></div>';
    h += '<div class="road">' + ROAD.map(function (r) { return '<div class="stop' + (r[3] ? ' low' : '') + '"><i></i><b>' + r[1] + '</b><small>' + r[0] + '<br>' + r[2] + '</small></div>'; }).join('') + '</div>';
    h += '<div class="sec">作品<small>红点是人生低谷 · ' + all.length + ' 篇</small></div>';
    var places = ['黄州', '杭州', '惠州', '密州'];
    h += '<div class="chips" id="ssk"><button data-k="" class="' + (SK ? '' : 'on') + '">全部<small>' + all.length + '</small></button>' +
      ['词', '诗', '文'].map(function (k) { return '<button data-k="' + k + '" class="' + (SK === k ? 'on' : '') + '">' + k + '<small>' + kinds[k] + '</small></button>'; }).join('') +
      places.map(function (p) { var n = all.filter(function (w) { return w.place.indexOf(p) >= 0; }).length; return n ? '<button data-k="' + p + '" class="' + (SK === p ? 'on' : '') + '">' + p + '<small>' + n + '</small></button>' : ''; }).join('') + '</div>';
    h += list.map(workCard).join('') || '<div class="empty">这一类还没有</div>';
    h += '<div class="foot">原文据通行版本，个别字句各版本略有不同。<br>注解和白话是为了帮助理解写的，不求字字对应。</div>';
    $('view').innerHTML = h;
  }
  function onSushi(e) {
    var t = e.target, el;
    if (t.id === 'rnd') { var w = SS[Math.floor(Math.random() * SS.length)]; SK = ''; OPEN = {}; OPEN[w.id] = 1; renderSushi(); $('w-' + w.id).scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    if ((el = t.closest('#ssk [data-k]'))) { SK = el.getAttribute('data-k'); jset('ssk', SK); renderSushi(); return; }
    if ((el = t.closest('.n'))) { var id = el.closest('.poem').getAttribute('data-w'), n = +el.getAttribute('data-n'); NOTE[id] = NOTE[id] === n ? null : n; redraw(id); return; }
    if ((el = t.closest('.tg2 [data-m]'))) { var wid = el.parentNode.getAttribute('data-w'); MODE[wid] = el.getAttribute('data-m'); jset('ssmode', el.getAttribute('data-m')); redraw(wid); return; }
    if ((el = t.closest('.hd[data-w]'))) { var k = el.getAttribute('data-w'); OPEN[k] = !OPEN[k]; if (OPEN[k] && !MODE[k]) MODE[k] = jget('ssmode', 'tr'); redraw(k); }
  }
  function redraw(id) {
    var w = null; SS.forEach(function (x) { if (x.id === id) w = x; });
    var old = $('w-' + id); if (!old || !w) return;
    var tmp = document.createElement('div'); tmp.innerHTML = workCard(w); old.parentNode.replaceChild(tmp.firstChild, old);
  }

  /* ====================== George Michael ====================== */
  var ERA = jget('gmera', ''), SO = {}, COLORS = ['#B23A48', '#2C2F6B', '#1F6F5C', '#8C5A1F', '#4B2A6B', '#245A8C', '#7A2E2E', '#3C4A2A', '#6B2C55', '#1F4F6F', '#5A4A1F', '#333'];
  function q(t) { return encodeURIComponent('George Michael ' + t.replace(/\s*\(.*?\)\s*/g, ' ')); }
  function eraOf(s) { return s.year < 1987 ? 'wham' : s.year < 1990 ? '80' : s.year < 2000 ? '90' : '00'; }
  function songCard(s) {
    var on = SO[s.id];
    return '<div class="sg' + (on ? ' on' : '') + '" id="g-' + s.id + '"><div class="hd" data-s="' + s.id + '"><div class="disc"></div><div><h3>' + esc(s.title) + '</h3><div class="mt">' + s.year + ' · ' + esc(s.album) + '</div></div></div>' +
      (on ? '<div class="bd"><div class="row"><b>背后的故事</b>' + esc(s.story) + '</div><div class="row"><b>这首歌在讲什么</b>' + esc(s.about) + '</div><div class="row"><b>听的时候注意</b>' + esc(s.listen) + '</div>' +
        '<div class="mood">' + (s.mood || []).map(function (m) { return '<span>' + esc(m) + '</span>'; }).join('') + '</div>' +
        '<div class="go"><a class="yt" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=' + q(s.title) + '">▶ YouTube</a><a class="sp" target="_blank" rel="noopener" href="https://open.spotify.com/search/' + q(s.title) + '">Spotify</a><a class="am" target="_blank" rel="noopener" href="https://music.apple.com/us/search?term=' + q(s.title) + '">Apple Music</a></div></div>' : '') + '</div>';
  }
  function renderGM() {
    var g = GM, eras = [['', '全部'], ['wham', 'Wham! 时期'], ['80', '80 年代单飞'], ['90', '90 年代'], ['00', '2000 年后']];
    var h = '<div class="gm-hero"><h1>George Michael</h1><div class="sub">1963–2016 · 歌手、词曲作者、制作人</div>' +
      '<p>从 Wham! 的阳光少年，到 Faith 的世界巨星，再到 Older 里那个把心碎唱成歌的人。他的大部分作品是自己写、自己编、自己制作的。</p>' +
      '<div class="bt"><button id="bioB">📖 他的故事</button><button id="gmRnd">🎲 随机来一首</button></div></div>';
    h += '<div class="bio" id="bio" hidden>' + g.bio.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div>';
    h += '<div class="sec">🎧 入门听歌路线<small>按这个顺序听一遍</small></div><div class="path">' + g.start.map(function (t) {
      var s = null; g.songs.forEach(function (x) { if (x.title === t) s = x; });
      return '<button data-go="' + (s ? s.id : '') + '">' + esc(t) + '<small>' + (s ? s.year : '') + '</small></button>';
    }).join('') + '</div>';
    h += '<div class="sec">💿 专辑<small>左右滑</small></div><div class="albums">' + g.albums.map(function (a, i) {
      return '<div class="al"><div class="cv" style="background:linear-gradient(135deg,' + COLORS[i % COLORS.length] + ',#111)">' + esc(a.title) + '</div><div class="yr">' + a.year + ' · ' + esc(a.by) + '</div><p>' + esc(a.why) + '</p>' +
        '<div class="ls">先听：' + a.listen.map(function (t) { return '<a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=' + q(t) + '">' + esc(t) + '</a>'; }).join('') + '</div>' + (a.note ? '<div class="nt">💡 ' + esc(a.note) + '</div>' : '') + '</div>';
    }).join('') + '</div>';
    var list = g.songs.filter(function (s) { return !ERA || eraOf(s) === ERA; });
    h += '<div class="sec">🎵 歌曲故事<small>' + g.songs.length + ' 首 · 点开看</small></div><div class="chips" id="era">' + eras.map(function (e) { var n = e[0] ? g.songs.filter(function (s) { return eraOf(s) === e[0]; }).length : g.songs.length; return '<button data-e="' + e[0] + '" class="' + (ERA === e[0] ? 'on' : '') + '">' + e[1] + '<small>' + n + '</small></button>'; }).join('') + '</div>';
    h += list.map(songCard).join('');
    h += '<div class="sec">📅 时间线</div><div class="tl2">' + g.timeline.map(function (t) { return '<div><b>' + t.y + '</b>' + esc(t.t) + '</div>'; }).join('') + '</div>';
    h += '<div class="sec">✨ 冷知识</div><div class="facts">' + g.facts.map(function (f) { return '<div>' + esc(f) + '</div>'; }).join('') + '</div>';
    h += '<div class="foot">歌词版权属于原作者，这里不收录歌词；点按钮去正版平台听。<br>资料整理自公开报道，难免有出入。</div>';
    $('view').innerHTML = h;
  }
  function openSong(id) { if (!id) return; ERA = ''; SO = {}; SO[id] = 1; renderGM(); var el = $('g-' + id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  function onGM(e) {
    var t = e.target, el;
    if (t.id === 'bioB') { $('bio').hidden = !$('bio').hidden; return; }
    if (t.id === 'gmRnd') { openSong(GM.songs[Math.floor(Math.random() * GM.songs.length)].id); return; }
    if ((el = t.closest('[data-go]'))) { openSong(el.getAttribute('data-go')); return; }

    if ((el = t.closest('[data-upi]'))) { UPI = +el.getAttribute('data-upi'); renderUp(); return; }
    if ((el = t.closest('#upChips [data-g]'))) { UPG = el.getAttribute('data-g'); var y = window.scrollY; renderUp(); window.scrollTo(0, y); return; }
    if ((el = t.closest('#upKeys [data-k]'))) { UPK = el.getAttribute('data-k'); var y3 = window.scrollY; renderUp(); window.scrollTo(0, y3); return; }
    if ((el = t.closest('[data-go]'))) { upOpen(el.getAttribute('data-go')); return; }
    if ((el = t.closest('.fr[data-seen]'))) { jset('upSeen-' + UPS, +el.getAttribute('data-seen')); var y2 = window.scrollY; renderUp(); window.scrollTo(0, y2); return; }
    if ((el = t.closest('[data-pc]'))) { var k = el.getAttribute('data-pc'); UPO[k] = !UPO[k]; var c = $('up-' + k); if (c) c.className = 'pc' + (UPO[k] ? ' on' : ''); }
  }
  document.addEventListener('change', function (e) { if (e.target && e.target.id === 'upSpo') { jset('upSeen-' + UPS, +e.target.value); var y = window.scrollY; renderUp(); window.scrollTo(0, y); } });

  /* ====================== 切换 ====================== */
  function goPend() {   // 从全站搜索跳过来：#sushi/<id> 或 #gm/<id>
    if (!PEND) return;
    var id = PEND; PEND = '';
    if (WHO === 'gm') { openSong(id); return; }
    if (WHO === 'asimov') { openBook(id); return; }
    if (WHO === 'up') { upOpen(id); return; }
    SK = ''; OPEN = {}; OPEN[id] = 1; renderSushi();
    var el = $('w-' + id); if (el) el.scrollIntoView({ block: 'start' });
  }
  function show(p) {
    if (p !== 'gm' && p !== 'asimov' && p !== 'up') p = 'sushi';
    WHO = p; jset('who', p); history.replaceState(null, '', '#' + p);
    var bs = $('who').querySelectorAll('button'), i; for (i = 0; i < bs.length; i++) bs[i].className = bs[i].getAttribute('data-p') === p ? 'on' : '';
    document.title = (p === 'gm' ? 'George Michael' : p === 'asimov' ? '阿西莫夫' : p === 'up' ? '人生七年' : '苏轼') + ' · 人物专栏';
    if (p === 'sushi') {
      if (SS) { renderSushi(); goPend(); }
      else { var left = 2, parts = {}; ['sushi_a', 'sushi_b'].forEach(function (f) { getJSON('people/' + f + '.json', function (d) { parts[f] = d ? d.items : []; if (--left) return; SS = parts.sushi_a.concat(parts.sushi_b); SS.sort(function (a, b) { return (a.year || 9999) - (b.year || 9999); }); if (WHO === 'sushi') { renderSushi(); goPend(); } }); }); }
    } else if (p === 'up') {
      if (UP) { renderUp(); goPend(); } else getJSON('people/up.json', function (d) { UP = d; if (WHO === 'up') { if (UP) { renderUp(); goPend(); } else $('view').innerHTML = '<div class="empty">加载失败</div>'; } });
    } else if (p === 'asimov') {
      if (AS) { renderAsimov(); goPend(); } else getJSON('people/asimov.json', function (d) { AS = d; if (WHO === 'asimov') { if (AS) { renderAsimov(); goPend(); } else $('view').innerHTML = '<div class="empty">加载失败</div>'; } });
    } else {
      if (GM) { renderGM(); goPend(); } else getJSON('people/gm.json', function (d) { GM = d; if (WHO === 'gm') { if (GM) { renderGM(); goPend(); } else $('view').innerHTML = '<div class="empty">加载失败</div>'; } });
    }
  }
  $('who').onclick = function (e) { var b = e.target.closest('[data-p]'); if (b) { window.scrollTo(0, 0); show(b.getAttribute('data-p')); } };
  $('view').onclick = function (e) { if (WHO === 'gm') onGM(e); else if (WHO === 'asimov') onAsimov(e); else if (WHO === 'up') onUp(e); else onSushi(e); };
  // 从语境词库回来时刷新「在学 / 会了」标记
  document.addEventListener('visibilitychange', function () { if (!document.hidden && WHO === 'asimov' && AS) { var y = window.scrollY; renderAsimov(); window.scrollTo(0, y); } });
  show(WHO);
})();
</script>
