<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="wide.css?v=1">
<script src="theme.js?v=1"></script>
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3A4250">
<title>湾区生活 · 旧金山</title>
<style>
:root{
  --bg:#F2F1EE; --paper:#FFFFFF; --ink:#1E2228; --soft:#5E6670; --faint:#9AA1A9; --line:#E1DFDA; --chip:#ECEAE5;
  --or:#C0362C; --or-soft:#F7E2DF; --bay:#2F6F8F; --bay-soft:#DDEBF2;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(30,40,60,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171B; --paper:#1C2026; --ink:#E8EBEE; --soft:#A9B1BA; --faint:#6E767F; --line:#2C3139; --chip:#262B32;
  --or:#F07563; --or-soft:#3A221F; --bay:#7FB8D6; --bay-soft:#1B2C36; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#14171B; --paper:#1C2026; --ink:#E8EBEE; --soft:#A9B1BA; --faint:#6E767F; --line:#2C3139; --chip:#262B32;
  --or:#F07563; --or-soft:#3A221F; --bay:#7FB8D6; --bay-soft:#1B2C36; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;font-size:15px;line-height:1.6;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.hero{position:relative;overflow:hidden;color:#F4F1EC;background:linear-gradient(175deg,#56606E 0%,#3A4250 45%,#232933 100%);padding:calc(16px + env(safe-area-inset-top)) 0 18px}
.hero:after{content:"";position:absolute;left:-10%;right:-10%;bottom:-30px;height:90px;background:radial-gradient(60% 60% at 30% 40%,rgba(255,255,255,.18),transparent 70%),radial-gradient(50% 60% at 75% 50%,rgba(255,255,255,.14),transparent 70%);pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.city{display:flex;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none;gap:0;margin:8px 0 0;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:2px}
.city a{color:#F4F1EC;text-decoration:none;font-size:12.5px;padding:3px 7px;white-space:nowrap;border-radius:999px;opacity:.8}
.city a.on{background:rgba(255,255,255,.92);color:#222;opacity:1;font-weight:600}
.hero a.home{color:#F4F1EC;text-decoration:none;font-size:13px;opacity:.75}
.hero h1{font-family:"Songti SC","STSong","Noto Serif SC",Georgia,serif;font-size:28px;margin:6px 0 0;letter-spacing:.04em}
.hero h1 small{font-family:Georgia,serif;font-size:14px;font-weight:400;opacity:.75;margin-left:8px;letter-spacing:.08em}
.bridge{display:block;width:100%;height:46px;margin:6px 0 2px}
.hero p{margin:6px 0 0;font-size:13.5px;opacity:.88;line-height:1.65}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.facts span{font-size:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:2px 9px}
.facts b{font-weight:600;margin-right:4px;opacity:.75}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:8px;padding-bottom:8px}
.tabs .wrap::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:0;background:none;border-radius:999px;padding:6px 12px;font-size:14px;color:var(--soft)}
.tabs button.on{background:var(--ink);color:var(--paper)}
.srch{margin:12px 0 4px;display:flex;gap:8px}
.srch input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 12px;font-size:16px;outline:none}
.srch button{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:0 12px;font-size:14px;white-space:nowrap}
.lead{font-size:13px;color:var(--faint);margin:10px 2px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.card .hd{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;cursor:pointer}
.card .em{font-size:26px;line-height:1.15;flex:0 0 32px;text-align:center}
.card .ti{flex:1;min-width:0}
.card h3{margin:0;font-size:16px;line-height:1.35}
.card h3 small{font-weight:400;color:var(--faint);font-size:12.5px;margin-left:6px}
.card .s{font-size:13.5px;color:var(--soft);margin-top:2px;line-height:1.55}
.card .tg{margin-top:5px}
.card .tg span{display:inline-block;font-size:11.5px;font-weight:600;padding:0 7px;border-radius:6px;margin:0 4px 3px 0;background:var(--chip);color:var(--soft)}
.card .tg span.hot{background:var(--or-soft);color:var(--or)}
.card .ar{color:var(--faint);font-size:13px;flex:0 0 auto;margin-top:2px;transition:transform .15s}
.card.open .ar{transform:rotate(180deg)}
.card .bd{display:none;padding:0 14px 14px 58px;font-size:14.5px;line-height:1.75}
.card.open .bd{display:block}
.card .bd p{margin:0 0 8px}
.card .bd h4{font-size:12.5px;color:var(--faint);margin:10px 0 2px;letter-spacing:.04em}
.card .bd ul{margin:2px 0 6px;padding-left:18px}
.card .bd .tip{background:var(--bay-soft);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:13.5px;margin-top:8px}
.card .bd .tip b{color:var(--bay)}
.card .bd .warn{background:var(--or-soft)}
.card .bd .warn b{color:var(--or)}
.yr{font-family:Georgia,serif;color:var(--or);font-size:12.5px;font-weight:700}
.want{border:1px solid var(--line);background:none;border-radius:999px;font-size:12.5px;padding:2px 10px;margin-top:6px;color:var(--soft)}
.want.on{border-color:var(--or);color:var(--or);background:var(--or-soft)}
.triv{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:6px 14px;box-shadow:var(--shadow)}
.triv div{font-size:14px;line-height:1.65;padding:8px 0;border-top:1px dashed var(--line)}
.triv div:first-child{border-top:0}
.pop{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,520px);background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.25);padding:14px 16px;z-index:30;font-size:14.5px;line-height:1.7}
.pop b{display:block;margin-bottom:4px}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:18px;color:var(--faint)}
.pop .go{margin-top:8px;border:0;background:var(--ink);color:var(--paper);border-radius:10px;padding:5px 12px;font-size:13.5px}
.mtabs{display:flex;gap:6px;margin:4px 0 8px;flex-wrap:wrap}
.mtabs button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13.5px;color:var(--soft)}
.mtabs button.on{border-color:var(--or);color:var(--or);background:var(--or-soft);font-weight:600}
.mapbox{position:relative;isolation:isolate;z-index:0;height:72vh;min-height:360px;background:#FBFAF7;border:1px solid var(--line);border-radius:16px;overflow:hidden;touch-action:none;cursor:grab;box-shadow:var(--shadow)}
.mapbox:fullscreen{border-radius:0;height:100vh}
.mapbox img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;pointer-events:none;max-width:none}
.mctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.mctl button{width:40px;height:40px;border-radius:12px;border:1px solid #ccc;background:rgba(255,255,255,.95);color:#222;font-size:19px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.stl span{white-space:nowrap;font:600 11.5px/1 -apple-system,"PingFang SC",sans-serif;color:#222;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.stl.big span{font-size:12.5px;font-weight:700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stl span{color:#eee;text-shadow:0 0 3px #000,0 0 3px #000,0 0 3px #000}}
.leaflet-container{font:inherit}
.ferm span{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:#E3F1FA;border:2px solid #1F6FB2;box-shadow:0 2px 6px rgba(0,0,0,.35);font-size:15px}
.lhd{margin:6px 2px 4px;font-size:16px}.lhd small{color:var(--soft);font-size:13px}.lhd span{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.ldir{font-size:13px;font-weight:700;color:var(--soft);margin:12px 2px 6px}
.ltab{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow i{width:10px;align-self:stretch;border-radius:5px;flex:0 0 10px;border:1px solid rgba(0,0,0,.15)}
.lrow .ld{flex:1;min-width:0}.lrow .ld b{font-size:15.5px}.lrow .ld small{display:block;color:var(--faint);font-size:12px}
.lrow .lm{font-size:13px;color:var(--soft);white-space:nowrap}.lrow .lm b{font-size:22px;font-family:Georgia,serif;color:var(--ink)}
.lrow .lm b.now{font-size:14px;font-family:inherit;color:var(--or)}
.lrow.soon{background:var(--or-soft)}
.fop{font-size:12.5px;color:var(--faint);margin:8px 2px 2px;font-weight:600}
.fsel{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:15px}
.ftab{overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;max-height:65vh;box-shadow:var(--shadow)}
.ftab table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
.ftab th{position:sticky;top:0;background:var(--paper);text-align:left;font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);z-index:1}
.ftab th small{display:block;font-weight:400;color:var(--faint);font-size:11px}
.ftab td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.ftab tr.past td{color:var(--faint)}
.ftab tr.nx td{background:var(--or-soft);font-weight:700}
.ftab td.dur{color:var(--faint);font-size:12.5px;font-weight:400}
.ftab td.dur b{display:block;color:var(--or);font-size:12.5px}
.tipm span{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#FFF8E1;border:2px solid #E0A100;box-shadow:0 2px 6px rgba(0,0,0,.35);font-size:16px}
.tipm.w span{background:#FDECEA;border-color:#C0362C}
.tipp{font-size:13.5px;line-height:1.65}
.tipp > b{display:block;font-size:14px;margin-bottom:4px}
#lmap.sat .leaflet-overlay-pane svg{filter:drop-shadow(0 0 1.5px rgba(255,255,255,.9))}
#lmap.sat .stl span,#lmap.sat .stl span{color:#fff;text-shadow:0 0 3px #000,0 0 3px #000,0 1px 4px #000}
.rsum{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px;margin-bottom:8px}
.rs-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px;margin-bottom:4px}.rs-h small{color:var(--faint);font-size:12px}
.rs-r{display:grid;grid-template-columns:12px auto 1fr;gap:2px 8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);cursor:pointer}
.rs-r i{width:12px;height:12px;border-radius:6px}.rs-r b{font-size:15px}.rs-l{font-size:13px;font-weight:700;justify-self:end}
.rs-r small{grid-column:2/4;color:var(--soft);font-size:12.5px;line-height:1.5}.rs-r small b{font-size:12.5px;color:var(--ink)}
.rs-n{font-size:12.5px;color:var(--soft);background:var(--bay-soft);border-radius:10px;padding:7px 9px;margin-top:6px;line-height:1.6}
.rdi{display:flex!important;align-items:center;justify-content:center;font-size:15px;border-radius:50%;background:#fff;border:2px solid #888;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.rdi.rd-inc{border-color:#D33A2C;background:#FDECEA}.rdi.rd-inc2{border-color:#E0A100;background:#FFF8E1;font-size:12px}
.rdi.rd-full{border-color:#C0362C;font-size:13px}.rdi.rd-lane{border-color:#E07B00;font-size:13px}.rdi.rd-ramp{border-color:#BBB;font-size:10px;opacity:.85}
.rdi.rd-cms{border-color:#999;font-size:10px;opacity:.8}.rdi.rd-tt{border:0;background:none;box-shadow:none}
.rdi.rd-tt b{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;color:#fff;font:700 12px/1 -apple-system,sans-serif;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.rd-sign{background:#111;color:#F6C445;font:600 12px/1.5 ui-monospace,Menlo,monospace;border-radius:6px;padding:6px 8px;margin:4px 0 6px;letter-spacing:.04em}
.rsh span{display:flex;align-items:center;justify-content:center;height:20px;min-width:30px;padding:0 4px;border-radius:5px;font:700 11px/1 -apple-system,sans-serif;color:#fff;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.rsh.si span{background:#3F51B5}.rsh.su span{background:#7B4BB7}.rsh.ss span{background:#2C8C99;border-radius:10px}
.rkey{margin:10px 2px 0;font-size:13.5px}.rkey summary{cursor:pointer;color:var(--bay);font-weight:600}
[hidden]{display:none!important}
.mnote{font-size:12.5px;color:var(--faint);margin:8px 2px;line-height:1.7}
.mnote a{color:var(--bay)}
.gift{margin-bottom:14px}
.gbox{width:100%;border:2px dashed var(--or);background:var(--or-soft);border-radius:20px;padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.gbox .gb{font-size:56px;animation:wob 1.6s ease-in-out infinite}
.gbox b{font-size:17px}.gbox small{color:var(--soft)}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg) scale(1.05)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(3deg)}}
.gcard{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);animation:flip .6s ease}
@keyframes flip{from{transform:perspective(800px) rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
.gh{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.gh span{font-size:40px}.gh b{display:block;font-size:17px}.gh small{color:var(--soft);font-size:13px}
.gtl{list-style:none;margin:6px 0 0;padding:0;border-left:2px solid var(--or-soft);margin-left:22px}
.gtl li{display:flex;gap:10px;position:relative;padding:6px 0 10px 14px}
.gtl li:before{content:"";position:absolute;left:-7px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--or)}
.gtl i{font-style:normal;font-family:Georgia,serif;font-weight:700;color:var(--or);font-size:13px;min-width:44px;padding-top:1px}
.gtl b{display:block;font-size:15px}.gtl p{margin:2px 0;font-size:13.5px;color:var(--soft);line-height:1.6}.gtl small{font-size:12.5px;color:var(--bay)}
.gact{display:flex;gap:8px;margin-top:6px}
.gact button{flex:1;border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:9px;font-size:14px}
.gact button:first-child{background:var(--or);color:#fff;border-color:var(--or)}
.pass{background:linear-gradient(160deg,#1F3A5F,#16263D);color:#EEE7D7;border-radius:20px;padding:14px 14px 10px;box-shadow:var(--shadow)}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ph b{font-size:17px;letter-spacing:.04em}.ph small{display:block;font-size:12px;opacity:.7}
.pt{text-align:right;font-weight:700;font-size:14px;color:#F2C46D}.pt small{display:block;opacity:.75;color:#EEE7D7;font-weight:400}
.pbar{height:6px;background:rgba(255,255,255,.15);border-radius:3px;margin:10px 0 12px;overflow:hidden}.pbar i{display:block;height:100%;background:#F2C46D;border-radius:3px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;justify-items:center}
.st{position:relative;border:1.5px dashed rgba(238,231,215,.35);background:none;border-radius:50%;width:78px;height:78px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#EEE7D7;padding:4px;overflow:hidden}
.st span{font-size:22px;filter:grayscale(1);opacity:.45}
.st em{font-style:normal;font-size:10px;line-height:1.2;opacity:.6;text-align:center;max-height:2.4em;overflow:hidden}
.st.on{border:2.5px solid #E0573F;background:rgba(224,87,63,.14);transform:rotate(-8deg)}
.st.on span{filter:none;opacity:1}.st.on em{opacity:1;color:#FFD9CF}
.st u{text-decoration:none;font-size:9.5px;color:#F2C46D;font-family:Georgia,serif}
.st.stp{animation:stamp .35s ease}
@keyframes stamp{0%{transform:scale(1.3) rotate(-20deg);opacity:0}100%{transform:rotate(-8deg);opacity:1}}
.pass .mnote{color:rgba(238,231,215,.6)}
.ttl{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:#1F3A5F;color:#F2C46D;font-weight:700;font-size:18px;padding:14px 22px;border-radius:16px;z-index:100;box-shadow:0 10px 40px rgba(0,0,0,.35);animation:flip .5s ease}
.conf{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.conf i{position:absolute;top:-30px;font-style:normal;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.foot{font-size:12px;color:var(--faint);margin-top:18px;line-height:1.8}
.foot a{color:var(--bay)}
.empty{color:var(--faint);text-align:center;padding:30px 0}
mark{background:var(--or-soft);color:inherit;border-radius:3px}
</style>
</head>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

    labels();
  }
  function mapInit() {
    if (MAP === 'ferry') { ferryLoad(ferryRender); bindFerry(); return; }
    if (MAP === 'live') { liveInit(); return; }
    if (MAP === 'road') { $('mtabs').onclick = function (e) { var b = e.target.closest('[data-m]'); if (!b) return; MAP = b.getAttribute('data-m'); ls('map', MAP); render(); }; if (window.BayRoad) BayRoad.init({ loadLeaflet: loadLeaflet, rerender: render, center: [37.62, -122.2], zoom: 9 }); return; }
    if (MAP === 'real' || !$('mbox')) { realInit(); return; }
    var box = $('mbox'), img = $('mimg'), st = { s: 1, x: 0, y: 0, min: .2 }, pts = {}, last = null;
    function apply() { img.style.transform = 'translate(' + st.x + 'px,' + st.y + 'px) scale(' + st.s + ')'; }
    function fit() {
      var bw = box.clientWidth, bh = box.clientHeight, iw = img.naturalWidth || 1000, ih = img.naturalHeight || 1000;
      st.s = Math.min(bw / iw, bh / ih); st.min = st.s * .8; st.x = (bw - iw * st.s) / 2; st.y = (bh - ih * st.s) / 2; apply();
    }
    function zoom(f, cx, cy) {
      var ns = Math.max(st.min, Math.min(st.s * f, 6));
      if (cx == null) { cx = box.clientWidth / 2; cy = box.clientHeight / 2; }
      st.x = cx - (cx - st.x) * ns / st.s; st.y = cy - (cy - st.y) * ns / st.s; st.s = ns; apply();
    }
    img.onload = fit; if (img.complete) fit();
    function rel(e) { var r = box.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
    box.addEventListener('pointerdown', function (e) { if (e.target.closest('.mctl')) return; box.setPointerCapture(e.pointerId); pts[e.pointerId] = rel(e); last = null; });
    box.addEventListener('pointermove', function (e) {
      if (!pts[e.pointerId]) return;
      var p = rel(e), ids = Object.keys(pts);
      if (ids.length === 1) { st.x += p[0] - pts[e.pointerId][0]; st.y += p[1] - pts[e.pointerId][1]; pts[e.pointerId] = p; apply(); return; }
      pts[e.pointerId] = p;
      var a = pts[ids[0]], b = pts[ids[1]], d = Math.hypot(a[0] - b[0], a[1] - b[1]), c = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      if (last) { zoom(d / last.d, c[0], c[1]); st.x += c[0] - last.c[0]; st.y += c[1] - last.c[1]; apply(); }
      last = { d: d, c: c };
    });
    function up(e) { delete pts[e.pointerId]; last = null; }
    box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
    box.addEventListener('wheel', function (e) { e.preventDefault(); var p = rel(e); zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, p[0], p[1]); }, { passive: false });
    box.addEventListener('dblclick', function (e) { var p = rel(e); zoom(2, p[0], p[1]); });
    $('mzi').onclick = function () { zoom(1.4); }; $('mzo').onclick = function () { zoom(1 / 1.4); }; $('mzr').onclick = fit;
    $('mfs').onclick = function () { try { if (document.fullscreenElement) document.exitFullscreen(); else box.requestFullscreen(); } catch (er) { } };
    document.addEventListener('fullscreenchange', function () { setTimeout(fit, 120); });
    $('mtabs').onclick = function (e) { var b = e.target.closest('[data-m]'); if (!b) return; MAP = b.getAttribute('data-m'); ls('map', MAP); render(); };
  }
  function setTab(t) { TAB = t; ls('tab', t); Q = ''; $('q').value = ''; history.replaceState(null, '', '#' + t); render(); window.scrollTo(0, Math.min(window.scrollY, $('tabs').offsetTop)); }

  $('tabs').onclick = function (e) { var b = e.target.closest('[data-t]'); if (b) setTab(b.getAttribute('data-t')); };
  $('list').onclick = function (e) {
    var w = e.target.closest('[data-w]');
    if (w) { var k = w.getAttribute('data-w'); WANT[k] = !WANT[k]; if (!WANT[k]) delete WANT[k]; ls('want', WANT); var y = window.scrollY; render(); window.scrollTo(0, y); return; }
    var hd = e.target.closest('.hd'); if (!hd) return;
    var c = hd.parentNode, ck = c.getAttribute('data-k'); OPEN[ck] = !c.classList.contains('open'); c.classList.toggle('open', OPEN[ck]);
  };
  var qt = 0;
  $('q').oninput = function () { clearTimeout(qt); var v = this.value.trim(); qt = setTimeout(function () { Q = v; render(); }, 200); };
  $('rnd').onclick = function () {
    var pool = [];
    D.stories.forEach(function (x) { pool.push(['stories', x]); });
    D.trivia.forEach(function (x) { pool.push(['trivia', x]); });
    D.fun.forEach(function (x) { pool.push(['fun', x]); });
    var p = pool[Math.floor(Math.random() * pool.length)], old = document.querySelector('.pop'); if (old) old.parentNode.removeChild(old);
    var el = document.createElement('div'); el.className = 'pop';
    el.innerHTML = '<button class="x">×</button>' + (p[0] === 'trivia' ? '<b>💡 冷知识</b>' + esc(p[1]) : '<b>' + p[1].e + ' ' + esc(p[1].t) + '</b>' + esc(p[1].s) + '<br><button class="go">看全文</button>');
    document.body.appendChild(el);
    el.onclick = function (ev) {
      if (ev.target.closest('.x')) { el.parentNode.removeChild(el); return; }
      if (ev.target.closest('.go')) { el.parentNode.removeChild(el); OPEN[key(p[0], p[1])] = true; setTab(p[0]); var c = document.querySelector('[data-k="' + key(p[0], p[1]).replace(/"/g, '\\"') + '"]'); if (c) c.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
    };
  };

  var x = new XMLHttpRequest();
  x.open('GET', 'sf/data.json?t=' + Math.floor(Date.now() / 36e5));
  x.onload = function () {
    try { D = JSON.parse(x.responseText); } catch (e) { $('list').innerHTML = '<div class="empty">加载失败</div>'; return; }
    var showIntro = function (all) { $('intro').innerHTML = (all ? D.intro.map(esc).join('<br><br>') : esc(D.intro[0])) + ' <a href="#" id="more" style="color:#F4B8A8">' + (all ? '收起' : '更多 ›') + '</a>'; $('more').onclick = function (e) { e.preventDefault(); showIntro(!all); }; };
    showIntro(false);
    $('facts').innerHTML = D.facts.map(function (f) { return '<span><b>' + esc(f[0]) + '</b>' + esc(f[1]) + '</span>'; }).join('');
    $('foot').innerHTML = '内容依据旧金山旅游局、市政府、国家公园管理局、天使岛移民站基金会、FoundSF 等公开资料整理。票价、营业时间、规定会变，去之前查一下官网。<br>' +
      D.sources.map(function (s) { return '<a href="' + esc(s[1]) + '" target="_blank" rel="noopener">' + esc(s[0]) + '</a>'; }).join(' · ');
    render();
  };
  x.onerror = function () { $('list').innerHTML = '<div class="empty">网络错误，稍后刷新</div>'; };
  x.send();
})();
</script>
