.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}

.ups td{padding:5px 4px;border-bottom:1px solid var(--line);font-size:13.5px}

      '<div class="box"><div class="frm"><label>从<select class="sel" id="qa">' + opts(q.a) + '</select></label><button class="swap" id="qs" title="对调">⇄</button><label>到<select class="sel" id="qb">' + opts(q.b) + '</select></label></div>' +
      '<div class="chips" style="margin:10px 0 0">' + [['LAX', 'SBA'], ['LAX', 'SAN'], ['LAX', 'SJC'], ['LAX', 'FLG'], ['ONA', 'NOL'], ['EMY', 'DEN'], ['LAX', 'SEA']].map(function (p) { return '<button data-p="' + p[0] + '>' + p[1] + '">' + esc(sn(p[0]).replace(/（.*/, '')) + '→' + esc(sn(p[1]).replace(/（.*/, '')) + '</button>'; }).join('') + '</div>' +
      '<label style="font-size:12.5px;color:var(--soft)">日期 <input type="date" class="sel" id="qd" value="' + ds + '"></label></div><div id="qr"></div>' +
      '<div class="note">只列直达车（不含换乘和 Amtrak Thruway 接驳大巴）。时间都是当地时间；「+1」表示第二天到。票价、余票在 <a href="https://www.amtrak.com/" target="_blank" rel="noopener">Amtrak 官网</a> 或 App 查。</div>';
    function go() {
      var a = $('qa').value, b = $('qb').value, dd = new Date(($('qd').value || ds) + 'T12:00:00'); if (isNaN(dd)) dd = new Date(); ls('q', { a: a, b: b });
      var res = [];
      uniq(D.trips).forEach(function (t) {
        var ia = -1, ib = -1; t.st.forEach(function (x, i) { if (x[0] === a && ia < 0) ia = i; if (x[0] === b) ib = i; });
        if (ia < 0 || ib <= ia) return;
        var start = new Date(dd); start.setDate(start.getDate() - t.st[ia][3]);   // 车次的始发日期
        if (!runs(t, start)) return;
        res.push([t, ia, ib]);
      });
      res.sort(function (x, y) { return tmin(x[0].st[x[1]][2] || x[0].st[x[1]][1]) - tmin(y[0].st[y[1]][2] || y[0].st[y[1]][1]); });
      var seen = {}; res = res.filter(function (x) { var k = x[0].no + x[0].st[x[1]][2]; if (seen[k]) return false; seen[k] = 1; return true; });
      if (!res.length) { $('qr').innerHTML = '<div class="empty">这一天没有从' + esc(sn(a)) + '直达' + esc(sn(b)) + '的车。<br>换个日期，或者看看反方向 / 换乘。</div>'; return; }
      $('qr').innerHTML = res.map(function (x, i) {
        var t = x[0], A = t.st[x[1]], B = t.st[x[2]], r = D.routes.filter(function (z) { return z.i === t.r; })[0] || {}, plus = B[3] - A[3];
        return '<div class="res" data-i="' + i + '"><div class="rh"><div class="tm">' + (A[2] || A[1]) + '</div><div class="ar2">→</div><div class="tm">' + (B[1] || B[2]) + (plus ? '<small>+' + plus + '天</small>' : '') + '</div>' +
          '<div class="rm"><b style="color:' + (r.c || 'inherit') + '">' + esc((r.zh || '').replace(/（.*/, '')) + ' ' + esc(t.no) + ' 次</b><br>' + dur(span(t, x[1], x[2])) + ' · ' + (x[2] - x[1]) + ' 站</div></div>' +
          '<div class="rb"><table class="tt">' + t.st.slice(x[1], x[2] + 1).map(function (s) { return '<tr><td>' + (s[2] || s[1]) + (s[3] - A[3] ? '<span class="d">+' + (s[3] - A[3]) + '</span>' : '') + '</td><td>' + esc(sn(s[0])) + '<small>' + esc(sen(s[0])) + '</small></td></tr>'; }).join('') + '</table></div></div>';
      }).join('');
    }
    $('qa').onchange = $('qb').onchange = $('qd').onchange = go;
    $('qs').onclick = function () { var a = $('qa').value; $('qa').value = $('qb').value; $('qb').value = a; go(); };
    $('main').onclick = function (e) {
      var p = e.target.closest('[data-p]'); if (p) { var v = p.getAttribute('data-p').split('>'); $('qa').value = v[0]; $('qb').value = v[1]; go(); return; }
      var r = e.target.closest('.res .rh'); if (r) r.parentNode.classList.toggle('open');
    };
    go();
  }

  // ---------- 📡 实时 ----------
  var LF = ls('lf') || 'west', LSEL = null;
  function delayOf(t) {   // 下一站的预计晚点（分钟）和下一站
    var st = t.stations || [], nx = null;
    for (var i = 0; i < st.length; i++) if (st[i].status === 'Enroute' || st[i].status === 'Station') { nx = st[i]; break; }
    if (!nx) return { done: st.length && st[st.length - 1].status === 'Departed', nx: null, d: 0 };
    var s = Date.parse(nx.schArr || nx.schDep), a = Date.parse(nx.arr || nx.dep);
    return { nx: nx, d: isNaN(s) || isNaN(a) ? 0 : Math.round((a - s) / 60000) };
  }
  function dcol(d) { return d <= 5 ? '#2E9D4F' : d <= 30 ? '#D29A00' : d <= 90 ? '#E07B00' : '#C0362C'; }
  function dtxt(d) { return d <= 1 ? '准点' : d < 60 ? '晚 ' + d + ' 分' : '晚 ' + Math.floor(d / 60) + ' 小时' + (d % 60 ? ' ' + d % 60 + ' 分' : ''); }
  function ltime(iso, tz) { if (!iso) return ''; try { return new Date(iso).toLocaleTimeString('zh-CN', { timeZone: tz || 'America/Los_Angeles', hour: '2-digit', minute: '2-digit', hour12: false }); } catch (e) { return iso.slice(11, 16); } }
  function live() {
    $('main').innerHTML = '<div class="lead">全美 Amtrak 列车现在在哪儿、晚了多少。每分钟自动刷新。点列车看接下来的站和预计到站时间。</div>' +
      '<div class="chips" id="lfc">' + [['west', '🌄 西部'], ['fav', '⭐ 本页这几条线'], ['all', '🇺🇸 全美']].map(function (x) { return '<button data-f="' + x[0] + '" class="' + (x[0] === LF ? 'on' : '') + '">' + x[1] + '</button>'; }).join('') + '</div>' +
      '<div class="box" style="padding:8px 12px"><input class="sel" id="lq" style="width:100%" placeholder="🔍 搜车次号或车名，比如 14、Starlight、Chief"></div>' +
      '<div class="map" id="lmap"></div><div class="box" style="padding:0" id="lls"><div class="empty">加载中…</div></div>' +
      '<div class="note">位置和晚点数据来自 <a href="https://amtraker.com/" target="_blank" rel="noopener">Amtraker</a>（整合 Amtrak 官方的列车定位，非官方项目），偶尔会延迟几分钟；以 Amtrak App 为准。颜色：🟢 准点 · 🟡 晚半小时内 · 🟠 晚一个半小时内 · 🔴 更晚。</div>';
    loadLeaflet(function () {
      var m = mkmap('lmap', 'l'); m.setView([37.5, -112], 4); m.g = L.layerGroup().addTo(m);
      D.routes.forEach(function (r) { L.polyline(r.shape, { color: r.c, weight: 2.5, opacity: .45, interactive: false }).addTo(m); });
      liveLoad();
    });
    $('main').onclick = function (e) {
      var b = e.target.closest('[data-f]'); if (b) { LF = b.getAttribute('data-f'); ls('lf', LF); var bs = $('lfc').querySelectorAll('button'); for (var i = 0; i < bs.length; i++) bs[i].className = bs[i].getAttribute('data-f') === LF ? 'on' : ''; liveDraw(); return; }
      b = e.target.closest('[data-tid]'); if (b) { LSEL = b.getAttribute('data-tid'); var mk = MAPS.l && MAPS.l.mk && MAPS.l.mk[LSEL]; if (mk) { MAPS.l.setView(mk.getLatLng(), 8); mk.openPopup(); $('lmap').scrollIntoView({ block: 'center', behavior: 'smooth' }); } }
    };
    var qt; $('lq').oninput = function () { clearTimeout(qt); qt = setTimeout(liveDraw, 250); };
  }
  function liveLoad() {
    clearTimeout(LT);
    if (!$('lmap')) return;
    var x = new XMLHttpRequest(); x.open('GET', 'https://api-v3.amtraker.com/v3/trains'); x.timeout = 20000;
    x.onload = function () { try { LIVE = JSON.parse(x.responseText); } catch (e) { } liveDraw(); };
    x.onerror = x.ontimeout = function () { if ($('lls')) $('lls').innerHTML = '<div class="empty">实时数据暂时取不到，稍后再试。</div>'; };
    x.send();
    LT = setTimeout(function () { if (!document.hidden) liveLoad(); else LT = setTimeout(liveLoad, 60000); }, 60000);
  }
  function liveDraw() {
    var m = MAPS.l; if (!m || !LIVE) return;
    var fav = {}; D.routes.forEach(function (r) { fav[r.n] = r; });
    var q = ($('lq').value || '').trim().toLowerCase(), all = [];
    Object.keys(LIVE).forEach(function (k) { (LIVE[k] || []).forEach(function (t) { if (t && t.lat) all.push(t); }); });
    var L2 = all.filter(function (t) {
      if (q) return (t.trainNum + ' ' + t.routeName).toLowerCase().indexOf(q) >= 0 || (fav[t.routeName] && fav[t.routeName].zh.indexOf(q) >= 0);
      if (LF === 'west') return t.lon < -104;
      if (LF === 'fav') return !!fav[t.routeName];
      return true;
    });
    m.g.clearLayers(); m.mk = {};
    L2.forEach(function (t) {
      var dl = delayOf(t), c = dl.done ? '#888' : dcol(dl.d), up = (t.stations || []).filter(function (s) { return s.status !== 'Departed'; }).slice(0, 5), r = fav[t.routeName];
      var mk = L.marker([t.lat, t.lon], { icon: L.divIcon({ className: 'trm', html: '<span style="background:' + c + '">' + esc(t.trainNum) + '</span>', iconSize: [34, 22], iconAnchor: [17, 11] }), zIndexOffset: r ? 500 : 0 })
        .bindPopup(function () {
          return '<div class="pp"><b>' + esc(t.trainNum) + ' 次 ' + esc(r ? r.zh.replace(/（.*/, '') : t.routeName) + '</b><br><span style="color:#888">' + esc(t.routeName) + '</span><br>' +
            (dl.done ? '已到终点' : '<b style="color:' + c + '">' + dtxt(dl.d) + '</b>' + (dl.nx ? ' · 下一站 ' + esc(ZH[dl.nx.code] || dl.nx.name) : '')) +
            (up.length ? '<table style="margin-top:6px;font-size:12.5px;border-collapse:collapse">' + up.map(function (s) { return '<tr><td style="padding:2px 8px 2px 0;white-space:nowrap"><b>' + ltime(s.arr || s.dep, s.tz) + '</b></td><td>' + esc(ZH[s.code] || s.name) + '</td></tr>'; }).join('') + '</table><span style="color:#888;font-size:11.5px">预计到站，各站当地时间</span>' : '') + '</div>';
        }, { maxWidth: 260 });
      m.g.addLayer(mk); m.mk[t.trainID] = mk;
    });
    var favL = L2.filter(function (t) { return fav[t.routeName]; }).concat(L2.filter(function (t) { return !fav[t.routeName]; }));
    $('lls').innerHTML = (favL.length ? favL.slice(0, 80).map(function (t) {
      var dl = delayOf(t), r = fav[t.routeName], c = dl.done ? '#888' : dcol(dl.d);
      return '<div class="tr" data-tid="' + esc(t.trainID) + '"><span class="no" style="background:' + (r ? r.c : '#56606E') + '">' + esc(t.trainNum) + '</span><div class="mid"><b>' + esc(r ? r.zh.replace(/（.*/, '') : t.routeName) + '</b><small>' + (dl.done ? '已到终点' : dl.nx ? '下一站 ' + esc(ZH[dl.nx.code] || dl.nx.name) + ' · 预计 ' + ltime(dl.nx.arr || dl.nx.dep, dl.nx.tz) : '') + '</small></div><span class="dl" style="color:' + c + '">' + (dl.done ? '' : dtxt(dl.d)) + '</span></div>';
    }).join('') : '<div class="empty">没有符合的列车。</div>') + (favL.length > 80 ? '<div class="note" style="padding:0 12px">只列前 80 列，地图上是全部。</div>' : '');
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && TAB === 'live' && $('lmap')) liveLoad(); });

  // ---------- 🗓️ 行程 ----------
  function trips() {
    $('main').innerHTML = '<div class="lead">从一日游到一周大环线，按难度排。点「看线路」「查时刻」直接跳过去。</div>' + TRIPS.map(function (x, i) {
      return '<div class="trip"><div class="th"><span>' + x[0] + '</span><div><b>' + x[1] + '</b><small>' + x[2] + '</small></div></div><ol>' + x[3].map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol>' +
        '<div class="go"><button data-gr="' + i + '">🗺️ 看线路</button><button data-gt="' + i + '">⏱️ 查时刻</button></div></div>';
    }).join('');
    $('main').onclick = function (e) {
      var b = e.target.closest('[data-gr]'); if (b) { RT = TRIPS[+b.getAttribute('data-gr')][4]; ls('rt', RT); setTab('routes'); return; }
      b = e.target.closest('[data-gt]'); if (b) { var p = TRIPS[+b.getAttribute('data-gt')][5]; ls('q', { a: p[0], b: p[1] }); setTab('time'); }
    };
  }

  // ---------- 文字攻略 ----------
  function guide(k) {
    var lead = { book: '买票前看一眼，能省不少钱。票价、折扣和退改规则经常变，以 Amtrak 官网为准。', seat: '西部长途车用双层的 Superliner 车厢，经济座就很舒服；过夜可以考虑卧铺。', board: '车上怎么吃、怎么睡、怎么带行李，以及长途车的老规矩。', upland: '从家出发怎么最快坐上 Amtrak。' }[k];
    var h = '<div class="lead">' + lead + '</div>' + cards(GUIDE[k] || []);
    if (k === 'upland') {
      var rows = [];
      ['ONA', 'POS', 'SNB', 'RIV', 'FUL', 'LAX'].forEach(function (c) {
        var seen = {};
        uniq(D.trips).forEach(function (t) {
          t.st.forEach(function (x, i) {
            if (x[0] !== c || i === t.st.length - 1) return;
            var r = D.routes.filter(function (z) { return z.i === t.r; })[0];
            if (!r || r.n === 'Pacific Surfliner') return;
            var key = c + t.no; if (seen[key]) return; seen[key] = 1;
            rows.push([c, x[2] || x[1], t.no, r.zh.replace(/（.*/, ''), sn(t.st[t.st.length - 1][0]).replace(/（.*/, ''), wdays(shiftDays(t.days, x[3])) + '在这站开']);
          });
        });
      });
      h += '<div class="box"><h2>🕐 离 Upland 近的站，长途车几点到</h2><table class="tt ups">' + rows.map(function (x) { return '<tr><td>' + x[1] + '</td><td><b>' + esc(sn(x[0])) + '</b> · ' + esc(x[3]) + ' ' + esc(x[2]) + ' 次 → ' + esc(x[4]) + '<small>' + x[5] + '</small></td></tr>'; }).join('') + '</table><div class="note">太平洋冲浪者号班次多，在「⏱️ 查时刻」里查。时刻会变，出发前在 App 确认。</div></div>';
    }
    $('main').innerHTML = h;
    $('main').onclick = null;
  }

  // ---------- ✅ 清单 ----------
  function pack() {
    var C = ls('pack') || {};
    function draw() {
      var n = 0, tot = 0;
      var h = '<div class="lead">出发前一项项打勾，存在这台手机上。</div>' + PACK.map(function (g, gi) {
        return '<div class="box"><h2 style="font-size:16px">' + g[0] + '</h2>' + g[1].map(function (x, i) { var k = gi + '-' + i, on = !!C[k]; tot++; if (on) n++; return '<div class="ck' + (on ? ' on' : '') + '" data-k="' + k + '"><i>' + (on ? '✓' : '') + '</i><span>' + esc(x) + '</span></div>'; }).join('') + '</div>';
      }).join('');
      h = '<div class="box" style="display:flex;align-items:center;gap:10px"><b style="font-size:18px">' + n + ' / ' + tot + '</b><span style="flex:1;color:var(--soft);font-size:13.5px">' + (n === tot ? '🎉 都准备好了，一路顺风！' : '还差 ' + (tot - n) + ' 样') + '</span><button class="swap" style="width:auto;padding:0 12px" id="pr">清空</button></div>' + h;
      $('main').innerHTML = h;
    }
    draw();
    $('main').onclick = function (e) {
      if (e.target.id === 'pr') { C = {}; ls('pack', C); draw(); return; }
      var b = e.target.closest('[data-k]'); if (b) { var k = b.getAttribute('data-k'); if (C[k]) delete C[k]; else C[k] = 1; ls('pack', C); draw(); }
    };
  }

  // ---------- 地图 ----------
  function loadLeaflet(cb) {
    if (window.L) { cb(); return; }
    var c = document.createElement('link'); c.rel = 'stylesheet'; c.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(c);
    var j = document.createElement('script'); j.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; j.onload = cb;
    j.onerror = function () { var m = document.querySelector('.map'); if (m) m.innerHTML = '<div class="empty">地图组件加载失败，请检查网络后刷新</div>'; };
    document.head.appendChild(j);
  }
  function mkmap(id, key) {
    var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.getAttribute('data-theme') !== 'light';
    var m = L.map(id, { zoomControl: true });
    L.layerGroup((function (d, k) { var E = 'https://server.arcgisonline.com/ArcGIS/rest/services/', a = { maxZoom: 19, maxNativeZoom: 16, attribution: '底图 © Esri' }, b = { maxZoom: 19, maxNativeZoom: 16 }; return d ? [L.tileLayer(E + 'Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', a), L.tileLayer(E + 'Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', b)] : k === 'gray' ? [L.tileLayer(E + 'Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', a), L.tileLayer(E + 'Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', b)] : [L.tileLayer(E + 'World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: '底图 © Esri' })]; })(dark, 'street')).addTo(m);
    MAPS[key] = m; return m;
  }

  // ---------- 启动 ----------
  var x = new XMLHttpRequest(); x.open('GET', 'amtrak/data.json?t=' + Math.floor(Date.now() / 36e5));
  x.onload = function () {
    try { D = JSON.parse(x.responseText); } catch (e) { $('main').innerHTML = '<div class="empty">加载失败，刷新试试</div>'; return; }
    $('facts').innerHTML = ['🚆 ' + D.routes.length + ' 条精选线路', '🕐 ' + uniq(D.trips).length + ' 个车次时刻', '📡 全美列车实时位置', '🏠 Upland 出发 1 小时上车'].map(function (s) { return '<span>' + s + '</span>'; }).join('');
    render();
  };
  x.onerror = function () { $('main').innerHTML = '<div class="empty">网络错误，稍后刷新</div>'; };
  x.send();
})();
</script>
