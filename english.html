<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#EEF3F7">
<title>英语练习 · ABC</title>
<style>
:root{
  --bg:#EEF3F7; --paper:#FFFFFF; --ink:#1B1E23; --soft:#5F6B76; --faint:#98A2AC; --line:#DCE3EA; --chip:#E6ECF1;
  --accent:#2466B8; --accent-ink:#FFFFFF; --accent-soft:#DCE8F7; --good:#2E7D32; --good-soft:#DDF1E1; --bad:#C8412B; --bad-soft:#F8E1DB;
  --l1:#A9C2DA; --l3:#E39A8C; --outline:#E3E8EE; --stroke:#1B1E23; --draw:#2466B8; --hint:#F2A33A;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15181C; --paper:#1F2328; --ink:#ECEEF0; --soft:#A7B0B9; --faint:#6F7881; --line:#30363D; --chip:#282D33;
    --accent:#7FB2FF; --accent-ink:#0B1422; --accent-soft:#1D2B3E; --good:#6FD07A; --good-soft:#1D3321; --bad:#FF7F66; --bad-soft:#3A2420;
    --l1:#3C4F63; --l3:#7A3E34; --outline:#343A42; --stroke:#ECEEF0; --draw:#7FB2FF; --hint:#F2B35E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{position:-webkit-sticky;position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;min-height:56px}
.brand{font-weight:700;font-size:19px;margin-right:auto;display:flex;align-items:center;cursor:pointer}
.brand i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:30px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);margin-right:8px;font-size:13px;font-weight:800;letter-spacing:-.02em}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:12px;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--soft)}
.btn:disabled{opacity:.4}
main{padding:14px 0 60px}
.view{display:none}.view.on{display:block}
.free{padding:14px 16px;margin-bottom:6px}
.free h3{margin:0 0 8px;font-size:15px}
.frow{display:flex}
.frow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;margin-right:8px;font-size:17px}
.frow input:focus{outline:2px solid var(--accent);border-color:transparent}
h2.sec{font-size:13px;letter-spacing:.06em;color:var(--faint);margin:20px 0 10px;font-weight:600;display:flex;justify-content:space-between}
.lessons{display:flex;flex-wrap:wrap;margin:0 -5px}
.lesson{width:calc(50% - 10px);margin:0 5px 10px;padding:12px 14px;cursor:pointer;text-align:left}
.lesson:hover{border-color:var(--accent)}
.l-n{font-size:12px;color:var(--faint)}
.l-t{font-weight:700;font-size:16px}
.l-c{font-size:15px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 6px}
.pbar{height:5px;background:var(--chip);border-radius:5px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--good);border-radius:5px}
.sbar{display:flex;align-items:center;margin-bottom:10px}
.sbar .ti{flex:1;text-align:center;font-weight:600}
.sbar .ti small{display:block;font-weight:400;color:var(--faint);font-size:12px}
.stage{padding:18px 12px 16px;text-align:center}
.board{display:inline-block;touch-action:none;-webkit-user-select:none;user-select:none;max-width:100%;cursor:crosshair}
.board svg{display:block}
.ipa{font-size:20px;color:var(--accent);margin-top:6px;font-family:"Lucida Sans Unicode","Arial Unicode MS","Segoe UI",sans-serif}
.zh{font-size:18px;margin-top:2px}
.pair{font-size:15px;color:var(--soft);margin-top:4px}
.ex{display:inline-block;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 14px;margin-top:10px;cursor:pointer}
.ex b{font-size:18px}
.ex span{color:var(--soft);font-size:13.5px;margin-left:6px}
.info{font-size:13px;color:var(--faint);margin-top:6px;min-height:20px}
.fb{font-size:15px;font-weight:600;min-height:24px;margin-top:4px}
.fb.ok{color:var(--good)} .fb.bad{color:var(--bad)}
.tools{display:flex;flex-wrap:wrap;justify-content:center;margin-top:10px}
.tools .btn{margin:0 4px 8px;min-width:92px}
.nav{display:flex;align-items:center;margin-top:12px}
.nav .btn{flex:1}
.nav .btn.mid{flex:1.4;margin:0 8px}
.dots{display:flex;justify-content:center;flex-wrap:wrap;margin-top:12px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);margin:0 3px 4px}
.dots i.l{background:var(--good)} .dots i.c{background:var(--accent);transform:scale(1.3)}
.qcard{padding:22px 16px;text-align:center}
.qp{font-size:14px;color:var(--soft)}
.qq{font-size:30px;font-weight:700;margin:10px 0 16px;min-height:44px}
.opts{display:flex;flex-wrap:wrap;margin:0 -5px}
.opt{width:calc(50% - 10px);margin:0 5px 10px;min-height:70px;font-size:24px;font-weight:600;border-radius:14px}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.slots{display:flex;justify-content:center;flex-wrap:wrap;margin:6px 0 14px;min-height:52px}
.slot{width:40px;height:48px;border-bottom:3px solid var(--line);margin:0 3px;font-size:28px;font-weight:700;line-height:46px;cursor:pointer}
.slot.f{border-color:var(--accent)}
.slots.ok .slot{color:var(--good);border-color:var(--good)}
.slots.no .slot{color:var(--bad);border-color:var(--bad)}
.tiles{display:flex;justify-content:center;flex-wrap:wrap}
.tile{width:48px;height:52px;margin:0 4px 8px;font-size:24px;font-weight:700;border-radius:12px;padding:0}
.tile.used{visibility:hidden}
.score{font-size:48px;font-weight:700;color:var(--accent)}
.lvtabs{display:flex;background:var(--chip);border-radius:14px;padding:4px;margin-bottom:12px}
.lvt{flex:1;border:0;background:transparent;border-radius:10px;padding:7px 2px;font-size:15px;font-weight:600;color:var(--soft);line-height:1.2}
.lvt small{display:block;font-size:10.5px;font-weight:400;opacity:.8}
.lvt.on{background:var(--paper);color:var(--accent);box-shadow:var(--shadow)}
.levhome{padding:14px 16px;margin-bottom:16px;cursor:pointer;display:block;width:100%;text-align:left;background:linear-gradient(135deg,var(--accent-soft),var(--paper))}
.levhome b{font-size:17px}.levhome div{font-size:13px;color:var(--soft);margin-top:3px;font-weight:400}
.lvtop{padding:14px 10px;margin-bottom:12px}
.lvstats{display:flex;text-align:center}.lvstats div{flex:1}.lvstats b{display:block;font-size:26px;color:var(--accent);font-weight:800}.lvstats span{font-size:12px;color:var(--soft)}
.lvsub{font-size:13px;color:var(--soft)}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;margin:0 0 12px}
.tabs button{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:6px 13px;margin:0 3px 6px;font-size:14px;color:var(--soft)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.fam{padding:12px 14px;margin-bottom:10px;cursor:pointer}.fam.done{border-color:var(--good)}
.fam .fb0{display:flex;align-items:center}.fam .mid{flex:1;margin-left:12px;min-width:0}
.fam .cnt{font-size:12.5px;color:var(--good);font-weight:600}
.rule{font-size:22px;white-space:nowrap;min-width:64px}.rule b{color:var(--accent)}
.rule.big{font-size:36px;text-align:center}
.tipb{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0;text-align:left;line-height:1.7}
.blk{text-align:left;font-size:14px;padding:7px 0;border-bottom:1px dashed var(--line)}.blk span{display:inline-block;min-width:64px;font-weight:700;color:var(--accent)}
.numout{font-size:26px;font-weight:700;margin:12px 0 4px;word-break:break-word}
.pchip{display:inline-block;background:var(--chip);border-radius:8px;padding:1px 8px;margin:2px}
.row{display:flex;flex-wrap:wrap;justify-content:center;margin-top:10px}.row .btn{margin:0 4px 8px}
.pairs{text-align:left}.pair2{display:flex;align-items:baseline;flex-wrap:wrap;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:17px}
.pair2 .en{color:var(--soft)}.pair2 i{font-style:normal;color:var(--faint);margin:0 8px}.pair2 small{margin-left:auto;color:var(--faint);font-size:12.5px;padding-left:8px}
.pair2.got b{color:var(--good)}
.opt.small{font-size:17px}
.rule.vpat{font-size:16px;white-space:normal;max-width:130px}.rule.big.vpat{font-size:26px;max-width:none}
.sbar .ti small{display:block;font-weight:400;color:var(--faint);font-size:12px}
.hint{font-size:12.5px;color:var(--faint);text-align:center;margin-top:14px;line-height:1.7}
@media (max-width:420px){ .lesson{width:calc(100% - 10px)} .tools .btn{min-width:0;flex:1 1 40%} }
/* idi-css */
.idhome{background:linear-gradient(135deg,var(--good-soft),var(--paper))}
.idhome .today{margin-top:7px;font-size:13.5px;color:var(--ink)}
.idhome .today b{font-size:14.5px;color:var(--good)}
.idc{position:relative;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.idc.done{border-color:var(--good)}
.idc.done:after{content:'✓';position:absolute;top:10px;right:14px;color:var(--good);font-weight:800}
.idc.open{border-color:var(--accent)}
.idc .h{display:flex;align-items:baseline;flex-wrap:wrap;padding-right:20px}
.idc .h b{font-size:18px;margin-right:10px}
.idc .h span{color:var(--accent);font-size:14.5px;font-weight:600}
.idc .s{font-size:13px;color:var(--soft);margin-top:2px}
.idc .x{display:none;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.idc.open .x{display:block}
.idc .row{justify-content:flex-start;margin-top:6px}.idc .row .btn{margin:0 8px 0 0}
.idl{font-size:14px;margin:3px 0;line-height:1.6}.idl b{color:var(--accent)}
.zhl{color:var(--soft);font-size:13px}
.exl{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin:6px 0;font-size:15.5px;line-height:1.5}
.exl b{color:var(--accent)}.exl small{display:block;color:var(--soft);font-size:13px}
.cw{color:var(--bad);font-size:15px}
.idc .h b.cr{color:var(--good)}
.opt.wide{width:calc(100% - 10px);min-height:54px;font-size:16.5px;padding:8px 12px;line-height:1.35}
.qsent{font-weight:600;line-height:1.55}
.qsub{font-size:14px;font-weight:400;color:var(--soft);margin-top:4px;line-height:1.55}
.blank{display:inline-block;min-width:72px;border-bottom:2px solid var(--accent);color:transparent;line-height:1.2}
.lvstats.four b{font-size:22px}
.idrow .btn{padding:8px 11px;margin:0 3px 8px}
.tabs.idtabs button{padding:6px 11px}
/* /idi-css */
/* pw-css */
.pwm{color:#2563C9;font-weight:700}.pwf{color:#C93A6E;font-weight:700}
@media (prefers-color-scheme: dark){.pwm{color:#86B6FF}.pwf{color:#FF8DB7}}
.pwhome{background:linear-gradient(135deg,rgba(242,163,58,.24),var(--paper))!important}
.pwv{position:fixed;left:0;top:0;right:0;bottom:0;z-index:60;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;color:var(--ink)}
.pwv.on{display:block}
.pwv button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pwv .pwtop{position:-webkit-sticky;position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;min-height:54px;padding:0 6px}
.pwv .pwti{flex:1;text-align:center;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pwv .pwb{border:0;background:transparent;color:var(--soft);font-size:15px;padding:10px 6px;min-width:78px}
.pwv .pwwrap{max-width:720px;margin:0 auto;padding:12px 16px 70px}
.pwv .pwintro{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7;margin-bottom:10px}
.pwv .pwrow{display:flex;flex-wrap:wrap;justify-content:center;margin:4px 0 8px}
.pwv .pwbtn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:8px 13px;min-height:42px;font-size:14.5px;margin:0 4px 8px}
.pwv .pwbtn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.pwv .pwbtn.good{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.pwv .pwbtn:disabled{opacity:.4}
.pwv .pwbtn.pwbig{font-size:30px;padding:10px 34px;margin-top:10px}
.pwv .pwstat{font-size:13px;color:var(--faint);text-align:center;margin:0 0 10px}.pwv .pwstat b{color:var(--good)}
.pwv .pwcats{display:flex;flex-wrap:wrap;margin:0 -5px}
.pwv .pwcat{position:relative;overflow:hidden;width:calc(50% - 10px);margin:0 5px 10px;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px 8px 14px;text-align:center;color:var(--ink)}
.pwv .pwcat .ic{display:block;font-size:40px;line-height:1.25}
.pwv .pwcat b{display:block;font-size:16px;margin-top:2px}
.pwv .pwcat small{color:var(--soft);font-size:12.5px}
.pwv .pwcat i{position:absolute;left:0;bottom:0;height:4px;background:var(--good)}
.pwv .pwgrid{display:flex;flex-wrap:wrap;margin:0 -4px}
.pwv .pwt{width:calc(33.333% - 8px);margin:0 4px 8px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 2px;text-align:center;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:120px}
.pwv .pwt .em{font-size:46px;line-height:1.2}
.pwv .pwt .w{font-size:15px;font-weight:700;margin-top:2px;line-height:1.25;word-break:break-word}
.pwv .pwt .s{font-size:12px;color:var(--soft);margin-top:1px}
.pwv .pwt.got{border-color:var(--good)}
.pwv .pwt.rd{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pwv .pwgrid.hid .pwt .w,.pwv .pwgrid.hid .pwt .s{visibility:hidden}
.pwv .pwgrid.hid .pwt.peek .w,.pwv .pwgrid.hid .pwt.peek .s{visibility:visible}
.pwv .pwpy{display:block;font-size:12.5px;color:var(--soft);font-weight:500;line-height:1.3}
.pwv .pwzh{display:block;font-size:24px;font-family:"Kaiti SC","STKaiti","KaiTi",serif;line-height:1.25}
.pwv .pwhint{font-size:12.5px;color:var(--faint);text-align:center;margin-top:8px}
.pwv .pwdet{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);text-align:center;padding:18px 14px 16px;margin-bottom:12px}
.pwv .pwdet .em{font-size:118px;line-height:1.15;cursor:pointer;display:inline-block}
.pwv .pwdet .w{font-size:34px;font-weight:800;margin-top:4px;line-height:1.3}
.pwv .pwdet .w .pwpy{font-size:22px;color:var(--accent)}.pwv .pwdet .w .pwzh{font-size:66px;font-weight:700}
.pwv .pwdet .s{font-size:17px;color:var(--soft)}
.pwv .pwnote{background:var(--chip);border-radius:10px;padding:8px 12px;margin-top:10px;font-size:14px;line-height:1.7;font-weight:400;color:var(--ink)}
.pwv .pwnav{display:flex}.pwv .pwnav .pwbtn{flex:1}
.pwv .pwpop{animation:pwpop .45s}
@keyframes pwpop{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-5deg)}100%{transform:scale(1)}}
.pwv .pwq{text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px 12px;margin-bottom:12px}
.pwv .pwq .lab{font-size:14px;color:var(--soft)}
.pwv .pwq .bigem{font-size:104px;line-height:1.2}
.pwv .pwq .bigw{font-size:34px;font-weight:800;margin:8px 0 4px}
.pwv .pwq .bigw .pwzh{font-size:60px}
.pwv .pwblank{display:inline-block;min-width:60px;height:.9em;border-bottom:3px solid var(--accent);vertical-align:baseline}
.pwv .pwopts{display:flex;flex-wrap:wrap;margin:0 -5px}
.pwv .pwo{width:calc(50% - 10px);margin:0 5px 10px;background:var(--paper);border:1px solid var(--line);border-radius:16px;color:var(--ink);min-height:66px;font-size:21px;font-weight:700;padding:8px}
.pwv .pwopts.em .pwo{min-height:112px;font-size:62px;line-height:1.1}
.pwv .pwopts.tx .pwo .pwzh{font-size:32px}
.pwv .pwo.gm{color:#2563C9}.pwv .pwo.gf{color:#C93A6E}
.pwv .pwo.right{background:var(--good-soft);border-color:var(--good)}
.pwv .pwo.wrong{background:var(--bad-soft,#F8E1DB);border-color:var(--bad,#C8412B)}
.pwv .pwfb{text-align:center;font-size:19px;font-weight:700;min-height:30px;line-height:1.5}
.pwv .pwfb .pwzh,.pwv .pwfb .pwpy{display:inline;font-size:inherit}
.pwv .pwfb .pwpy{margin-right:4px;color:var(--soft)}
.pwv .pwfb small{font-size:14px;color:var(--soft);font-weight:400}
.pwv .pwfb.ok{color:var(--good)}.pwv .pwfb.bad{color:var(--bad,#C8412B)}
.pwv .pwdone{text-align:center;padding:30px 10px}
.pwv .pwdone .stars{font-size:46px;letter-spacing:6px}.pwv .pwdone .stars .dim{opacity:.2}
.pwv .pwdone .sc{font-size:44px;font-weight:800;color:var(--accent);margin-top:6px}
.pwv .pwdone .msg{color:var(--soft);margin:4px 0 16px}
@media (prefers-color-scheme: dark){.pwv .pwo.gm{color:#86B6FF}.pwv .pwo.gf{color:#FF8DB7}}
/* /pw-css */
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="bar">
  <div class="brand" id="homeBtn"><i>ABC</i>英语练习</div>
</div></div></header>
<main class="wrap">
  <section class="view on" id="vHome"></section>
  <section class="view" id="vStudy"></section>
  <section class="view" id="vQuiz"></section>
  <section class="view" id="vLev"></section>
  <section class="view" id="vIdi"></section>
</main>
<script>
/* Manuscript letter strokes on 四线三格.  Lines at y=0,40,80,120 (baseline = 80).
   Each letter: [width, [stroke path, ...]] — strokes in standard order and direction. */
var LETTERS = {
  A: [60, ['M30 0 L5 80', 'M30 0 L55 80', 'M15 52 L45 52']],
  B: [58, ['M8 0 L8 80', 'M8 0 L30 0 C49 0 49 38 30 38 C56 38 56 80 32 80 L8 80']],
  C: [56, ['M52 14 C45 3 37 0 30 0 C12 0 4 20 4 40 C4 60 12 80 30 80 C38 80 46 76 52 66']],
  D: [60, ['M8 0 L8 80', 'M8 0 L24 0 C46 0 54 20 54 40 C54 60 46 80 24 80 L8 80']],
  E: [56, ['M8 0 L8 80', 'M8 0 L50 0', 'M8 40 L44 40', 'M8 80 L50 80']],
  F: [54, ['M8 0 L8 80', 'M8 0 L50 0', 'M8 40 L44 40']],
  G: [60, ['M54 14 C47 3 39 0 31 0 C12 0 4 20 4 40 C4 62 14 80 31 80 C45 80 54 72 54 58 L54 44', 'M34 44 L54 44']],
  H: [60, ['M8 0 L8 80', 'M52 0 L52 80', 'M8 40 L52 40']],
  I: [40, ['M20 0 L20 80']],

<script id="pwMod">

  function wordHTML(it, noPy) {
    if (LANG === 'zh') return (noPy ? '' : '<span class="pwpy">' + esc(it[3]) + '</span>') + '<span class="pwzh">' + esc(it[2]) + '</span>';
    if (LANG === 'es') { var a = art(it); return a ? '<span class="pw' + a.g + '">' + a.a + '</span> ' + esc(a.n) : esc(it[4]); }

      if (v.t === 'pct') return { t: 'pct', n: Math.max(1, tweak(v.n) % 100) };
      return Math.random() < 0.5 ? { t: 'frac', a: Math.min(v.b - 1, v.a + 1) || 1, b: v.b } : { t: 'frac', a: v.a, b: v.b + 1 };
    }
    var n = tweak(v); return n > 0 ? n : v + 3;
  }
  function numQuiz() {
    var qs = [], i, modes = NMODES[LEVEL];
    for (i = 0; i < 10; i++) {
      var mode = modes[i % modes.length], v = randIn(mode), a = show1(mode, v), opts = [a.w], seen = {}, g = 0, listen = i % 2 === 1;
      seen[a.w] = 1;
      var keys = [a.k];
      while (opts.length < 4 && g++ < 60) { var r = show1(mode, tweakV(mode, v)); if (!seen[r.w]) { seen[r.w] = 1; opts.push(r.w); keys.push(r.k); } }
      var oo = [], k;
      for (k = 0; k < opts.length; k++) oo.push({ w: listen ? keys[k] : opts[k] });
      qs.push({ custom: true, ans: oo[0], opts: shuffle(oo), label: listen ? '听一听，是哪个？' : '用英语怎么说？（' + MNAME[mode] + '）', prompt: listen ? '<button class="btn primary" id="qSay" style="font-size:22px;padding:10px 26px">🔊</button>' : '<span style="font-size:40px">' + esc(a.k) + '</span>', say: a.w, sayFirst: listen, small: !listen, fb: '<b>' + esc(a.k) + '</b> = ' + esc(a.w) });
    }
    runQuiz({ l: null, qs: qs, back: showLev, again: numQuiz, onDone: function (p) { if (p >= 80) setLev(LEVEL + ':num', 1); } });
  }

  /* ----- generic lists ----- */
  var INTRO = {
    rimes: '英语很多单词只差第一个字母。学会一个<b>结尾发音</b>（比如 -at），换个开头字母就能读出一串词：cat hat bat mat…',
    affixes: { elem: '学会一个<b>小词缀</b>，认识的词马上翻倍：help → helper → helpful → helpless。', mid: '学会一个<b>前缀或后缀</b>，就能把认识的词「变形」：happy → unhappy → happiness。一个后缀能管几百个词！', high: '高中阅读里的长词，大多是「前缀 + 词 + 后缀」拼起来的。认得词缀，生词也能猜个八九不离十。' },
    families: '一个<b>词根</b>可以长出一整个家族：help → helper, helpful, helpless…认识一个，家族全认识。',
    roots: { high: '很多英语单词来自拉丁语。认识一个<b>拉丁词根</b>，比如 spect = 看，就能猜出 inspect、spectator、perspective…', col: '学术英语大量使用希腊、拉丁<b>词根</b>。chron = 时间，就能读懂 chronic、chronology、synchronize…' },
    conv: '同一个词可以变成<b>名词、动词、形容词、副词</b>。记住一个，四种词性全拿下，写作不再词穷。',
    prefixes: '学术前缀意思固定：anti- 反、multi- 多、post- 后…看到前缀，生词意思先猜对一半。',
    suffixes: '学术后缀告诉你<b>这个词是什么</b>：-ology 是学科，-ism 是主义，-ee 是被…的人。',
    verbs: '不规则动词不用一个个死背。它们其实<b>按规律成组</b>：sing-sang-sung、drink-drank-drunk… 记住一个规律，一组全会。'
  };
  function introOf(tab) { var x = INTRO[tab]; return typeof x === 'string' ? x : x[LEVEL] || ''; }
  function renderList(tab) {
    var kind = KIND[tab], xs = LD()[tab], h = '<div class="tipb">' + introOf(tab) + '</div>', i;
    for (i = 0; i < xs.length; i++) {
      var x = xs[i], on = LEV[lk(tab, headOf(kind, x))], ws = wordsOf(kind, x);
      var sub = kind === 'affix' ? esc(x.mean) : kind === 'rime' ? '/' + esc(x.ipa) + '/' : kind === 'verb' ? esc(x.zh) : esc(x.zh);
      var pv = kind === 'verb' ? ws.slice(0, 3).map(function (w) { return w[2].slice(0, 3).join('-'); }).join(' · ') : ws.slice(0, 6).map(function (w) { return w[0]; }).join(' ');
      h += '<div class="card fam' + (on ? ' done' : '') + '" data-i="' + i + '"><div class="fb0"><div class="rule' + (kind === 'verb' ? ' vpat' : '') + '"><b>' + esc(headOf(kind, x)) + '</b></div><div class="mid"><div class="cnt">' + (on ? '✓ 已学会 · ' : '') + '解锁 ' + ws.length + ' 个词 · ' + sub + '</div><div class="lvsub">' + esc(pv) + '</div></div></div></div>';
    }
    $('lvBody').innerHTML = h;
    var cs = $('lvBody').querySelectorAll('.fam');
    for (i = 0; i < cs.length; i++) cs[i].onclick = function () { levSel = +this.getAttribute('data-i'); showLev(); };
  }
  function renderOne(tab, i) {
    var kind = KIND[tab], x = LD()[tab][i], k0 = lk(tab, headOf(kind, x)), on = LEV[k0], ws = wordsOf(kind, x), k;
    var h = '<div class="card stage"><div class="rule big' + (kind === 'verb' ? ' vpat' : '') + '"><b>' + esc(headOf(kind, x)) + '</b></div>';
    if (kind === 'rime') h += '<div class="lvsub">/' + esc(x.ipa) + '/　换开头字母，就是新单词</div>';
    else if (kind === 'affix') h += '<div class="lvsub">' + esc(x.mean) + '</div><div class="tipb">' + esc(x.rule) + '</div>';
    else if (kind === 'verb') h += '<div class="lvsub">' + esc(x.zh) + '</div><div class="tipb">' + esc(x.tip) + '</div>';
    else h += '<div class="lvsub">' + esc(x.zh) + '</div>';
    h += '<div class="pairs">';
    for (k = 0; k < ws.length; k++) {
      var w = ws[k], head;
      if (kind === 'rime') head = '<span class="en">' + esc(w[0].slice(0, w[0].length - x.rime.length)) + '</span><b style="color:var(--accent)">' + esc(x.rime) + '</b>';
      else if (kind === 'verb') head = '<b>' + esc(w[2][0]) + '</b><i>·</i><b style="color:var(--accent)">' + esc(w[2][1]) + '</b><i>·</i><b style="color:var(--accent)">' + esc(w[2][2]) + '</b>';
      else head = (kind === 'affix' ? '<span class="en">' + esc(w[2]) + '</span><i>→</i>' : '') + '<b>' + esc(w[0]) + '</b>';
      h += '<div class="pair2" data-say="' + esc(kind === 'verb' ? w[2].slice(0, 3).join(', ') : w[0]) + '">' + head + '<small>' + esc(w[1]) + '</small></div>';
    }
    h += '</div><div class="row"><button class="btn primary" id="lQuiz">🎯 考考我</button>' + (kind === 'verb' ? '' : '<button class="btn" id="lWrite">✍️ 练写</button>') + '<button class="btn ' + (on ? 'good' : '') + '" id="lGot">' + (on ? '✓ 已学会' : '✓ 我学会了') + '</button></div></div>';
    $('lvBody').innerHTML = h;
    var ps = $('lvBody').querySelectorAll('.pair2');
    for (k = 0; k < ps.length; k++) ps[k].onclick = function () { say(this.getAttribute('data-say')); };
    $('lQuiz').onclick = function () { oneQuiz(tab, i); };
    if ($('lWrite')) $('lWrite').onclick = function () {
      var items = ws.map(function (w) { return { w: w[0], ipa: '', zh: w[1] }; });
      openLesson({ id: 'lev', kind: 'words', title: headOf(kind, x), items: items, back: showLev }, -1);
    };
    $('lGot').onclick = function () { setLev(k0, !LEV[k0]); showLev(); };
  }
  function bare(a) { return a.replace(/-/g, ''); }
  function affixWrong(list, x, base, right) {
    var out = [], i, alts = x.affix.split('/'), mine = bare(alts[0]), a, b;
    var naive = x.kind === 'prefix' ? mine + base : base + mine;
    if (naive !== right) out.push(naive);
    for (i = 0; i < alts.length; i++) for (var j = 0; j < alts.length; j++) if (i !== j) { a = bare(alts[i]); b = bare(alts[j]); if (right.indexOf(a) >= 0) out.push(right.replace(a, b)); }
    var rest = [];
    for (i = 0; i < list.length; i++) {
      if (list[i].kind !== x.kind || list[i].affix === x.affix) continue;
      a = bare(list[i].affix.split('/')[0]);
      rest.push(x.kind === 'prefix' ? a + base : base + a);
    }
    return out.concat(shuffle(rest));
  }
  function edForm(b) { return /e$/.test(b) ? b + 'd' : /[^aeiou]y$/.test(b) ? b.slice(0, -1) + 'ied' : b + 'ed'; }
  function oneQuiz(tab, i) {
    var kind = KIND[tab], list = LD()[tab], x = list[i], ws = wordsOf(kind, x), pool = shuffle(ws.slice()).slice(0, 10), qs = [], k;
    for (k = 0; k < pool.length; k++) {
      var w = pool[k], opts, seen = {}, j, cand = [], q, right = w[0];
      if (kind === 'affix') {
        cand = affixWrong(list, x, w[2], w[0]);
        var shown = x.kind === 'prefix' ? x.affix + ' + ' + w[2] : w[2] + ' + ' + x.affix;
        q = { label: '加上词缀，正确拼写是？', prompt: '<span style="font-size:26px">' + esc(shown) + '</span><div style="font-size:16px;font-weight:400;color:var(--soft)">' + esc(w[1]) + '</div>' };
      } else if (kind === 'verb') {
        var v = w[2], which = Math.random() < 0.5 ? 1 : 2;
        right = v[which];
        cand = [v[3 - which], edForm(v[0]), v[0], /[^aeiou][aeiou][bdgklmnprt]$/.test(v[0]) ? v[0] + v[0].slice(-1) + 'ed' : '', v[which] + 'ed'];
        q = { label: which === 1 ? '过去式是？' : '过去分词是？', prompt: '<span style="font-size:30px">' + esc(v[0]) + '</span><div style="font-size:16px;font-weight:400;color:var(--soft)">' + esc(v[3]) + ' · ' + (which === 1 ? '过去式' : '过去分词') + '</div>' };
        if (v[1] === v[2]) q.label = '过去式 / 过去分词是？';
      } else if (kind === 'rime') {
        var oth = shuffle(ws.slice()); for (j = 0; j < oth.length; j++) cand.push(oth[j][0]);
        q = { label: '听一听，是哪个词？', prompt: '<button class="btn primary" id="qSay" style="font-size:22px;padding:10px 26px">🔊</button>', sayFirst: true };
      } else {
        var oth2 = shuffle(ws.slice()); for (j = 0; j < oth2.length; j++) cand.push(oth2[j][0]);
        q = { label: '哪个词是这个意思？', prompt: '<span style="font-size:24px">' + esc(w[1]) + '</span>' + (tab === 'roots' ? '<div style="font-size:15px;font-weight:400;color:var(--soft)">词根 ' + esc(x.root) + ' = ' + esc(x.zh) + '</div>' : '') };
      }
      opts = [{ w: right }]; seen[right] = 1;
      for (j = 0; j < cand.length && opts.length < 4; j++) if (cand[j] && !seen[cand[j]]) { seen[cand[j]] = 1; opts.push({ w: cand[j] }); }
      q.custom = true; q.ans = opts[0]; q.opts = shuffle(opts); q.say = right; q.small = true;
      q.fb = kind === 'verb' ? '<b>' + esc(w[2].slice(0, 3).join(' · ')) + '</b> · ' + esc(w[1]) : '<b>' + esc(w[0]) + '</b> · ' + esc(w[1]);
      qs.push(q);
    }
    runQuiz({ l: null, qs: qs, back: showLev, again: function () { oneQuiz(tab, i); }, onDone: function (p) { if (p >= 80) setLev(lk(tab, headOf(kind, x)), 1); } });
  }

  /* ----- compounds ----- */
  function renderComp(tab) {
    var cs = LD()[tab], h = '<div class="card stage"><div class="tipb">两个认识的小词拼在一起，就是一个新词：sun + flower = sunflower（向日葵）。<b>不用背，猜得出来！</b>答对一个解锁一个。</div><div class="row"><button class="btn primary" id="cPlay">▶ 猜一猜</button></div><div class="pairs">', i;
    for (i = 0; i < cs.length; i++) h += '<div class="pair2' + (LEV[lk(tab, cs[i][2])] ? ' got' : '') + '" data-say="' + esc(cs[i][2]) + '"><span class="en">' + esc(cs[i][0]) + ' + ' + esc(cs[i][1]) + '</span><i>=</i><b>' + esc(cs[i][2]) + '</b><small>' + esc(cs[i][3]) + '</small></div>';
    h += '</div></div>';
    $('lvBody').innerHTML = h;
    $('cPlay').onclick = function () { compQuiz(tab); };
    var ps = $('lvBody').querySelectorAll('.pair2');
    for (i = 0; i < ps.length; i++) ps[i].onclick = function () { say(this.getAttribute('data-say')); };
  }
  function compQuiz(tab) {
    var all = LD()[tab], pool = shuffle(all.slice()).slice(0, 10), qs = [], i;
    for (i = 0; i < pool.length; i++) {
      (function (c) {
        var opts = [{ w: c[3] }], oth = shuffle(all.slice()), k;
        for (k = 0; k < oth.length && opts.length < 4; k++) if (oth[k][2] !== c[2]) opts.push({ w: oth[k][3] });
        qs.push({ custom: true, ans: opts[0], opts: shuffle(opts), small: true, label: '猜猜这个合成词是什么意思？', prompt: '<span style="font-size:26px">' + esc(c[0]) + ' + ' + esc(c[1]) + ' = <b>' + esc(c[2]) + '</b></span>', say: c[2], sayFirst: true, fb: '<b>' + esc(c[2]) + '</b> · ' + esc(c[3]), onRight: function () { setLev(lk(tab, c[2]), 1); } });
      })(pool[i]);
    }
    runQuiz({ l: null, qs: qs, back: showLev, again: function () { compQuiz(tab); } });
  }

  showHome();
})();
</script>
