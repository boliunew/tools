<!DOCTYPE html>
<html lang="zh-CN" data-tw="mid">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="wide.css?v=3">
<script src="theme.js?v=1"></script>
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A5C">
<title>机票比价</title>
<style>
:root{
  --bg:#F2F2EE; --paper:#FFFFFF; --ink:#1C2230; --soft:#566070; --faint:#959DA8; --line:#E0E1DA; --chip:#EAEBE5;
  --acc:#1F6FB8; --acc-soft:#DDEBF8; --red:#B8322A; --red-soft:#F7E2DF; --gold:#B5841C; --gold-soft:#F6ECD3; --green:#2E7D4F; --onacc:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(30,40,60,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151B; --paper:#1A1F28; --ink:#E7EAF0; --soft:#A8B0BD; --faint:#6D7582; --line:#29303B; --chip:#232A34;
  --acc:#7DB6EE; --acc-soft:#1A2A3E; --red:#F07563; --red-soft:#3A221F; --gold:#E8BB57; --gold-soft:#372C14; --green:#6FCB95; --onacc:#0E1A2A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#12151B; --paper:#1A1F28; --ink:#E7EAF0; --soft:#A8B0BD; --faint:#6D7582; --line:#29303B; --chip:#232A34;
  --acc:#7DB6EE; --acc-soft:#1A2A3E; --red:#F07563; --red-soft:#3A221F; --gold:#E8BB57; --gold-soft:#372C14; --green:#6FCB95; --onacc:#0E1A2A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;font-size:15px;line-height:1.6;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.hero{position:relative;overflow:hidden;color:#F3F5FA;background:linear-gradient(170deg,#2F6BA8 0%,#1F3A5C 55%,#142336 100%);padding:calc(16px + env(safe-area-inset-top)) 0 18px}
.hero:before{content:"✈";position:absolute;right:14px;top:6px;font-size:96px;opacity:.09;transform:rotate(-18deg);pointer-events:none}
.hero .wrap{position:relative}
.hero a.home{color:#F3F5FA;text-decoration:none;font-size:13px;opacity:.75}
.hero h1{margin:6px 0 0;font-size:27px;letter-spacing:.03em;font-family:"Songti SC","STSong","Noto Serif SC",Georgia,serif}
.hero h1 small{font-family:Georgia,serif;font-size:14px;font-weight:400;opacity:.75;margin-left:8px;letter-spacing:.1em}
.hero p{margin:8px 0 0;font-size:13.5px;opacity:.9;line-height:1.65}

.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-top:14px}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 14px;font-size:14px;color:var(--soft)}
.seg button.on{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.od{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end;margin-top:12px}
.f label{display:block;font-size:12px;color:var(--faint);margin:0 0 3px 2px}
.f input,.f select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 11px;font-size:16px;outline:none;min-width:0}
.f input:focus,.f select:focus{border-color:var(--acc)}
.f input.code{text-transform:uppercase;font-weight:700;letter-spacing:.08em;font-size:20px}
.f .nm{font-size:12px;color:var(--soft);margin:3px 0 0 2px;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swap{border:1px solid var(--line);background:var(--paper);border-radius:50%;width:40px;height:40px;font-size:18px;margin-bottom:26px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.row3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips .lb{font-size:12px;color:var(--faint);align-self:center;margin-right:2px}
.chips button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:13px}
.chips button b{font-weight:700;margin-right:3px}
.go{display:block;width:100%;margin-top:14px;border:0;border-radius:12px;background:var(--acc);color:var(--onacc);font-size:16px;font-weight:700;padding:12px}
.err{color:var(--red);font-size:13px;margin-top:8px}
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:12px}
.site{display:block;text-decoration:none;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.site b{display:block;font-size:15px}
.site small{display:block;color:var(--soft);font-size:12px;line-height:1.45;margin-top:2px}
.site.top{border-color:var(--acc);background:var(--acc-soft)}
.site.dim{opacity:.72}
.flexrow{margin-top:10px}
.flexrow .lb2{display:block;font-size:12px;color:var(--faint);margin:0 0 3px 2px}
.seg.full{display:flex;width:100%}
.seg.full button{flex:1;padding:6px 4px;font-size:13.5px}
.note{margin-top:12px;background:var(--gold-soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.65}
.note b{color:var(--ink)}
.note ol{margin:4px 0 0;padding-left:20px}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:1px;background:var(--acc);color:var(--onacc)}
.tag.w{background:var(--chip);color:var(--soft)}
.sum{font-size:14px;color:var(--soft);margin-top:12px}
.sum b{color:var(--ink)}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acts button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 12px;font-size:13.5px}

.sec{margin:22px 0 8px}.sec h2{margin:0;font-size:18px}.sec p{margin:2px 0 0;font-size:13px;color:var(--soft)}
.saved{display:flex;flex-direction:column;gap:6px}
.rt{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.rt .t{flex:1;cursor:pointer}
.rt .t b{letter-spacing:.05em}
.rt .t small{display:block;color:var(--faint);font-size:12px}
.rt button{border:0;background:transparent;color:var(--faint);font-size:18px;padding:2px 6px}
.empty{color:var(--faint);font-size:13.5px;padding:6px 2px}

.it{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;box-shadow:var(--shadow);overflow:hidden}
.it .q{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;cursor:pointer;font-weight:600;font-size:15px;line-height:1.45}
.it .q span{flex:1}.it .q i{font-style:normal;color:var(--faint);font-weight:400;transition:transform .15s}
.it.open .q i{transform:rotate(180deg)}
.it .a{display:none;padding:0 14px 12px;font-size:14.5px;line-height:1.75}
.it.open .a{display:block}
.it .a ul{margin:4px 0;padding-left:20px}
.it .a li{margin:3px 0}
.check label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.check label:last-child{border-bottom:0}
.check input{margin-top:5px;width:17px;height:17px;accent-color:var(--acc)}
.check label.done span{color:var(--faint);text-decoration:line-through}
.foot{font-size:12px;color:var(--faint);margin-top:18px;line-height:1.6}
@media (max-width:420px){.f input.code{font-size:18px}.row,.row3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <a class="home" href="./">← 工具箱</a>
  <h1>✈️ 机票比价<small>FLIGHTS</small></h1>
  <p>填一次航线和日期，一键在 Google Flights、Kayak、Skyscanner、Expedia、西南航空、Trip.com 同时查价。保存常飞航线，下次点一下就查。下面还有省钱技巧和出发前清单。</p>
</div></header>

<main class="wrap">
  <section class="card" id="form">
    <div class="seg" id="trip">
      <button data-v="rt" class="on">往返</button><button data-v="ow">单程</button>
    </div>
    <div class="od">
      <div class="f"><label for="from">出发</label><input id="from" class="code" list="aps" maxlength="3" autocomplete="off" placeholder="ONT"><div class="nm" id="fromNm"></div></div>
      <button class="swap" id="swap" title="对调">⇄</button>
      <div class="f"><label for="to">到达</label><input id="to" class="code" list="aps" maxlength="3" autocomplete="off" placeholder="SFO"><div class="nm" id="toNm"></div></div>
    </div>
    <div class="row">
      <div class="f"><label for="d1">去程</label><input id="d1" type="date"></div>
      <div class="f" id="d2box"><label for="d2">返程</label><input id="d2" type="date"></div>
    </div>
    <div class="row3">
      <div class="f"><label for="pax">成人</label><select id="pax"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div>
      <div class="f"><label for="cab">舱位</label><select id="cab"><option value="e">经济舱</option><option value="p">超级经济舱</option><option value="b">商务舱</option><option value="f">头等舱</option></select></div>
    </div>
    <div class="flexrow"><span class="lb2">退改要求</span>
      <div class="seg full" id="flex"><button data-v="c" class="on">💰 最便宜</button><button data-v="a">🔁 能改签</button><button data-v="r">💵 全额可退</button></div>
    </div>
    <div class="chips" id="near"></div>
    <div class="chips" id="far"></div>
    <button class="go" id="go">🔍 比价</button>
    <div class="err" id="err" hidden></div>
    <div id="out" hidden>
      <div class="sum" id="sum"></div>
      <div class="note" id="note" hidden></div>
      <div class="sites" id="sites"></div>
      <div class="acts">
        <button id="save">⭐ 保存这条航线</button>
        <button id="copy">📋 复制 Google Flights 链接</button>
      </div>
    </div>
  </section>
  <datalist id="aps"></datalist>

  <div class="sec"><h2>⭐ 我的航线</h2><p>点一下自动填好日期并查价（日期默认 3 周后出发）</p></div>
  <div class="saved" id="saved"></div>

  <div class="sec"><h2>🕘 最近查过</h2></div>
  <div class="saved" id="recent"></div>

  <div class="sec"><h2>💡 省钱技巧</h2><p>规则以航空公司和美国交通部最新规定为准</p></div>
  <div id="tips"></div>

  <div class="sec"><h2>🧳 出发前清单</h2><p>打勾会记在这台设备上，点“重置”清空</p></div>
  <div class="card check" id="check"></div>
  <div class="acts"><button id="reset">↺ 重置清单</button></div>

  <p class="foot">只是帮你打开各网站的搜索，不收集任何信息。</p>
</main>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function ls(k, v) {
    try {
      if (v === undefined) { var r = localStorage.getItem('flights:' + k); return r == null ? null : JSON.parse(r); }
      localStorage.setItem('flights:' + k, JSON.stringify(v));
    } catch (e) { return null; }
  }

  // ---------- 机场 ----------
  var AP = {
    ONT: '安大略（离 Upland 最近）', LAX: '洛杉矶国际', BUR: '伯班克', SNA: '橙县 John Wayne', LGB: '长滩', PSP: '棕榈泉', SAN: '圣地亚哥',
    SFO: '旧金山', OAK: '奥克兰', SJC: '圣何塞', SMF: '萨克拉门托', LAS: '拉斯维加斯', PHX: '凤凰城', SEA: '西雅图', PDX: '波特兰',
    SLC: '盐湖城', DEN: '丹佛', DFW: '达拉斯', IAH: '休斯顿', ORD: '芝加哥', ATL: '亚特兰大', MCO: '奥兰多', MIA: '迈阿密',
    JFK: '纽约肯尼迪', EWR: '纽瓦克', LGA: '纽约拉瓜迪亚', BOS: '波士顿', IAD: '华盛顿杜勒斯', DCA: '华盛顿里根', HNL: '檀香山', ANC: '安克雷奇',
    YVR: '温哥华', YYZ: '多伦多', MEX: '墨西哥城', CUN: '坎昆', SJD: '洛斯卡沃斯', GDL: '瓜达拉哈拉',
    PVG: '上海浦东', SHA: '上海虹桥', PEK: '北京首都', PKX: '北京大兴', CAN: '广州', SZX: '深圳', CTU: '成都双流', TFU: '成都天府', CKG: '重庆',
    XMN: '厦门', HGH: '杭州', WUH: '武汉', NKG: '南京', TAO: '青岛', SHE: '沈阳', HKG: '香港', MFM: '澳门', TPE: '台北桃园',
    NRT: '东京成田', HND: '东京羽田', KIX: '大阪关西', ICN: '首尔仁川', SIN: '新加坡', BKK: '曼谷', MNL: '马尼拉',
    LHR: '伦敦希思罗', CDG: '巴黎戴高乐', FRA: '法兰克福', AMS: '阿姆斯特丹', FCO: '罗马', MAD: '马德里', BCN: '巴塞罗那', IST: '伊斯坦布尔', DXB: '迪拜'
  };
  var NEAR = ['ONT', 'LAX', 'BUR', 'SNA', 'LGB', 'PSP'];
  var FAR = ['SFO', 'SJC', 'LAS', 'SEA', 'JFK', 'PVG', 'PEK', 'CAN', 'HKG', 'TPE'];
  var US = /^(ONT|LAX|BUR|SNA|LGB|PSP|SAN|SFO|OAK|SJC|SMF|LAS|PHX|SEA|PDX|SLC|DEN|DFW|IAH|ORD|ATL|MCO|MIA|JFK|EWR|LGA|BOS|IAD|DCA|HNL|ANC)$/;
  var ASIA_CN = /^(PVG|SHA|PEK|PKX|CAN|SZX|CTU|TFU|CKG|XMN|HGH|WUH|NKG|TAO|SHE|HKG|MFM|TPE)$/;

  $('aps').innerHTML = Object.keys(AP).map(function (c) { return '<option value="' + c + '">' + esc(AP[c]) + '</option>'; }).join('');

  var last = 'from';
  function chipRow(el, lb, list) {
    el.innerHTML = '<span class="lb">' + lb + '</span>' + list.map(function (c) { return '<button data-ap="' + c + '"><b>' + c + '</b>' + esc(AP[c].replace(/（.*）/, '')) + '</button>'; }).join('');
  }
  chipRow($('near'), '家附近', NEAR);
  chipRow($('far'), '常去', FAR);
  ['from', 'to'].forEach(function (k) {
    $(k).addEventListener('focus', function () { last = k; });
    $(k).addEventListener('input', function () { this.value = this.value.toUpperCase().replace(/[^A-Z]/g, ''); nm(k); });
  });
  function nm(k) { var c = $(k).value; $(k + 'Nm').textContent = AP[c] || (c.length === 3 ? '（不在常用列表，也能查）' : ''); }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-ap]'); if (!b) return;
    $(last).value = b.getAttribute('data-ap'); nm(last);
    if (last === 'from' && !$('to').value) { last = 'to'; $('to').focus(); }
  });
  $('swap').onclick = function () { var a = $('from').value; $('from').value = $('to').value; $('to').value = a; nm('from'); nm('to'); };

  // ---------- 往返 / 单程 ----------
  var TRIP = 'rt';
  function setTrip(v) {
    TRIP = v;
    [].forEach.call($('trip').children, function (b) { b.className = b.getAttribute('data-v') === v ? 'on' : ''; });
    $('d2box').style.visibility = v === 'rt' ? 'visible' : 'hidden';
  }
  $('trip').onclick = function (e) { var b = e.target.closest('button'); if (b) setTrip(b.getAttribute('data-v')); };

  // ---------- 退改要求 ----------
  var FLEX = 'c';
  var FLEXN = { c: '最便宜', a: '能改签', r: '全额可退' };
  function setFlex(v) {
    FLEX = FLEXN[v] ? v : 'c';
    [].forEach.call($('flex').children, function (b) { b.className = b.getAttribute('data-v') === FLEX ? 'on' : ''; });
  }
  $('flex').onclick = function (e) { var b = e.target.closest('button'); if (!b) return; setFlex(b.getAttribute('data-v')); if (CUR) search(read()); };

  // ---------- 日期 ----------
  function iso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function plus(n) { var d = new Date(); d.setDate(d.getDate() + n); return iso(d); }
  function defaultDates() { $('d1').value = plus(21); $('d2').value = plus(25); }
  $('d1').min = $('d2').min = plus(0);
  $('d1').addEventListener('change', function () { if ($('d2').value && $('d2').value < this.value) { var d = new Date(this.value + 'T12:00'); d.setDate(d.getDate() + 4); $('d2').value = iso(d); } });

  // ---------- 生成链接 ----------
  function yymmdd(s) { return s.slice(2, 4) + s.slice(5, 7) + s.slice(8, 10); }
  function mdy(s) { return s.slice(5, 7) + '/' + s.slice(8, 10) + '/' + s.slice(0, 4); }
  var CAB = {
    g: { e: '', p: ' premium economy', b: ' business class', f: ' first class' },
    k: { e: '', p: '/premium', b: '/business', f: '/first' },
    s: { e: 'economy', p: 'premiumeconomy', b: 'business', f: 'first' },
    x: { e: 'economy', p: 'premium', b: 'business', f: 'first' },
    t: { e: 'y', p: 's', b: 'c', f: 'f' },
    n: { e: '经济舱', p: '超级经济舱', b: '商务舱', f: '头等舱' }
  };
  function links(q) {
    var rt = q.trip === 'rt', a = q.from, b = q.to, n = q.pax, c = q.cab, fx = q.flex || 'c', L = [];
    var GF = { c: '最全最快，看价格日历、开价格追踪', a: '选好航班后挑 Economy / Main Cabin 档，别选 Basic', r: '选好航班后挑写着 Refundable 的那一档' };
    var KY = { c: '比价网站，含小航司和组合票', a: '打开左侧「Flexible options」筛选 → 只看不收改签费的', r: '先开「Flexible options」筛选，再到航司官网选 Refundable 档' };
    var THIRD = '第三方网站：退改要先找它们，比较麻烦';
    var gq = 'Flights from ' + a + ' to ' + b + ' on ' + q.d1 + (rt ? ' through ' + q.d2 : ' one way') + CAB.g[c] + (n > 1 ? ' for ' + n + ' adults' : '');
    L.push({ n: 'Google Flights', d: GF[fx], u: 'https://www.google.com/travel/flights?q=' + encodeURIComponent(gq), top: 1, tag: fx !== 'c' ? '先看这里' : '' });
    L.push({ n: 'Kayak', d: KY[fx], top: fx !== 'c', tag: fx !== 'c' ? '有筛选' : '', u: 'https://www.kayak.com/flights/' + a + '-' + b + '/' + q.d1 + (rt ? '/' + q.d2 : '') + CAB.k[c] + '/' + n + 'adults?sort=bestflight_a' });
    L.push({ n: 'Skyscanner', d: fx !== 'c' ? THIRD : '国际航线常有便宜代理价', dim: fx !== 'c', u: 'https://www.skyscanner.com/transport/flights/' + a.toLowerCase() + '/' + b.toLowerCase() + '/' + yymmdd(q.d1) + '/' + (rt ? yymmdd(q.d2) + '/' : '') + '?adultsv2=' + n + '&cabinclass=' + CAB.s[c] + '&rtn=' + (rt ? 1 : 0) });
    L.push({ n: 'Expedia', d: fx !== 'c' ? THIRD : '机票 + 酒店打包有时更省', dim: fx !== 'c', u: 'https://www.expedia.com/Flights-Search?trip=' + (rt ? 'roundtrip' : 'oneway') + '&leg1=' + encodeURIComponent('from:' + a + ',to:' + b + ',departure:' + mdy(q.d1) + 'TANYT') + (rt ? '&leg2=' + encodeURIComponent('from:' + b + ',to:' + a + ',departure:' + mdy(q.d2) + 'TANYT') : '') + '&passengers=' + encodeURIComponent('adults:' + n) + '&options=' + encodeURIComponent('cabinclass:' + CAB.x[c]) + '&mode=search' });
    if (US.test(a) && US.test(b)) {
      L.push({ n: '西南航空 Southwest', d: fx !== 'c' ? '官网每档票价都写了能不能改、能不能退现金' : '票价不一定全在比价网站上，官网再看一眼', u: 'https://www.southwest.com/air/booking/select.html?originationAirportCode=' + a + '&destinationAirportCode=' + b + '&departureDate=' + q.d1 + (rt ? '&returnDate=' + q.d2 : '') + '&tripType=' + (rt ? 'roundtrip' : 'oneway') + '&adultPassengersCount=' + n });
    }
    if (fx !== 'c' && (US.test(a) || US.test(b))) {
      [['United 联合航空', 'https://www.united.com/'], ['Delta 达美航空', 'https://www.delta.com/'], ['American 美国航空', 'https://www.aa.com/'], ['Alaska 阿拉斯加航空', 'https://www.alaskaair.com/']].forEach(function (x) {
        L.push({ n: x[0], d: '航司官网直接订，退改最好办（需在官网重新填一次航线）', u: x[1], tag: '官网' });
      });
    }
    L.push({ n: 'Trip.com 携程', dim: fx !== 'c', d: fx !== 'c' ? THIRD : (ASIA_CN.test(a) || ASIA_CN.test(b) ? '回国航线常更便宜，中文客服' : '亚洲航线和中文客服'), u: 'https://us.trip.com/flights/showfarefirst?dcity=' + a.toLowerCase() + '&acity=' + b.toLowerCase() + '&ddate=' + q.d1 + (rt ? '&rdate=' + q.d2 : '') + '&triptype=' + (rt ? 'rt' : 'ow') + '&class=' + CAB.t[c] + '&quantity=' + n, top: fx === 'c' && (ASIA_CN.test(a) || ASIA_CN.test(b)) });
    if (fx === 'c') L.push({ n: 'Kayak 随便去', d: '不知道去哪？看从 ' + a + ' 出发哪里便宜', u: 'https://www.kayak.com/explore/' + a + '-anywhere' });
    return L;
  }

  function read() {
    return { trip: TRIP, from: $('from').value.trim(), to: $('to').value.trim(), d1: $('d1').value, d2: $('d2').value, pax: +$('pax').value, cab: $('cab').value, flex: FLEX };
  }
  function fill(q) {
    setTrip(q.trip || 'rt'); $('from').value = q.from || ''; $('to').value = q.to || ''; nm('from'); nm('to');
    if (q.d1 && q.d1 >= plus(0)) { $('d1').value = q.d1; $('d2').value = q.d2 || ''; } else defaultDates();
    $('pax').value = String(q.pax || 1); $('cab').value = q.cab || 'e'; setFlex(q.flex || 'c');
  }
  function bad(q) {
    if (!/^[A-Z]{3}$/.test(q.from) || !/^[A-Z]{3}$/.test(q.to)) return '出发和到达请填 3 位机场代码，比如 ONT、SFO、PVG';
    if (q.from === q.to) return '出发和到达是同一个机场';
    if (!q.d1) return '请选去程日期';
    if (q.trip === 'rt' && (!q.d2 || q.d2 < q.d1)) return '返程日期要在去程之后';
    return '';
  }
  var CUR = null;
  function search(q) {
    var m = bad(q);
    $('err').hidden = !m; $('err').textContent = m;
    if (m) { $('out').hidden = true; return; }
    CUR = q;
    var L = links(q);
    $('sum').innerHTML = '<b>' + q.from + ' → ' + q.to + '</b> · ' + (q.trip === 'rt' ? q.d1 + ' 去，' + q.d2 + ' 回' : q.d1 + ' 单程') + ' · ' + q.pax + ' 人 · ' + CAB.n[q.cab] + ' · ' + FLEXN[q.flex || 'c'] + '<br>点下面任意一家打开（新窗口）：';
    var NOTE = {
      a: '<b>🔁 能改签</b>：美国几家大航空公司的普通经济舱（Economy / Main Cabin）及以上改签一般不收手续费，只补差价；取消多半退成<b>航空公司积分</b>，不是现金。<ol><li>别选 <b>Basic Economy（基本经济舱）</b>。</li><li>Kayak 打开「Flexible options」筛选最快。</li><li>付款前看 Fare rules，确认写着 “No change fee”。</li></ol>',
      r: '<b>💵 全额可退</b>：要退回信用卡，得买写明 <b>Refundable / Fully Refundable</b> 的票，通常贵不少。<ol><li>在 Google Flights 或航司官网的票价档位里选标 Refundable 的那档。</li><li>最好在<b>航空公司官网</b>直接订，退款直接找航司。</li><li>付款前看 Fare rules：要写 “Refundable”，只写 “No change fee” 的取消只给积分。</li><li>只是怕订错？出发前 7 天以上在官网订的票，<b>24 小时内</b>本来就能全额退。</li></ol>'
    };
    $('note').hidden = !NOTE[q.flex]; $('note').innerHTML = NOTE[q.flex] || '';
    $('sites').innerHTML = L.map(function (l) { return '<a class="site' + (l.top ? ' top' : '') + (l.dim ? ' dim' : '') + '" target="_blank" rel="noopener" href="' + esc(l.u) + '"><b>' + esc(l.n) + ' ↗' + (l.tag ? '<span class="tag">' + esc(l.tag) + '</span>' : '') + (l.dim ? '<span class="tag w">不推荐</span>' : '') + '</b><small>' + esc(l.d) + '</small></a>'; }).join('');
    $('out').hidden = false;
    var r = (ls('recent') || []).filter(function (x) { return !(x.from === q.from && x.to === q.to && x.d1 === q.d1 && x.d2 === q.d2 && x.trip === q.trip); });
    r.unshift(q); ls('recent', r.slice(0, 6)); ls('last', q);
    renderLists();
  }
  $('go').onclick = function () { search(read()); };
  $('form').addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); search(read()); } });
  $('copy').onclick = function () {
    if (!CUR) return; var u = links(CUR)[0].u, b = this;
    function ok() { b.textContent = '✅ 已复制'; setTimeout(function () { b.textContent = '📋 复制 Google Flights 链接'; }, 1500); }
    if (navigator.clipboard) navigator.clipboard.writeText(u).then(ok, function () { prompt('复制这个链接', u); }); else prompt('复制这个链接', u);
  };
  $('save').onclick = function () {
    if (!CUR) return;
    var s = ls('saved') || [];
    if (!s.some(function (x) { return x.from === CUR.from && x.to === CUR.to && x.trip === CUR.trip; })) s.unshift({ from: CUR.from, to: CUR.to, trip: CUR.trip, pax: CUR.pax, cab: CUR.cab, flex: CUR.flex });
    ls('saved', s.slice(0, 20)); renderLists();
    this.textContent = '✅ 已保存'; var b = this; setTimeout(function () { b.textContent = '⭐ 保存这条航线'; }, 1500);
  };

  function rowHtml(x, i, kind) {
    var sub = kind === 'saved'
      ? (x.trip === 'rt' ? '往返' : '单程') + ' · ' + (x.pax || 1) + ' 人 · ' + CAB.n[x.cab || 'e'] + (x.flex && x.flex !== 'c' ? ' · ' + FLEXN[x.flex] : '') + ' · ' + esc(AP[x.from] || '') + ' → ' + esc(AP[x.to] || '')
      : (x.trip === 'rt' ? x.d1 + ' → ' + x.d2 : x.d1 + ' 单程') + ' · ' + x.pax + ' 人 · ' + CAB.n[x.cab] + (x.flex && x.flex !== 'c' ? ' · ' + FLEXN[x.flex] : '');
    return '<div class="rt"><div class="t" data-run="' + kind + ':' + i + '"><b>' + x.from + ' → ' + x.to + '</b><small>' + sub + '</small></div>' +
      (kind === 'saved' ? '<button data-flip="' + i + '" title="反向">⇄</button><button data-del="' + i + '" title="删除">×</button>' : '') + '</div>';
  }
  function renderLists() {
    var s = ls('saved') || [], r = ls('recent') || [];
    $('saved').innerHTML = s.length ? s.map(function (x, i) { return rowHtml(x, i, 'saved'); }).join('') : '<div class="empty">还没有。查一次价，点“⭐ 保存这条航线”。</div>';
    $('recent').innerHTML = r.length ? r.map(function (x, i) { return rowHtml(x, i, 'recent'); }).join('') : '<div class="empty">还没有查过。</div>';
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-run]'), d = e.target.closest('[data-del]'), f = e.target.closest('[data-flip]'), s = ls('saved') || [];
    if (t) {
      var p = t.getAttribute('data-run').split(':'), x = (ls(p[0]) || [])[+p[1]]; if (!x) return;
      var q = { trip: x.trip, from: x.from, to: x.to, pax: x.pax, cab: x.cab, flex: x.flex, d1: p[0] === 'recent' ? x.d1 : '', d2: p[0] === 'recent' ? x.d2 : '' };
      fill(q); search(read()); $('form').scrollIntoView({ behavior: 'smooth' });
    } else if (d) { s.splice(+d.getAttribute('data-del'), 1); ls('saved', s); renderLists(); }
    else if (f) { var y = s[+f.getAttribute('data-flip')]; fill({ trip: y.trip, from: y.to, to: y.from, pax: y.pax, cab: y.cab, flex: y.flex }); search(read()); $('form').scrollIntoView({ behavior: 'smooth' }); }
  });

  // ---------- 技巧 ----------
  var TIPS = [
    ['什么时候买最便宜', '<ul><li>美国国内：一般提前 <b>1–3 个月</b>；国际和回国：提前 <b>2–6 个月</b>。</li><li>感恩节、圣诞、春节、暑假要更早，越临近越贵。</li><li>“周二买票最便宜”基本不灵。真正有用的是<b>哪天飞</b>：周二、周三、周六出发通常比周五、周日便宜。</li><li>在 Google Flights 搜完点“价格图 / 日期网格”，整月一眼看完，前后挪一两天常能省不少。</li></ul>'],
    ['让价格来找你：开价格追踪', '<ul><li>Google Flights 搜索结果页打开“追踪价格”，降价会发邮件。</li><li>想买但不急的航线先追踪两三周，心里有个“正常价”，看到明显低于它就下手。</li><li>多试“附近机场”：洛杉矶一带 ONT、LAX、BUR、SNA、LGB 价格可能差很多。ONT 离 Upland 近、停车便宜、排队短；LAX 国际航线最多。</li></ul>'],
    ['想要能退能改：怎么买', '<ul><li><b>能改</b>和<b>能退</b>不是一回事。美国大航空公司（United、Delta、American、Alaska）的普通经济舱及以上，改签一般不收手续费，只补差价；取消多半给<b>航空公司积分</b>，不退现金。</li><li>要退回信用卡，得买写明 <b>Refundable / Fully Refundable</b> 的票，价格高不少。</li><li>Basic Economy 通常不能改、不能退。</li><li>上面的比价选「🔁 能改签」或「💵 全额可退」，会提示每家网站怎么筛，并给出航司官网。Kayak 左侧有「Flexible options」筛选。</li><li>最好在航司官网订，付款前一定看 Fare rules。</li><li>西南航空 2025–2026 年改了票价档位，以官网每档写的规则为准。</li></ul>'],
    ['基本经济舱（Basic Economy）要看清', '<ul><li>最便宜的那档通常：<b>不能选座</b>、改签受限或不能改、登机最晚。</li><li>有的航空公司国内基本经济舱<b>不能带大件随身行李</b>，到登机口要补钱托运，反而更贵。</li><li>两个人想坐一起、或带大箱子，直接比较“普通经济舱 + 行李”的总价。</li></ul>'],
    ['订错了？24 小时内免费取消', '<ul><li>美国交通部规定：<b>出发前 7 天以上</b>直接在航空公司订的票，<b>24 小时内</b>可以免费取消（或免费保留价格）。</li><li>所以看到好价可以先订住，再慢慢确认假期。</li><li>通过第三方网站买的票，退改要按那家网站的规则，麻烦时先找它们的客服。</li></ul>'],
    ['航班取消或大延误：可以要现金退款', '<ul><li>航空公司取消航班，或大幅改动（国内延误 3 小时以上、国际 6 小时以上等），你选择不坐，有权拿<b>原路退款</b>，不必接受代金券。</li><li>需要改签时，先在 App 里自己改，往往比排队快；同时打客服电话，谁先接通用谁。</li><li>天气原因航空公司一般不赔餐宿，但机械故障等航空公司原因，大航司通常会给餐券或酒店，记得主动问。</li></ul>'],
    ['回国 / 国际航线', '<ul><li>直飞省时间，转机常便宜几百刀。转机留够时间：国际转国际一般至少 2 小时，要过海关再转的更长。</li><li>同一张票转机（联程）误了下一段航空公司负责；自己拼的两张票误机自己负责，别把时间卡太紧。</li><li>经济舱托运行李额度各家不同，<b>以订票页面写的为准</b>，转机时按最严的那家准备。</li><li>回国航线可以多看 Trip.com 和航司官网，两边价格有时不一样。</li></ul>'],
    ['“隐藏城市”票能买吗', '<ul><li>做法：买 A→B→C 的票，在 B 下飞机（因为比直飞 A→B 便宜）。</li><li>违反航空公司条款：后续航段（包括回程）可能被取消，常旅客账户可能被封。</li><li>千万不能托运行李（行李会直接到 C）。不建议常用。</li></ul>'],
    ['里程和信用卡', '<ul><li>常飞一两家航空公司就注册常旅客，免费，积少成多。</li><li>航空联名卡常有免费托运行李、优先登机，一年托运几次就回本；先算年费再办。</li><li>里程换票要早，热门航线和节假日的“奖励票”位置很少。</li></ul>']
  ];
  var OPEN = ls('open') || {};
  $('tips').innerHTML = TIPS.map(function (t, i) { return '<div class="it' + (OPEN[i] ? ' open' : '') + '" data-k="' + i + '"><div class="q"><span>' + t[0] + '</span><i>▾</i></div><div class="a">' + t[1] + '</div></div>'; }).join('');
  $('tips').onclick = function (e) {
    var q = e.target.closest('.q'); if (!q) return; var it = q.parentNode, k = it.getAttribute('data-k');
    it.classList.toggle('open'); OPEN[k] = it.classList.contains('open'); ls('open', OPEN);
  };

  // ---------- 出发前清单 ----------
  var CHECK = [
    '证件：国内航班带 REAL ID 驾照或护照；国际航线护照有效期够长，签证 / 入境要求查清楚',
    '起飞前 24 小时在 App 值机，选座，存好电子登机牌',
    '查托运和随身行李的尺寸、重量和件数（基本经济舱尤其注意）',
    '液体放透明袋：每瓶不超过 100 ml（3.4 oz）',
    '充电宝和备用锂电池只能随身带，不能托运',
    '药、证件、钥匙、充电线、一套换洗衣服放随身包',
    '提前到机场：国内约 2 小时，国际约 3 小时；节假日再早一点',
    '机场停车或接送安排好；ONT、LAX 都可以提前在官网订停车',
    '信用卡告知出境（国际），手机开通国际漫游或买好当地流量卡',
    '把航班号发给家人，App 打开航班状态提醒'
  ];
  var DONE = ls('done') || {};
  function renderCheck() {
    $('check').innerHTML = CHECK.map(function (c, i) { return '<label class="' + (DONE[i] ? 'done' : '') + '"><input type="checkbox" data-c="' + i + '"' + (DONE[i] ? ' checked' : '') + '><span>' + esc(c) + '</span></label>'; }).join('');
  }
  $('check').onchange = function (e) { var i = e.target.getAttribute('data-c'); if (i == null) return; DONE[i] = e.target.checked; ls('done', DONE); renderCheck(); };
  $('reset').onclick = function () { DONE = {}; ls('done', DONE); renderCheck(); };

  // ---------- 启动 ----------
  renderCheck(); renderLists();
  var lq = ls('last');
  if (lq) fill(lq); else { setTrip('rt'); $('from').value = 'ONT'; nm('from'); defaultDates(); }
  // 支持链接带参数：flights.html#ONT-PVG
  var h = (location.hash || '').replace('#', '').toUpperCase().match(/^([A-Z]{3})-([A-Z]{3})$/);
  if (h) { $('from').value = h[1]; $('to').value = h[2]; nm('from'); nm('to'); }
})();
